<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>FollowUp Pro</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#0d1117;
    color:white;
    padding:15px;
}

.container{
    max-width:700px;
    margin:auto;
}

/* العنوان */

.header{
    background:#0626b8;
    border-radius:25px;
    padding:30px 20px;
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    font-size:36px;
    margin-bottom:8px;
}

.header p{
    font-size:22px;
}

/* صندوق الإضافة */

.add-box{
    background:#1f1f1f;
    border-radius:25px;
    padding:20px;
    margin-bottom:20px;
}

input,
textarea{
    width:100%;
    background:#292929;
    color:white;
    border:1px solid #555;
    border-radius:15px;
    padding:18px;
    margin-bottom:12px;
    font-size:18px;
    outline:none;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus{
    border-color:#315cff;
}

.add-btn{
    width:100%;
    border:0;
    border-radius:15px;
    padding:18px;
    background:#063fd4;
    color:white;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
}

/* بطاقة العميل */

.customer{
    background:#1f1f1f;
    border-right:6px solid #1748ff;
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
}

.customer h2{
    font-size:24px;
    margin-bottom:10px;
}

.customer p{
    font-size:18px;
    margin:8px 0;
    color:#ddd;
}

/* الأزرار */

.buttons{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.call,
.whatsapp,
.delete{
    flex:1;
    border:0;
    border-radius:12px;
    padding:15px 8px;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.call{
    background:#008f16;
}

.whatsapp{
    background:#12a83a;
}

.delete{
    background:#b00020;
}

/* لا يوجد عملاء */

.empty{
    text-align:center;
    background:#1f1f1f;
    border-radius:20px;
    padding:30px;
    color:#aaa;
    font-size:19px;
}

/* موبايل */

@media(max-width:500px){

    body{
        padding:10px;
    }

    .header h1{
        font-size:30px;
    }

    .header p{
        font-size:19px;
    }

    .buttons{
        flex-direction:column;
    }

    .call,
    .whatsapp,
    .delete{
        width:100%;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- العنوان -->

    <div class="header">

        <h1>FollowUp Pro 📞</h1>

        <p>برنامج متابعة العملاء</p>

    </div>


    <!-- إضافة عميل -->

    <div class="add-box">

        <input
            type="text"
            id="name"
            placeholder="اسم العميل"
        >

        <input
            type="tel"
            id="phone"
            placeholder="رقم الموبايل"
        >

        <textarea
            id="note"
            placeholder="ملاحظات"
        ></textarea>

        <button
            class="add-btn"
            onclick="addCustomer()"
        >
            إضافة العميل ➕
        </button>

    </div>


    <!-- قائمة العملاء -->

    <div id="list"></div>

</div>


<script>

let customers =
    JSON.parse(localStorage.getItem("customers")) || [];


/* إضافة عميل */

function addCustomer(){

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const note =
        document.getElementById("note").value.trim();


    if(!name){

        alert("من فضلك اكتب اسم العميل");

        return;
    }


    if(!phone){

        alert("من فضلك اكتب رقم الموبايل");

        return;
    }


    const customer = {

        id: Date.now(),

        name: name,

        phone: phone,

        note: note

    };


    customers.push(customer);

    saveCustomers();

    document.getElementById("name").value = "";

    document.getElementById("phone").value = "";

    document.getElementById("note").value = "";

    renderCustomers();

}


/* حفظ العملاء */

function saveCustomers(){

    localStorage.setItem(
        "customers",
        JSON.stringify(customers)
    );

}


/* تحويل الرقم لرقم واتساب */

function whatsappNumber(phone){

    let number =
        phone.replace(/\D/g,"");


    /*
       لو الرقم مصري ويبدأ بـ 01
       نحذف الصفر ونضيف 20
    */

    if(number.startsWith("01")){

        number =
            "20" + number.substring(1);

    }

    /*
       لو مكتوب أصلًا 20
    */

    else if(number.startsWith("20")){

        number = number;

    }

    return number;

}


/* فتح واتساب */

function openWhatsApp(phone){

    const number =
        whatsappNumber(phone);

    const url =
        "https://wa.me/" + number;

    window.location.href = url;

}


/* حذف العميل */

function deleteCustomer(id){

    if(!confirm("هل تريد حذف هذا العميل؟")){

        return;

    }


    customers =
        customers.filter(
            customer => customer.id !== id
        );


    saveCustomers();

    renderCustomers();

}


/* عرض العملاء */

function renderCustomers(){

    const list =
        document.getElementById("list");


    if(customers.length === 0){

        list.innerHTML = `
            <div class="empty">
                لا يوجد عملاء حتى الآن 👥
            </div>
        `;

        return;

    }


    list.innerHTML =
        customers.map(customer => `

        <div class="customer">

            <h2>
                ${escapeHTML(customer.name)}
            </h2>

            <p>
                📞 ${escapeHTML(customer.phone)}
            </p>

            <p>
                ${escapeHTML(customer.note || "لا توجد ملاحظات")}
            </p>


            <div class="buttons">

                <button
                    class="call"
                    onclick="window.location.href='tel:${escapeAttribute(customer.phone)}'"
                >
                    اتصال 📞
                </button>


                <button
                    class="whatsapp"
                    onclick="openWhatsApp('${escapeAttribute(customer.phone)}')"
                >
                    واتساب 💬
                </button>


                <button
                    class="delete"
                    onclick="deleteCustomer(${customer.id})"
                >
                    حذف 🗑️
                </button>

            </div>

        </div>

    `).join("");

}


/* حماية النصوص */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(text){

    return String(text)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}


/* تشغيل البرنامج */

renderCustomers();

</script>

</body>
</html>
