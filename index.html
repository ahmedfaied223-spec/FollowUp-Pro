*{box-sizing:border-box}

:root{
 --bg:#07111f;
 --card:#101c2d;
 --card2:#16243a;
 --border:#263750;
 --text:#f8fafc;
 --muted:#94a3b8;
 --blue:#2563eb;
 --green:#16a34a;
 --red:#dc2626;
 --orange:#d97706;
 --purple:#7c3aed;
 --cyan:#0891b2;

body{
 margin:0;
 background:
 radial-gradient(circle at top,#172554 0,#07111f 38%);
 color:var(--text);
 font-family:Tahoma,Arial,sans-serif;

button,input,select,textarea{font-family:inherit}

.container{
 width:100%;

 padding:12px;

 background:linear-gradient(135deg,#1d4ed8,#4f46e5);

.header-top{

 justify-content:space-between;
 align-items:center;

.header h1{
 margin:0;
 font-size:25px;
}

.header p{
 margin:8px 0 0;
 color:#dbeafe;
}

.header-buttons{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
}

.small-btn{
 border:0;
 border-radius:12px;
 padding:10px 12px;
 background:#ffffff20;
 color:white;
 font-weight:bold;
}

.card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:20px;
 padding:16px;
 margin-bottom:14px;
 box-shadow:0 8px 25px #0002;
}

.card h2{
 margin:0 0 14px;
 font-size:18px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:11px;
}

.full{
 grid-column:1/-1;
}

label{

 color:#cbd5e1;
 margin-bottom:6px;
 font-size:13px;
}

input,select,textarea{
 width:100%;
 background:#081426;
 color:white;
 border:1px solid #334155;
 border-radius:13px;
 padding:13px;
 outline:none;
 font-size:15px;
}

input:focus,select:focus,textarea:focus{
 border-color:#3b82f6;
 box-shadow:0 0 0 3px #2563eb22;
}

textarea{
 min-height:85px;
 resize:vertical;
}

.main-btn{
 width:100%;
 border:0;
 border-radius:14px;
 padding:14px;
 background:linear-gradient(135deg,#2563eb,#4f46e5);
 color:white;
 font-size:16px;
 font-weight:bold;
 margin-top:13px;
}

.stats{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:8px;
 margin-bottom:14px;
}

.stat{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:16px;
 padding:13px 5px;
 text-align:center;

.stat b{
 display:block;
 font-size:22px;
}

.stat span{
 color:var(--muted);
 font-size:11px;
}

.search-row{
 display:grid;
 grid-template-columns:2fr 1fr;
 gap:9px;
}

.customer{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:20px;
 overflow:hidden;
 margin-bottom:12px;
}

.customer-head{
 background:linear-gradient(135deg,#17243a,#1e293b);
 padding:14px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.customer-name{
 font-size:18px;
 font-weight:bold;
}

.type{
 min-width:40px;
 text-align:center;
 border-radius:20px;
 padding:6px 11px;
 font-weight:bold;

.type-A{background:#7f1d1d}
.type-B{background:#78350f}
.type-C{background:#14532d}

.customer-body{

 font-weight:bold;

.orange{background:#78350f}
.blue{background:#1e3a8a}
.purple{background:#581c87}
.gray{background:#334155}
.cyan{background:#164e63}

 display:none;
 align-items:center;
 justify-content:center;
 z-index:1000;
 padding:12px;

.modal.show{display:flex}

.modal-box{
 width:100%;
 max-width:700px;
 max-height:92vh;
 overflow:auto;
 background:var(--card);
 border:1px solid var(--border);
 border-radius:22px;
 padding:17px;

<div class="search-row">

</div>

/* =========================================================

========================================================= */

function showMessage(text){

 const box=document.getElementById("message");

 box.textContent=text;
 box.style.display="block";

 clearTimeout(window.messageTimer);

 window.messageTimer=setTimeout(()=>{
  box.style.display="none";
 },2500);
}


/* =========================================================
   تاريخ اليوم
========================================================= */

function today(){

 const d=new Date();

 return d.getFullYear()+"-"+
 String(d.getMonth()+1).padStart(2,"0")+"-"+
 String(d.getDate()).padStart(2,"0");
}


/* =========================================================
   رقم ID
========================================================= */

function newId(){

 return Date.now().toString()+"_"+Math.random()
 .toString(36).substring(2,8);

}


/* =========================================================
   تنظيف HTML
========================================================= */

function escapeHTML(value){

 return String(value || "")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


/* =========================================================
   تحميل البيانات
========================================================= */

function loadCustomers(){

 const raw=localStorage.getItem(DB_KEY);

 if(raw){

  try{

   const data=JSON.parse(raw);

   if(Array.isArray(data)){

    customers=data;

    normalizeCustomers();

    return;

   }

  }catch(e){

   console.error(e);

  }

 }


 /*
   أول تشغيل:
   ندخل العملاء اللي بعتهم المستخدم
 */

 customers=initialCustomers.map(item=>({

  id:newId(),

  serial:item.serial || "",

  name:item.name || "",

  phone:item.phone || "",

  pharmacyCode:item.pharmacyCode || "",

  address:"",

  type:"C",

  date:"",

  notes:"",

  orderStatus:"none",

  calls:{},

  noAnswer:{},

  reminderKey:""

 }));

 saveCustomers();

}


/* =========================================================
   توحيد البيانات القديمة
========================================================= */

function normalizeCustomers(){

 customers.forEach(c=>{

  if(!c.id)c.id=newId();

  if(!c.calls)c.calls={};

  if(!c.noAnswer)c.noAnswer={};

  if(c.pharmacyCode===undefined)c.pharmacyCode="";

  if(c.serial===undefined)c.serial="";

  if(c.address===undefined)c.address="";

  if(c.type===undefined)c.type="C";

  if(c.orderStatus===undefined)c.orderStatus="none";

  if(c.notes===undefined)c.notes="";

  if(c.date===undefined)c.date="";

  if(c.time===undefined)c.time="";

 });

 saveCustomers();

}

========================================================= */

  );

 }catch(e){

  console.error(e);

  alert(
   "تعذر حفظ البيانات. تأكد أن مساحة التخزين متاحة."
  );

  return false;

 }

}


/* =========================================================
   إضافة عميل
========================================================= */

function addCustomer(){

 const name=document.getElementById("name").value.trim();

 const pharmacyCode=
 document.getElementById("pharmacyCode").value.trim();

 if(!name){

  alert("اكتب اسم العميل");

  document.getElementById("name").focus();

  return;

 }

 if(!pharmacyCode){

  alert("اكتب كود الصيدلية");

  document.getElementById("pharmacyCode").focus();

  return;

 }


 const customer={

  id:newId(),

  serial:document.getElementById("serial").value.trim(),

  name:name,

  phone:document.getElementById("phone").value.trim(),

  pharmacyCode:pharmacyCode,

  address:document.getElementById("address").value.trim(),

  type:document.getElementById("type").value,

  date:document.getElementById("date").value,

  time:document.getElementById("time").value,

  notes:document.getElementById("notes").value.trim(),

  orderStatus:document.getElementById("orderStatus").value,

  calls:{},

  noAnswer:{},

  reminderKey:"",

  createdAt:new Date().toISOString()

 };


 customers.unshift(customer);

 if(!saveCustomers()){

  customers.shift();

  return;

 }


 clearAddForm();

 renderCustomers();

 showMessage("✅ تم إضافة العميل وحفظه");

}


/* =========================================================
   تنظيف نموذج الإضافة
========================================================= */

function clearAddForm(){

 [
  "serial",
  "name",
  "phone",
  "pharmacyCode",
  "address",
  "date",
  "time",
  "notes"
 ].forEach(id=>{

  document.getElementById(id).value="";

 });

 document.getElementById("type").value="C";

 document.getElementById("orderStatus").value="none";

}


/* =========================================================
   عدد المكالمات اليوم
========================================================= */

function callsToday(customer){

 if(!customer.calls)customer.calls={};

 return Number(
  customer.calls[today()] || 0
 );

}


/* =========================================================
   تسجيل مكالمة
========================================================= */

function addCall(id){

 const c=customers.find(x=>x.id===id);

 if(!c)return;

 if(!c.calls)c.calls={};

 const d=today();

 c.calls[d]=Number(c.calls[d] || 0)+1;

 /*
   بمجرد تسجيل مكالمة،
   نعتبر العميل تم الاتصال به.
 */

 if(c.noAnswer)c.noAnswer[d]=false;

 saveCustomers();

 renderCustomers();

 showMessage(
  "📞 تم تسجيل المكالمة رقم "+c.calls[d]+" اليوم"
 );

}


/* =========================================================
   الاتصال
========================================================= */

function callCustomer(id){

 const c=customers.find(x=>x.id===id);

 if(!c)return;

 if(!c.phone){

  alert("لا يوجد رقم هاتف مسجل لهذا العميل");

  return;

 }

 addCall(id);

 /*
   لو فيه أكثر من رقم:
   يفتح اختيار الرقم.
 */

 const numbers=c.phone
 .split(/[\/,]/)
 .map(x=>x.trim())
 .filter(Boolean);

 if(numbers.length===1){

  window.location.href="tel:"+numbers[0];

 }else{

  const choice=prompt(
   "اختر الرقم:\n\n"+
   numbers.map((n,i)=>(i+1)+" - "+n).join("\n")
  );

  const index=Number(choice)-1;

  if(numbers[index]){

   window.location.href="tel:"+numbers[index];

  }

 }

}


/* =========================================================
   واتساب
========================================================= */

function whatsapp(id){

 const c=customers.find(x=>x.id===id);

 if(!c || !c.phone){

  alert("لا يوجد رقم هاتف لهذا العميل");

  return;

 }

 const numbers=c.phone
 .split(/[\/,]/)
 .map(x=>x.trim())
 .filter(Boolean);

 let number=numbers[0].replace(/\D/g,"");

 if(number.startsWith("01")){

  number="20"+number.substring(1);

 }

 window.open(
  "https://wa.me/"+number,
  "_blank"
 );

}


/* =========================================================
   تم الاتصال
========================================================= */

function markCalled(id){

 addCall(id);

}

/* =========================================================

========================================================= */

function deleteCustomer(id){

 if(!c)return;

  "هل تريد حذف العميل:\n"+

/* =========================================================
   حالة الطلبية
========================================================= */

function orderBadge(status){

 if(status==="yes")
 return `<span class="badge blue">📦 أخذ طلبية</span>`;

 if(status==="no")
 return `<span class="badge red">🚫 لم يأخذ طلبية</span>`;

 if(status==="later1")
 return `<span class="badge orange">⏰ بعد ساعة</span>`;

 if(status==="later2")
 return `<span class="badge orange">⏰ بعد ساعتين</span>`;

 return "";

}


/* =========================================================
   عرض العملاء
========================================================= */

function renderCustomers(){

 const container=document.getElementById("customers");

 const search=
 document.getElementById("search")
 .value.trim().toLowerCase();

 const filter=
 document.getElementById("filter").value;

 const d=today();


 /* إحصائيات */

 document.getElementById("total")
 .textContent=customers.length;

 document.getElementById("calledCount")
 .textContent=
 customers.filter(x=>callsToday(x)>0).length;

 document.getElementById("notCalledCount")
 .textContent=
 customers.filter(x=>callsToday(x)===0).length;

 document.getElementById("ordersCount")
 .textContent=
 customers.filter(x=>x.orderStatus==="yes").length;

 document.getElementById("noAnswerCount")
 .textContent=
 customers.filter(x=>
  x.noAnswer && x.noAnswer[d]
 ).length;


 /* فلترة */

 const result=customers.filter(c=>{

  const text=(
   (c.serial||"")+" "+
   (c.name||"")+" "+
   (c.phone||"")+" "+
   (c.pharmacyCode||"")+" "+
   (c.address||"")+" "+
   (c.notes||"")
  ).toLowerCase();

  if(search && !text.includes(search))
   return false;

  const calls=callsToday(c);

  if(filter==="notCalled" && calls>0)
   return false;

  if(filter==="called" && calls===0)
   return false;

  if(filter==="noAnswer" &&
     !(c.noAnswer && c.noAnswer[d]))
   return false;

  if(filter==="orders" && c.orderStatus!=="yes")
   return false;

  if(filter==="noOrders" && c.orderStatus!=="no")
   return false;

  if(["A","B","C"].includes(filter) &&
     c.type!==filter)
   return false;

  return true;

 });


 if(result.length===0){

  container.innerHTML=`
   <div class="card empty">
    👥<br><br>
    لا يوجد عملاء مطابقون للبحث
   </div>
  `;

  return;

 }


 container.innerHTML=result.map(c=>{

  const calls=callsToday(c);

  const called=calls>0;

  const noAnswer=
   c.noAnswer &&
   c.noAnswer[d];


  return `

  <div class="customer">

   <div class="customer-head">

    <div class="customer-name">
     👤 ${escapeHTML(c.name)}
    </div>

    <div class="type type-${escapeHTML(c.type||"C")}">
     ${escapeHTML(c.type||"C")}
    </div>

   </div>


   <div class="customer-body">

    <div class="info-grid">

     <div class="info">
      <small>🔢 مسلسل</small>
      <b>${escapeHTML(c.serial||"—")}</b>
     </div>

     <div class="info">
      <small>🏥 كود الصيدلية</small>
      <b>${escapeHTML(c.pharmacyCode||"—")}</b>
     </div>

     <div class="info">
      <small>📞 التليفون</small>
      <b>${escapeHTML(c.phone||"غير مسجل")}</b>
     </div>

     <div class="info">
      <small>📍 العنوان</small>
      <b>${escapeHTML(c.address||"غير محدد")}</b>
     </div>

     <div class="info">
      <small>📅 تاريخ الاتصال</small>
      <b>${escapeHTML(c.date||"غير محدد")}</b>
     </div>

     <div class="info">
      <small>⏰ الموعد</small>
      <b>${escapeHTML(c.time||"غير محدد")}</b>
     </div>

    </div>


    <div class="badges">

     <span class="badge ${called?"green":"orange"}">
      ${called?"✅ تم الاتصال اليوم":"⏳ لم أتصل اليوم"}
     </span>

     <span class="badge cyan">
      📞 رنات اليوم: ${calls}
     </span>

     ${
      noAnswer
      ?
      `<span class="badge red">❌ لم يرد</span>`
      :
      ""
     }

     ${orderBadge(c.orderStatus)}

    </div>


    <div class="notes">
     ${
      c.notes
      ?
      escapeHTML(c.notes)
      :
      "لا توجد ملاحظات"
     }
    </div>


    <div class="actions">

     <button
      class="action call"
      onclick="callCustomer('${c.id}')">
      📞 اتصال + تسجيل رنة
     </button>

     <button
      class="action whatsapp"
      onclick="whatsapp('${c.id}')">
      💬 واتساب
     </button>

     <button
      class="action called"
      onclick="markCalled('${c.id}')">
      ✅ تم الاتصال
     </button>

     <button
      class="action noanswer"
      onclick="markNoAnswer('${c.id}')">
      ❌ لم يرد
     </button>

     <button
      class="action order"
      onclick="setOrder('${c.id}','yes')">
      📦 أخذ طلبية
     </button>

     <button
      class="action noorder"
      onclick="setOrder('${c.id}','no')">
      🚫 لم يأخذ
     </button>

     <button
      class="action follow"
      onclick="setOrder('${c.id}','later1')">
      ⏰ بعد ساعة
     </button>

     <button
      class="action follow"
      onclick="setOrder('${c.id}','later2')">
      ⏰ بعد ساعتين
     </button>

     <button
      class="action edit"
      onclick="editCustomer('${c.id}')">
      ✏️ تعديل
     </button>

     <button
      class="action delete"
      onclick="deleteCustomer('${c.id}')">
      🗑️ حذف
     </button>

    </div>

   </div>

  </div>

  `;

 }).join("");

}


/* =========================================================
   النسخة الاحتياطية
========================================================= */

function exportBackup(){

 if(!customers.length){

  alert("لا توجد بيانات لعمل نسخة احتياطية");

  return;

 }

 const data={
  app:"Ahmed Fayed Customers",
  version:3,
  exportedAt:new Date().toISOString(),
  customers:customers
 };

 const blob=new Blob(
  [JSON.stringify(data,null,2)],
  {type:"application/json"}
 );

 const url=URL.createObjectURL(blob);

 const a=document.createElement("a");

 a.href=url;

 a.download=
 "Ahmed-Fayed-Backup-"+
 today()+
 ".json";

 document.body.appendChild(a);

 a.click();

 a.remove();

 URL.revokeObjectURL(url);

 showMessage("💾 تم إنشاء النسخة الاحتياطية");

}


/* =========================================================
   استرداد النسخة
========================================================= */

function importBackup(event){

 const file=event.target.files[0];

 if(!file)return;

 const reader=new FileReader();

 reader.onload=function(){

  try{

   const data=JSON.parse(reader.result);

   let imported=
    Array.isArray(data)
    ?
    data
    :
    data.customers;

   if(!Array.isArray(imported)){

    throw new Error("invalid");

   }


   if(!confirm(
    "سيتم استبدال البيانات الحالية بالنسخة الاحتياطية.\n\nمتأكد؟"
   )){

    event.target.value="";

    return;

   }


   customers=imported;

   normalizeCustomers();

   saveCustomers();

   renderCustomers();

   showMessage(
    "✅ تم استرداد البيانات بنجاح"
   );

  }catch(e){

   alert(
    "ملف النسخة الاحتياطية غير صحيح."
   );

  }

  event.target.value="";

 };

 reader.readAsText(file);

}


/* =========================================================
   الإشعارات
========================================================= */

async function requestNotifications(){

 if(!("Notification" in window)){

  alert(
   "المتصفح الحالي لا يدعم إشعارات الويب."
  );

  return;

 }

 const permission=
  await Notification.requestPermission();

 if(permission==="granted"){

  showMessage("🔔 تم تفعيل الإشعارات");

  notify(
   "أحمد فايد",
   "تم تفعيل إشعارات مواعيد العملاء"
  );

 }else{

  alert(
   "لم يتم السماح بالإشعارات."
  );

 }

}


/* =========================================================
   إشعار
========================================================= */

function notify(title,body){

 if(
  "Notification" in window &&
  Notification.permission==="granted"
 ){

  const n=new Notification(
   title,
   {
    body:body,
    icon:""
   }
  );

  n.onclick=function(){

   window.focus();

   n.close();

  };

 }

}


/* =========================================================
   صوت التنبيه
========================================================= */

function notificationSound(){

 try{

  const AudioContext=
   window.AudioContext ||
   window.webkitAudioContext;

  if(!AudioContext)return;

  const ctx=new AudioContext();

  const osc=ctx.createOscillator();

  const gain=ctx.createGain();

  osc.connect(gain);

  gain.connect(ctx.destination);

  osc.frequency.value=880;

  gain.gain.value=.12;

  osc.start();

  setTimeout(()=>{

   osc.frequency.value=660;

  },180);

  setTimeout(()=>{

   osc.stop();

   ctx.close();

  },400);

 }catch(e){}

}


/* =========================================================
   فحص مواعيد العملاء
========================================================= */

function checkReminders(){

 const now=new Date();

 const date=
  now.getFullYear()+"-"+
  String(now.getMonth()+1).padStart(2,"0")+"-"+
  String(now.getDate()).padStart(2,"0");

 const time=
  String(now.getHours()).padStart(2,"0")+":"+
  String(now.getMinutes()).padStart(2,"0");


 customers.forEach(c=>{

  if(!c.date || !c.time)return;

  if(c.date!==date)return;

  if(c.time!==time)return;

  const key=date+"_"+time;

  if(c.reminderKey===key)return;

  c.reminderKey=key;

  saveCustomers();

  notificationSound();

  notify(
   "📞 موعد اتصال",
   "حان موعد الاتصال بالعميل: "+
   c.name+
   " - كود الصيدلية: "+
   c.pharmacyCode
  );


  /*
   محاولة فتح كارت العميل مباشرة
   إذا كان المتصفح يسمح.
  */

  renderCustomers();

  showMessage(
   "🔔 حان موعد: "+c.name
  );

 });

}
