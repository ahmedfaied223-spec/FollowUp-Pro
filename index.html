<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>أحمد فايد - إدارة العملاء</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#07111f;
    --card:#101c2d;
    --card2:#142238;
    --border:#263852;
    --text:#f8fafc;
    --muted:#94a3b8;
    --primary:#2563eb;
    --success:#16a34a;
    --danger:#dc2626;
    --warning:#d97706;
    --purple:#7c3aed;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top,#172554 0,#07111f 45%);
    color:var(--text);
    font-family:Tahoma,Arial,sans-serif;
    min-height:100vh;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

.container{
    width:min(1100px,100%);
    margin:auto;
    padding:15px;
}

/* ================= HEADER ================= */

.header{
    background:
        linear-gradient(135deg,#1d4ed8,#4338ca);
    border-radius:24px;
    padding:25px 20px;
    margin-bottom:15px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.header h1{
    margin:0 0 7px;
    font-size:28px;
}

.header p{
    margin:0;
    color:#dbeafe;
}

.connection{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.2);
    padding:9px 13px;
    border-radius:30px;
    white-space:nowrap;
    font-size:13px;
}

/* ================= CARDS ================= */

.card{
    background:rgba(16,28,45,.95);
    border:1px solid var(--border);
    border-radius:20px;
    padding:17px;
    margin-bottom:15px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.card h2{
    margin:0 0 15px;
    font-size:20px;
}

/* ================= GRID ================= */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    color:#cbd5e1;
    margin-bottom:6px;
    font-size:13px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #3b4c65;
    background:#091525;
    color:white;
    border-radius:12px;
    padding:13px;
    outline:none;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

textarea{
    min-height:95px;
    resize:vertical;
}

/* ================= BUTTONS ================= */

.btn{
    width:100%;
    border:0;
    border-radius:13px;
    padding:14px;
    margin-top:14px;
    color:white;
    background:var(--primary);
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.btn:hover{
    filter:brightness(1.08);
}

.tools{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.tool{
    border:0;
    border-radius:12px;
    padding:12px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.backup{
    background:#0369a1;
}

.restore{
    background:#7c3aed;
}

.notify{
    background:#d97706;
}

/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-bottom:15px;
}

.stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px 7px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:24px;
    margin-bottom:5px;
}

.stat span{
    color:var(--muted);
    font-size:12px;
}

/* ================= SEARCH ================= */

.search-area{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:10px;
}

/* ================= CUSTOMER ================= */

.customer{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    margin-bottom:14px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.15);
    scroll-margin-top:15px;
}

.customer.highlight{
    border-color:#f59e0b;
    box-shadow:
        0 0 0 3px rgba(245,158,11,.18),
        0 15px 35px rgba(0,0,0,.25);
}

.customer-title{
    background:linear-gradient(135deg,#17263d,#1e293b);
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.customer-name{
    font-size:19px;
    font-weight:bold;
}

.type{
    min-width:38px;
    text-align:center;
    padding:7px 11px;
    border-radius:20px;
    background:#334155;
    font-weight:bold;
}

.type-A{
    background:#7f1d1d;
}

.type-B{
    background:#78350f;
}

.type-C{
    background:#14532d;
}

.customer-body{
    padding:15px;
}

.info{
    margin:8px 0;
    line-height:1.7;
}

.info span{
    color:var(--muted);
}

.notes{
    margin-top:12px;
    background:#091525;
    border:1px solid #1e2d42;
    border-radius:12px;
    padding:11px;
    white-space:pre-wrap;
    line-height:1.7;
}

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:13px 0;
}

.badge{
    padding:7px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.green{
    background:#14532d;
}

.red{
    background:#7f1d1d;
}

.orange{
    background:#78350f;
}

.blue{
    background:#1e3a8a;
}

.gray{
    background:#334155;
}

.purple{
    background:#581c87;
}

/* ================= ACTIONS ================= */

.actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.action{
    border:0;
    border-radius:11px;
    color:white;
    padding:12px 7px;
    font-weight:bold;
    cursor:pointer;
}

.call{
    background:#16a34a;
}

.whatsapp{
    background:#15803d;
}

.called{
    background:#0891b2;
}

.noanswer{
    background:#dc2626;
}

.order{
    background:#7c3aed;
}

.noorder{
    background:#991b1b;
}

.follow{
    background:#d97706;
}

.edit{
    background:#0369a1;
}

.delete{
    background:#475569;
}

.reminder{
    background:#9333ea;
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:#101c2d;
    width:100%;
    max-width:700px;
    max-height:92vh;
    overflow:auto;
    border:1px solid var(--border);
    border-radius:22px;
    padding:18px;
}

.modal-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:12px;
}

.save{
    background:#16a34a;
}

.close{
    background:#475569;
}

/* ================= MESSAGE ================= */

#message{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    background:#020617;
    border:1px solid #475569;
    color:white;
    padding:13px 20px;
    border-radius:13px;
    display:none;
    z-index:3000;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    max-width:90%;
    text-align:center;
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    color:var(--muted);
    padding:40px 20px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:800px){

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .tools{
        grid-template-columns:1fr;
    }

}

@media(max-width:650px){

    .header-top{
        flex-direction:column;
        align-items:flex-start;
    }

    .grid,
    .search-area{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .actions{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<script>

/* =====================================================
   DATABASE
===================================================== */

const DB_KEY = "AHMED_FAYED_CUSTOMERS_PRO_V3";

let customers = [];

let editId = null;


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.style.display = "block";

    clearTimeout(window.messageTimer);

    window.messageTimer =
        setTimeout(() => {

            box.style.display = "none";

        },2500);

}


/* =====================================================
   TODAY
===================================================== */

function getToday(){

    const d = new Date();

    return (
        d.getFullYear() +
        "-" +
        String(d.getMonth()+1).padStart(2,"0") +
        "-" +
        String(d.getDate()).padStart(2,"0")
    );

}


/* =====================================================
   LOAD
===================================================== */

function loadCustomers(){

    try{

        const data =
            localStorage.getItem(DB_KEY);

        if(data){

            const parsed =
                JSON.parse(data);

            if(Array.isArray(parsed)){

                customers = parsed;

            }

        }

    }catch(error){

        console.error(error);

        customers = [];

    }

}


/* =====================================================
   SAVE
===================================================== */

function saveCustomers(){

    try{

        localStorage.setItem(
            DB_KEY,
            JSON.stringify(customers)
        );

        return true;

    }catch(error){

        console.error(error);

        alert(
            "تعذر حفظ البيانات على الجهاز."
        );

        return false;

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   ADD CUSTOMER
===================================================== */

function addCustomer(){

    const name =
        document.getElementById("name")
        .value
        .trim();

    const phone =
        document.getElementById("phone")
        .value
        .trim();

    if(!name){

        alert("اكتب اسم العميل");

        document.getElementById("name").focus();

        return;

    }

    if(!phone){

        alert("اكتب رقم الهاتف");

        document.getElementById("phone").focus();

        return;

    }


    const customer = {

        id:
            "CUS-" +
            Date.now() +
            "-" +
            Math.random()
            .toString(36)
            .substring(2,7),

        name:name,

        phone:phone,

        address:
            document
            .getElementById("address")
            .value
            .trim(),

        type:
            document
            .getElementById("type")
            .value,

        date:
            document
            .getElementById("date")
            .value,

        time:
            document
            .getElementById("time")
            .value,

        notes:
            document
            .getElementById("notes")
            .value
            .trim(),

        orderStatus:
            document
            .getElementById("orderStatus")
            .value,

        calls:{},

        noAnswer:{},

        reminderSent:{},

        createdAt:
            new Date().toISOString()

    };package com.ahmedfayed.customers

import android.Manifest

import android.net.Uri

import androidx.compose.foundation.lazy.items

data class Customer(
    val id: Long = System.currentTimeMillis(),
    var name: String,
    var phone: String,
    var whatsapp: String = "",
    var address: String = "",
    var notes: String = "",
    var type: String = "C",
    var date: String = "",
    var time: String = "",
    var order: String = "none",
    var callsToday: Int = 0,
    var calledToday: Boolean = false,
    var noAnswerToday: Boolean = false
)

class MainActivity : ComponentActivity() {

    private lateinit var prefs: android.content.SharedPreferences

    private val callPermission =
        registerForActivityResult(
            ActivityResultContracts.RequestPermission()
        ) { }

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        prefs = getSharedPreferences(
            "ahmed_fayed_database",
            MODE_PRIVATE
        )

        createNotificationChannel()

        setContent {
            AhmedFayedApp()
        }
    }

    private fun createNotificationChannel() {
        if (android.os.Build.VERSION.SDK_INT >= 26) {

            val channel = NotificationChannel(
                "customer_calls",
                "مواعيد العملاء",
                NotificationManager.IMPORTANCE_HIGH
            )

            channel.description =
                "تنبيهات مواعيد الاتصال بالعملاء"

            channel.enableVibration(true)

            val manager =
                getSystemService(
                    NotificationManager::class.java
                )

            manager.createNotificationChannel(channel)
        }
    }

    fun makeCall(phone: String) {

        if (
            checkSelfPermission(
                Manifest.permission.CALL_PHONE
            ) != PackageManager.PERMISSION_GRANTED
        ) {

            callPermission.launch(
                Manifest.permission.CALL_PHONE
            )

            return
        }

        val intent =
            Intent(
                Intent.ACTION_CALL,
                Uri.parse("tel:$phone")
            )

        startActivity(intent)
    }

    @Composable
    fun AhmedFayedApp() {

        MaterialTheme(
            colorScheme = darkColorScheme(
                primary = Color(0xFF2563EB),
                secondary = Color(0xFF4F46E5),
                background = Color(0xFF08111F),
                surface = Color(0xFF111827)
            )
        ) {

            var customers by remember {
                mutableStateOf(loadCustomers())
            }

            var search by remember {
                mutableStateOf("")
            }

            var showAdd by remember {
                mutableStateOf(false)
            }

            var editCustomer by remember {
                mutableStateOf<Customer?>(null)
            }

            Column(
                modifier =
                    Modifier
                        .fillMaxSize()
                        .background(
                            Color(0xFF08111F)
                        )
                        .padding(12.dp)
            ) {

                Header()

                Spacer(
                    Modifier.height(10.dp)
                )

                SearchBox(
                    search = search,
                    onSearch = {
                        search = it
                    }
                )

                Spacer(
                    Modifier.height(10.dp)
                )

                Statistics(customers)

                Spacer(
                    Modifier.height(10.dp)
                )

                Button(
                    modifier =
                        Modifier.fillMaxWidth(),
                    onClick = {
                        showAdd = true
                    },
                    shape =
                        RoundedCornerShape(14.dp)
                ) {
                    Icon(
                        Icons.Default.Add,
                        contentDescription = null
                    )

                    Spacer(
                        Modifier.width(6.dp)
                    )

                    Text(
                        "إضافة عميل جديد"
                    )
                }

                Spacer(
                    Modifier.height(10.dp)
                )

                val filtered =
                    customers.filter {

                        it.name.contains(
                            search,
                            true
                        ) ||

                        it.phone.contains(
                            search,
                            true
                        ) ||

                        it.address.contains(
                            search,
                            true
                        )
                    }

                if (filtered.isEmpty()) {

                    Box(
                        modifier =
                            Modifier
                                .fillMaxSize(),
                        contentAlignment =
                            Alignment.Center
                    ) {

                        Text(
                            "لا يوجد عملاء",
                            color =
                                Color.LightGray,
                            fontSize = 18.sp
                        )
                    }

                } else {

                    LazyColumn(
                        verticalArrangement =
                            Arrangement.spacedBy(10.dp)
                    ) {

                        items(
                            filtered,
                            key = {
                                it.id
                            }
                        ) { customer ->

                            CustomerCard(
                                customer = customer,

                                onCall = {

                                    customer.callsToday++

                                    customer.calledToday =
                                        true

                                    saveCustomers(
                                        customers
                                    )

                                    makeCall(
                                        customer.phone
                                    )

                                    customers =
                                        loadCustomers()
                                },

                                onWhatsApp = {

                                    openWhatsApp(
                                        customer
                                    )
                                },

                                onCalled = {

                                    customer.calledToday =
                                        true

                                    saveCustomers(
                                        customers
                                    )

                                    customers =
                                        loadCustomers()
                                },

                                onNoAnswer = {

                                    customer.noAnswerToday =
                                        true

                                    saveCustomers(
                                        customers
                                    )

                                    customers =
                                        loadCustomers()
                                },

                                onOrder = {

                                    customer.order =
                                        "yes"

                                    saveCustomers(
                                        customers
                                    )

                                    customers =
                                        loadCustomers()
                                },

                                onNoOrder = {

                                    customer.order =
                                        "no"

                                    saveCustomers(
                                        customers
                                    )

                                    customers =
                                        loadCustomers()
                                },

                                onLaterOne = {

                                    customer.order =
                                        "later1"

                                    saveCustomers(
                                        customers
                                    )

                                    customers =
                                        loadCustomers()
                                },

                                onLaterTwo = {

                                    customer.order =
                                        "later2"

                                    saveCustomers(
                                        customers
                                    )

                                    customers =
                                        loadCustomers()
                                },

                                onEdit = {

                                    editCustomer =
                                        customer
                                },

                                onDelete = {

                                    customers =
                                        customers.filter {
                                            it.id !=
                                                    customer.id
                                        }

                                    saveCustomers(
                                        customers
                                    )
                                }
                            )
                        }
                    }
                }
            }

            if (showAdd) {

                CustomerEditor(
                    title =
                        "إضافة عميل",

                    initial = null,

                    onClose = {
                        showAdd = false
                    },

                    onSave = { customer ->

                        customers =
                            customers +
                            customer

                        saveCustomers(
                            customers
                        )

                        scheduleNotification(
                            customer
                        )

                        showAdd = false
                    }
                )
            }

            editCustomer?.let { customer ->

                CustomerEditor(
                    title =
                        "تعديل العميل",

                    initial =
                        customer,

                    onClose = {
                        editCustomer = null
                    },

                    onSave = { updated ->

                        customers =
                            customers.map {

                                if (
                                    it.id ==
                                    updated.id
                                ) {
                                    updated
                                } else {
                                    it
                                }
                            }

                        saveCustomers(
                            customers
                        )

                        scheduleNotification(
                            updated
                        )

                        editCustomer = null
                    }
                )
            }
        }
    }

    private fun saveCustomers(
        list: List<Customer>
    ) {

        val array = JSONArray()

        list.forEach {

            val obj =
                JSONObject()

            obj.put(
                "id",
                it.id
            )

            obj.put(
                "name",
                it.name
            )

            obj.put(
                "phone",
                it.phone
            )

            obj.put(
                "whatsapp",
                it.whatsapp
            )

            obj.put(
                "address",
                it.address
            )

            obj.put(
                "notes",
                it.notes
            )

            obj.put(
                "type",
                it.type
            )

            obj.put(
                "date",
                it.date
            )

            obj.put(
                "time",
                it.time
            )

            obj.put(
                "order",
                it.order
            )

            obj.put(
                "callsToday",
                it.callsToday
            )

            obj.put(
                "calledToday",
                it.calledToday
            )

            obj.put(
                "noAnswerToday",
                it.noAnswerToday
            )

            array.put(obj)
        }

        prefs.edit()
            .putString(
                "customers",
                array.toString()
            )
            .apply()
    }

    private fun loadCustomers():
            List<Customer> {

        val data =
            prefs.getString(
                "customers",
                "[]"
            )

        val array =
            JSONArray(data)

        val result =
            mutableListOf<Customer>()

        for (
            i in 0 until array.length()
        ) {

            val o =
                array.getJSONObject(i)

            result.add(
                Customer(

                    id =
                        o.optLong(
                            "id"
                        ),

                    name =
                        o.optString(
                            "name"
                        ),

                    phone =
                        o.optString(
                            "phone"
                        ),

                    whatsapp =
                        o.optString(
                            "whatsapp"
                        ),

                    address =
                        o.optString(
                            "address"
                        ),

                    notes =
                        o.optString(
                            "notes"
                        ),

                    type =
                        o.optString(
                            "type",
                            "C"
                        ),

                    date =
                        o.optString(
                            "date"
                        ),

                    time =
                        o.optString(
                            "time"
                        ),

                    order =
                        o.optString(
                            "order",
                            "none"
                        ),

                    callsToday =
                        o.optInt(
                            "callsToday"
                        ),

                    calledToday =
                        o.optBoolean(
                            "calledToday"
                        ),

                    noAnswerToday =
                        o.optBoolean(
                            "noAnswerToday"
                        )
                )
            )
        }

        return result
    }

    private fun openWhatsApp(
        customer: Customer
    ) {

        var number =
            customer.whatsapp
                .ifBlank {
                    customer.phone
                }
                .filter {
                    it.isDigit()
                }

        if (
            number.startsWith("01")
        ) {

            number =
                "20" +
                number.substring(1)
        }

        val intent =
            Intent(
                Intent.ACTION_VIEW,
                Uri.parse(
                    "https://wa.me/$number"
                )
            )

        startActivity(intent)
    }

    private fun scheduleNotification(
        customer: Customer
    ) {

        if (
            customer.date.isBlank() ||
            customer.time.isBlank()
        ) return

        try {

            val format =
                SimpleDateFormat(
                    "yyyy-MM-dd HH:mm",
                    Locale.getDefault()
                )

            val date =
                format.parse(
                    "${customer.date} ${customer.time}"
                )

            if (date == null) return

            if (
                date.time <=
                System.currentTimeMillis()
            ) return

            val intent =
                Intent(
                    this,
                    ReminderReceiver::class.java
                )

            intent.putExtra(
                "id",
                customer.id
            )

            intent.putExtra(
                "name",
                customer.name
            )

            intent.putExtra(
                "phone",
                customer.phone
            )

            val pending =
                PendingIntent.getBroadcast(
                    this,
                    customer.id.toInt(),
                    intent,

                    PendingIntent.FLAG_UPDATE_CURRENT or
                            PendingIntent.FLAG_IMMUTABLE
                )

            val alarm =
                getSystemService(
                    AlarmManager::class.java
                )

            alarm.setExactAndAllowWhileIdle(
                AlarmManager.RTC_WAKEUP,
                date.time,
                pending
            )

        } catch (e: Exception) {

            e.printStackTrace()
        }
    }
}

class ReminderReceiver :
    BroadcastReceiver() {

    override fun onReceive(
        context: Context,
        intent: Intent
    ) {

        val name =
            intent.getStringExtra(
                "name"
            ) ?: "العميل"

        val phone =
            intent.getStringExtra(
                "phone"
            ) ?: ""

        val id =
            intent.getLongExtra(
                "id",
                0
            )

        val open =
            Intent(
                context,
                MainActivity::class.java
            )

        open.putExtra(
            "customerId",
            id
        )

        val pending =
            PendingIntent.getActivity(
                context,
                id.toInt(),
                open,

                PendingIntent.FLAG_UPDATE_CURRENT or
                        PendingIntent.FLAG_IMMUTABLE
            )

        val notification =
            Notification.Builder(
                context,
                "customer_calls"
            )

                .setSmallIcon(
                    android.R.drawable.ic_menu_call
                )

                .setContentTitle(
                    "📞 موعد اتصال العميل"
                )

                .setContentText(
                    "$name - $phone"
                )

                .setStyle(
                    Notification.BigTextStyle()
                        .bigText(
                            "حان موعد الاتصال بالعميل $name\n$phone"
                        )
                )

                .setAutoCancel(true)

                .setContentIntent(
                    pending
                )

                .setDefaults(
                    Notification.DEFAULT_ALL
                )

                .build()

        val manager =
            context.getSystemService(
                Context.NOTIFICATION_SERVICE
            ) as NotificationManager

        manager.notify(
            id.toInt(),
            notification
        )

        /*
         * فتح شاشة الاتصال تلقائياً من BroadcastReceiver
         * قد يتم منعه في بعض إصدارات Android بسبب قيود
         * التشغيل من الخلفية.
         */
        try {

            val call =
                Intent(
                    Intent.ACTION_DIAL,
                    Uri.parse("tel:$phone")
                )

            call.addFlags(
                Intent.FLAG_ACTIVITY_NEW_TASK
            )

            context.startActivity(call)

        } catch (e: Exception) {

            e.printStackTrace()
        }
    }
    }


    customers.push(customer);


    if(!saveCustomers()){

        customers.pop();

        return;

    }


    clearAddForm();

    renderCustomers();

    showMessage(
        "✅ تم إضافة العميل وحفظه بنجاح"
    );

}

   CLEAR FORM

function clearAddForm(){

/* =====================================================
   CALLS
===================================================== */

function getCallsToday(customer){

    if(!customer.calls){

        customer.calls = {};

    }

    return Number(
        customer.calls[getToday()] || 0
    );

}


function addCall(id){

    const customer =
        customers.find(
            c => c.id === id
        );

    if(!customer){

        return;

    }


    if(!customer.calls){

        customer.calls = {};

    }


    const today =
        getToday();


    customer.calls[today] =
        Number(customer.calls[today] || 0) + 1;


    saveCustomers();

    renderCustomers();

    showMessage(
        "📞 تم تسجيل الرنة رقم " +
        customer.calls[today]
    );

}


/* =====================================================
   PHONE CALL
===================================================== */

function callCustomer(id){

    const customer =
        customers.find(
            c => c.id === id
        );

    if(!customer){

        return;

    }


    addCall(id);


    setTimeout(() => {

        window.location.href =
            "tel:" +
            customer.phone;

    },100);

}


/* =====================================================
   WHATSAPP
===================================================== */

function normalizePhone(phone){

    let number =
        String(phone || "")
        .replace(/\D/g,"");


    if(number.startsWith("01")){

        number =
            "20" +
            number.substring(1);

    }

    else if(
        number.startsWith("1") &&
        number.length === 10
    ){

        number =
            "20" +
            number;

    }


    return number;

}


function whatsapp(id){

    const customer =
        customers.find(
            c => c.id === id
        );

    if(!customer){

        return;

    }


    const number =
        normalizePhone(
            customer.phone
        );


    if(!number){

        alert("رقم الهاتف غير صحيح");

        return;

    }


    const message =
        "أهلاً " +
        customer.name +
        "، معاك أحمد فايد.";


    const url =
        "https://wa.me/" +
        number +
        "?text=" +
        encodeURIComponent(message);


    window.open(url,"_blank");

}

}

/* =====================================================
   NOTIFICATION PERMISSION
===================================================== */

async function enableNotifications(){

    if(!("Notification" in window)){

        alert(
            "المتصفح الحالي لا يدعم إشعارات النظام."
        );

        return;

    }


    try{

        const permission =
            await Notification.requestPermission();


        if(permission === "granted"){

            showMessage(
                "🔔 تم تفعيل الإشعارات"
            );

            playSound();

        }

        else{

            alert(
                "يجب السماح بالإشعارات من إعدادات المتصفح."
            );

        }

    }catch(error){

        console.error(error);

    }

}


/* =====================================================
   SOUND
===================================================== */

function playSound(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext){

            return;

        }


        const ctx =
            new AudioContext();

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();


        osc.type = "sine";

        osc.frequency.value = 850;

        gain.gain.setValueAtTime(
            .0001,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .25,
            ctx.currentTime + .03
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + .65
        );


        osc.connect(gain);

        gain.connect(ctx.destination);

        osc.start();

        osc.stop(
            ctx.currentTime + .7
        );

    }catch(error){

        console.log(error);

    }

}


/* =====================================================
   SEND NOTIFICATION
===================================================== */

function sendCustomerNotification(customer){

    if(
        !("Notification" in window) ||
        Notification.permission !== "granted"
    ){

        return;

    }


    if(
        !customer.date ||
        !customer.time
    ){

        return;

    }


    const key =
        customer.date +
        "_" +
        customer.time;


    if(!customer.reminderSent){

        customer.reminderSent = {};

    }


    if(customer.reminderSent[key]){

        return;

    }


    const now =
        new Date();


    const target =
        new Date(
            customer.date +
            "T" +
            customer.time
        );


    const diff =
        target.getTime() -
        now.getTime();


    /* الإشعار عند الموعد */

    if(
        diff <= 30000 &&
        diff >= -60000
    ){

        customer.reminderSent[key] =
            true;


        saveCustomers();


        const notification =
            new Notification(
                "📞 موعد الاتصال - أحمد فايد",
                {
                    body:
                        "حان موعد الاتصال بالعميل: " +
                        customer.name,

                    tag:
                        "customer-" +
                        customer.id,

                    data:{
                        customerId:
                            customer.id
                    }
                }
            );


        notification.onclick =
            function(){

                window.focus();

                window.location.hash =
                    "customer-" +
                    customer.id;

                setTimeout(
                    () =>
                        openCustomerCard(
                            customer.id
                        ),
                    100
                );

                notification.close();

            };


        playSound();

        showMessage(
            "🔔 حان موعد الاتصال بـ " +
            customer.name
        );

    }

}

   CHECK REMINDERS

    customers.forEach(

            element.scrollIntoView({

            );


            setTimeout(() => {

                element.classList.remove(

            },4000);

        }

    },100);

}


/* =====================================================
   RENDER
===================================================== */

function renderCustomers(){

    const container =
        document.getElementById("customers");


    const search =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const filter =
        document
        .getElementById("filter")
        .value;


    const today =
        getToday();


    /* STATS */

    document.getElementById("total")
        .textContent =
        customers.length;


    document.getElementById("calledCount")
        .textContent =
        customers.filter(
            c =>
                getCallsToday(c) > 0
        ).length;


    document.getElementById("notCalledCount")
        .textContent =
        customers.filter(
            c =>
                getCallsToday(c) === 0
        ).length;


    document.getElementById("ordersCount")
        .textContent =
        customers.filter(
            c =>
                c.orderStatus === "yes"
        ).length;


    document.getElementById("noAnswerCount")
        .textContent =
        customers.filter(
            c =>
                c.noAnswer &&
                c.noAnswer[today]
        ).length;


    /* FILTER */

    const result =
        customers.filter(
            customer => {

                const text =
                    (
                        customer.name +
                        " " +
                        customer.phone +
                        " " +
                        (customer.address || "") +
                        " " +
                        (customer.notes || "")
                    )
                    .toLowerCase();


                if(
                    search &&
                    !text.includes(search)
                ){

                    return false;

                }


                const calls =
                    getCallsToday(customer);


                if(
                    filter === "notCalled" &&
                    calls > 0
                ){

                    return false;

                }


                if(
                    filter === "called" &&
                    calls === 0
                ){

                    return false;

                }


                if(
                    filter === "noAnswer" &&
                    !(
                        customer.noAnswer &&
                        customer.noAnswer[today]
                    )
                ){

                    return false;

                }


                if(
                    filter === "orders" &&
                    customer.orderStatus !== "yes"
                ){

                    return false;

                }


                if(
                    filter === "noOrders" &&
                    customer.orderStatus !== "no"
                ){

                    return false;

                }


                if(
                    ["A","B","C"]
                    .includes(filter) &&
                    customer.type !== filter
                ){

                    return false;

                }


                return true;

            }
        );


    if(result.length === 0){

        container.innerHTML = `
            <div class="card empty">
                👥
                <br><br>
                لا يوجد عملاء مطابقين للبحث
            </div>
        `;

        return;

    }


    /* RENDER */

    container.innerHTML =
        result.map(
            customer => {

                const calls =
                    getCallsToday(customer);


                const called =
                    calls > 0;


                const noAnswer =
                    customer.noAnswer &&
                    customer.noAnswer[today];


                const type =
                    customer.type || "C";


                return `

<div
    class="customer"
    id="customer-${escapeHTML(customer.id)}"
>

    <div class="customer-title">

        <div class="customer-name">
            👤
            ${escapeHTML(customer.name)}
        </div>

        <div class="type type-${type}">
            ${type}
        </div>

    </div>


    <div class="customer-body">

        <div class="info">

            <span>📞 الهاتف:</span>

            <b>
                ${escapeHTML(customer.phone)}
            </b>

        </div>


        <div class="info">

            <span>📍 العنوان:</span>

            <b>
                ${
                    escapeHTML(
                        customer.address ||
                        "غير محدد"
                    )
                }
            </b>

        </div>


        <div class="info">

            <span>📅 موعد الاتصال:</span>

            <b>

                ${
                    reminderText(customer)
                }

            </b>

        </div>


        <div class="notes">

            ${
                customer.notes
                ?
                escapeHTML(customer.notes)
                :
                "لا توجد ملاحظات"
            }

        </div>


        <div class="badges">

            <span class="badge ${
                called
                ?
                "green"
                :
                "orange"
            }">

                ${
                    called
                    ?
                    "✅ تم الاتصال اليوم"
                    :
                    "⏳ لم أتصل اليوم"
                }

            </span>


            <span class="badge blue">

                📞 عدد الرنات اليوم:
                ${calls}

            </span>


            ${
                noAnswer
                ?
                `
                <span class="badge red">
                    ❌ لم يرد
                </span>
                `
                :
                ""
            }


            ${getOrderBadge(
                customer.orderStatus
            )}

        </div>


        <div class="actions">


            <button
                class="action call"
                onclick="callCustomer('${escapeHTML(customer.id)}')"
            >
                📞 اتصال + رن
            </button>


            <button
                class="action whatsapp"
                onclick="whatsapp('${escapeHTML(customer.id)}')"
            >
                💬 واتساب
            </button>


            <button
                class="action called"
                onclick="markCalled('${escapeHTML(customer.id)}')"
            >
                ✅ تم الاتصال
            </button>


            <button
                class="action noanswer"
                onclick="markNoAnswer('${escapeHTML(customer.id)}')"
            >
                ❌ لم يرد
            </button>


            <button
                class="action order"
                onclick="setOrder('${escapeHTML(customer.id)}','yes')"
            >
                📦 أخذ طلبية
            </button>


            <button
                class="action noorder"
                onclick="setOrder('${escapeHTML(customer.id)}','no')"
            >
                🚫 لم يأخذ
            </button>


            <button
                class="action follow"
                onclick="setOrder('${escapeHTML(customer.id)}','later1')"
            >
                ⏰ بعد ساعة
            </button>


            <button
                class="action follow"
                onclick="setOrder('${escapeHTML(customer.id)}','later2')"
            >
                ⏰ بعد ساعتين
            </button>


            <button
                class="action reminder"
                onclick="enableNotifications()"
            >
                🔔 تفعيل التنبيه
            </button>


            <button
                class="action edit"
                onclick="editCustomer('${escapeHTML(customer.id)}')"
            >
                ✏️ تعديل
            </button>


            <button
                class="action delete"
                onclick="deleteCustomer('${escapeHTML(customer.id)}')"
            >
                🗑️ حذف
            </button>

        </div>

    </div>

</div>

                `;

            }
        ).join("");

}


/* =====================================================
   EXPORT BACKUP
===================================================== */

function exportBackup(){

    const backup = {

        app:
            "Ahmed Fayed Customer Manager",

        version:
            "3.0",

        exportedAt:
            new Date().toISOString(),

        customers:
            customers

    };


    const json =
        JSON.stringify(
            backup,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    const date =
        getToday();


    a.href = url;

    a.download =
        "Ahmed-Fayed-Backup-" +
        date +
        ".json";


    document.body.appendChild(a);

    a.click();

    a.remove();


    URL.revokeObjectURL(url);


    showMessage(
        "📤 تم إنشاء النسخة الاحتياطية"
    );

}


/* =====================================================
   RESTORE BACKUP
===================================================== */

function restoreBackup(event){

    const file =
        event.target.files[0];


    if(!file){

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            try{

                const data =
                    JSON.parse(
                        e.target.result
                    );


                let imported;


                if(
                    Array.isArray(data)
                ){

                    imported = data;

                }

                else if(
                    Array.isArray(
                        data.customers
                    )
                ){

                    imported =
                        data.customers;

                }

                else{

                    throw new Error(
                        "ملف غير صحيح"
                    );

                }


                if(
                    !confirm(
                        "سيتم استبدال العملاء الحاليين بالنسخة الاحتياطية.\nهل تريد المتابعة؟"
                    )
                ){

                    return;

                }


                customers =
                    imported.map(
                        customer => {

                            if(!customer.id){

                                customer.id =
                                    "CUS-" +
                                    Date.now() +
                                    "-" +
                                    Math.random()
                                    .toString(36)
                                    .substring(2,7);

                            }


                            if(!customer.calls){

                                customer.calls = {};

                            }


                            if(!customer.noAnswer){

                                customer.noAnswer = {};

                            }


                            if(!customer.reminderSent){

                                customer.reminderSent = {};

                            }


                            return customer;

                        }
                    );


                if(
                    saveCustomers()
                ){

                    renderCustomers();

                    showMessage(
                        "📥 تم استرداد النسخة الاحتياطية بنجاح"
                    );

                }

            }catch(error){

                console.error(error);

                alert(
                    "❌ الملف غير صالح أو تالف."
                );

            }

            event.target.value = "";

        };


    reader.readAsText(file);

}
