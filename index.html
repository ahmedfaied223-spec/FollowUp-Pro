<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>أحمد فايد - إدارة العملاء</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --bg:#07111f;
    --card:#101c2d;
    --card2:#142238;
    --border:#263852;
    --text:#f8fafc;
    --muted:#94a3b8;
    --primary:#2563eb;
    --success:#16a34a;
    --danger:#dc2626;
    --warning:#d97706;
    --purple:#7c3aed;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top,#172554 0,#07111f 45%);
    color:var(--text);
    font-family:Tahoma,Arial,sans-serif;
    min-height:100vh;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

.container{
    width:min(1100px,100%);
    margin:auto;
    padding:15px;
}

/* ================= HEADER ================= */

.header{
    background:
        linear-gradient(135deg,#1d4ed8,#4338ca);
    border-radius:24px;
    padding:25px 20px;
    margin-bottom:15px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.header h1{
    margin:0 0 7px;
    font-size:28px;
}

.header p{
    margin:0;
    color:#dbeafe;
}

.connection{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.2);
    padding:9px 13px;
    border-radius:30px;
    white-space:nowrap;
    font-size:13px;
}

/* ================= CARDS ================= */

.card{
    background:rgba(16,28,45,.95);
    border:1px solid var(--border);
    border-radius:20px;
    padding:17px;
    margin-bottom:15px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.card h2{
    margin:0 0 15px;
    font-size:20px;
}

/* ================= GRID ================= */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    color:#cbd5e1;
    margin-bottom:6px;
    font-size:13px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #3b4c65;
    background:#091525;
    color:white;
    border-radius:12px;
    padding:13px;
    outline:none;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

textarea{
    min-height:95px;
    resize:vertical;
}

/* ================= BUTTONS ================= */

.btn{
    width:100%;
    border:0;
    border-radius:13px;
    padding:14px;
    margin-top:14px;
    color:white;
    background:var(--primary);
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.btn:hover{
    filter:brightness(1.08);
}

.tools{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.tool{
    border:0;
    border-radius:12px;
    padding:12px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.backup{
    background:#0369a1;
}

.restore{
    background:#7c3aed;
}

.notify{
    background:#d97706;
}

/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-bottom:15px;
}

.stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px 7px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:24px;
    margin-bottom:5px;
}

.stat span{
    color:var(--muted);
    font-size:12px;
}

/* ================= SEARCH ================= */

.search-area{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:10px;
}

/* ================= CUSTOMER ================= */

.customer{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    margin-bottom:14px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.15);
    scroll-margin-top:15px;
}

.customer.highlight{
    border-color:#f59e0b;
    box-shadow:
        0 0 0 3px rgba(245,158,11,.18),
        0 15px 35px rgba(0,0,0,.25);
}

.customer-title{
    background:linear-gradient(135deg,#17263d,#1e293b);
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.customer-name{
    font-size:19px;
    font-weight:bold;
}

.type{
    min-width:38px;
    text-align:center;
    padding:7px 11px;
    border-radius:20px;
    background:#334155;
    font-weight:bold;
}

.type-A{
    background:#7f1d1d;
}

.type-B{
    background:#78350f;
}

.type-C{
    background:#14532d;
}

.customer-body{
    padding:15px;
}

.info{
    margin:8px 0;
    line-height:1.7;
}

.info span{
    color:var(--muted);
}

.notes{
    margin-top:12px;
    background:#091525;
    border:1px solid #1e2d42;
    border-radius:12px;
    padding:11px;
    white-space:pre-wrap;
    line-height:1.7;
}

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:13px 0;
}

.badge{
    padding:7px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.green{
    background:#14532d;
}

.red{
    background:#7f1d1d;
}

.orange{
    background:#78350f;
}

.blue{
    background:#1e3a8a;
}

.gray{
    background:#334155;
}

.purple{
    background:#581c87;
}

/* ================= ACTIONS ================= */

.actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.action{
    border:0;
    border-radius:11px;
    color:white;
    padding:12px 7px;
    font-weight:bold;
    cursor:pointer;
}

.call{
    background:#16a34a;
}

.whatsapp{
    background:#15803d;
}

.called{
    background:#0891b2;
}

.noanswer{
    background:#dc2626;
}

.order{
    background:#7c3aed;
}

.noorder{
    background:#991b1b;
}

.follow{
    background:#d97706;
}

.edit{
    background:#0369a1;
}

.delete{
    background:#475569;
}

.reminder{
    background:#9333ea;
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:#101c2d;
    width:100%;
    max-width:700px;
    max-height:92vh;
    overflow:auto;
    border:1px solid var(--border);
    border-radius:22px;
    padding:18px;
}

.modal-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:12px;
}

.save{
    background:#16a34a;
}

.close{
    background:#475569;
}

/* ================= MESSAGE ================= */

#message{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    background:#020617;
    border:1px solid #475569;
    color:white;
    padding:13px 20px;
    border-radius:13px;
    display:none;
    z-index:3000;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    max-width:90%;
    text-align:center;
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    color:var(--muted);
    padding:40px 20px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:800px){

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .tools{
        grid-template-columns:1fr;
    }

}

@media(max-width:650px){

    .header-top{
        flex-direction:column;
        align-items:flex-start;
    }

    .grid,
    .search-area{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .actions{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<div class="container">

<!-- ================= HEADER ================= -->

<div class="header">

    <div class="header-top">

        <div>
            <h1>📞 أحمد فايد</h1>
            <p>نظام إدارة ومتابعة العملاء</p>
        </div>

        <div class="connection" id="connection">
            🟢 النظام يعمل
        </div>

    </div>

</div>


<!-- ================= ADD CUSTOMER ================= -->

<div class="card">

    <h2>➕ إضافة عميل جديد</h2>

    <div class="grid">

        <div>
            <label>اسم العميل *</label>
            <input id="name" placeholder="اسم العميل">
        </div>

        <div>
            <label>رقم الهاتف *</label>
            <input id="phone" type="tel" placeholder="رقم الهاتف">
        </div>

        <div>
            <label>عنوان العميل</label>
            <input id="address" placeholder="العنوان">
        </div>

        <div>
            <label>نوع العميل ABC</label>

            <select id="type">

                <option value="A">
                    A - عميل مهم
                </option>

                <option value="B">
                    B - عميل متوسط
                </option>

                <option value="C" selected>
                    C - عميل عادي
                </option>

            </select>

        </div>

        <div>
            <label>تاريخ الاتصال</label>
            <input id="date" type="date">
        </div>

        <div>
            <label>ميعاد الاتصال</label>
            <input id="time" type="time">
        </div>

        <div class="full">

            <label>ملاحظات</label>

            <textarea
                id="notes"
                placeholder="اكتب ملاحظات العميل"
            ></textarea>

        </div>

        <div class="full">

            <label>حالة الطلبية</label>

            <select id="orderStatus">

                <option value="none">
                    لم يتم تحديدها
                </option>

                <option value="yes">
                    📦 أخذ طلبية
                </option>

                <option value="no">
                    ❌ لم يأخذ طلبية
                </option>

                <option value="later1">
                    ⏰ كلمني بعد ساعة
                </option>

                <option value="later2">
                    ⏰ كلمني بعد ساعتين
                </option>

            </select>

        </div>

    </div>

    <button class="btn" onclick="addCustomer()">
        💾 إضافة وحفظ العميل
    </button>

</div>


<!-- ================= BACKUP ================= -->

<div class="card">

    <h2>💾 النسخ الاحتياطي</h2>

    <div class="tools">

        <button class="tool backup" onclick="exportBackup()">
            📤 تصدير نسخة احتياطية
        </button>

        <button class="tool restore" onclick="document.getElementById('restoreFile').click()">
            📥 استرداد نسخة احتياطية
        </button>

        <button class="tool notify" onclick="enableNotifications()">
            🔔 تفعيل الإشعارات
        </button>

    </div>

    <input
        id="restoreFile"
        type="file"
        accept=".json,application/json"
        style="display:none"
        onchange="restoreBackup(event)"
    >

</div>


<!-- ================= SEARCH ================= -->

<div class="card">

    <h2>🔎 البحث والمتابعة</h2>

    <div class="search-area">

        <input
            id="search"
            type="search"
            placeholder="ابحث باسم العميل أو الهاتف أو العنوان..."
            oninput="renderCustomers()"
        >

        <select id="filter" onchange="renderCustomers()">

            <option value="all">
                كل العملاء
            </option>

            <option value="notCalled">
                لم أتصل بهم اليوم
            </option>

            <option value="called">
                اتصلت بهم اليوم
            </option>

            <option value="noAnswer">
                لم يردوا
            </option>

            <option value="orders">
                أخذوا طلبية
            </option>

            <option value="noOrders">
                لم يأخذوا طلبية
            </option>

            <option value="A">
                عملاء A
            </option>

            <option value="B">
                عملاء B
            </option>

            <option value="C">
                عملاء C
            </option>

        </select>

    </div>

</div>


<!-- ================= STATS ================= -->

<div class="stats">

    <div class="stat">
        <b id="total">0</b>
        <span>كل العملاء</span>
    </div>

    <div class="stat">
        <b id="calledCount">0</b>
        <span>تم الاتصال</span>
    </div>

    <div class="stat">
        <b id="notCalledCount">0</b>
        <span>لم أتصل</span>
    </div>

    <div class="stat">
        <b id="ordersCount">0</b>
        <span>طلبات</span>
    </div>

    <div class="stat">
        <b id="noAnswerCount">0</b>
        <span>لم يرد</span>
    </div>

</div>


<!-- ================= CUSTOMERS ================= -->

<div id="customers"></div>

</div>


<!-- ================= EDIT MODAL ================= -->

<div class="modal" id="editModal">

<div class="modal-box">

    <h2>✏️ تعديل بيانات العميل</h2>

    <div class="grid">

        <div>
            <label>اسم العميل</label>
            <input id="editName">
        </div>

        <div>
            <label>رقم الهاتف</label>
            <input id="editPhone">
        </div>

        <div>
            <label>العنوان</label>
            <input id="editAddress">
        </div>

        <div>

            <label>نوع العميل</label>

            <select id="editType">

                <option value="A">A - مهم</option>
                <option value="B">B - متوسط</option>
                <option value="C">C - عادي</option>

            </select>

        </div>

        <div>
            <label>تاريخ الاتصال</label>
            <input id="editDate" type="date">
        </div>

        <div>
            <label>ميعاد الاتصال</label>
            <input id="editTime" type="time">
        </div>

        <div class="full">

            <label>الملاحظات</label>

            <textarea id="editNotes"></textarea>

        </div>

        <div class="full">

            <label>حالة الطلبية</label>

            <select id="editOrderStatus">

                <option value="none">
                    لم يتم تحديدها
                </option>

                <option value="yes">
                    📦 أخذ طلبية
                </option>

                <option value="no">
                    ❌ لم يأخذ طلبية
                </option>

                <option value="later1">
                    ⏰ بعد ساعة
                </option>

                <option value="later2">
                    ⏰ بعد ساعتين
                </option>

            </select>

        </div>

    </div>

    <div class="modal-buttons">

        <button class="action save" onclick="saveEdit()">
            💾 حفظ التعديل
        </button>

        <button class="action close" onclick="closeEdit()">
            إلغاء
        </button>

    </div>

</div>

</div>


<div id="message"></div>


<script>

/* =====================================================
   DATABASE
===================================================== */

const DB_KEY = "AHMED_FAYED_CUSTOMERS_PRO_V3";

let customers = [];

let editId = null;


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.style.display = "block";

    clearTimeout(window.messageTimer);

    window.messageTimer =
        setTimeout(() => {

            box.style.display = "none";

        },2500);

}


/* =====================================================
   TODAY
===================================================== */

function getToday(){

    const d = new Date();

    return (
        d.getFullYear() +
        "-" +
        String(d.getMonth()+1).padStart(2,"0") +
        "-" +
        String(d.getDate()).padStart(2,"0")
    );

}


/* =====================================================
   LOAD
===================================================== */

function loadCustomers(){

    try{

        const data =
            localStorage.getItem(DB_KEY);

        if(data){

            const parsed =
                JSON.parse(data);

            if(Array.isArray(parsed)){

                customers = parsed;

            }

        }

    }catch(error){

        console.error(error);

        customers = [];

    }

}


/* =====================================================
   SAVE
===================================================== */

function saveCustomers(){

    try{

        localStorage.setItem(
            DB_KEY,
            JSON.stringify(customers)
        );

        return true;

    }catch(error){

        console.error(error);

        alert(
            "تعذر حفظ البيانات على الجهاز."
        );

        return false;

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   ADD CUSTOMER
===================================================== */

function addCustomer(){

    const name =
        document.getElementById("name")
        .value
        .trim();

    const phone =
        document.getElementById("phone")
        .value
        .trim();

    if(!name){

        alert("اكتب اسم العميل");

        document.getElementById("name").focus();

        return;

    }

    if(!phone){

        alert("اكتب رقم الهاتف");

        document.getElementById("phone").focus();

        return;

    }


    const customer = {

        id:
            "CUS-" +
            Date.now() +
            "-" +
            Math.random()
            .toString(36)
            .substring(2,7),

        name:name,

        phone:phone,

        address:
            document
            .getElementById("address")
            .value
            .trim(),

        type:
            document
            .getElementById("type")
            .value,

        date:
            document
            .getElementById("date")
            .value,

        time:
            document
            .getElementById("time")
            .value,

        notes:
            document
            .getElementById("notes")
            .value
            .trim(),

        orderStatus:
            document
            .getElementById("orderStatus")
            .value,

        calls:{},

        noAnswer:{},

        reminderSent:{},

        createdAt:
            new Date().toISOString()

    };


    customers.push(customer);


    if(!saveCustomers()){

        customers.pop();

        return;

    }


    clearAddForm();

    renderCustomers();

    showMessage(
        "✅ تم إضافة العميل وحفظه بنجاح"
    );

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearAddForm(){

    document.getElementById("name").value = "";

    document.getElementById("phone").value = "";

    document.getElementById("address").value = "";

    document.getElementById("type").value = "C";

    document.getElementById("date").value = "";

    document.getElementById("time").value = "";

    document.getElementById("notes").value = "";

    document.getElementById("orderStatus").value = "none";

}


/* =====================================================
   CALLS
===================================================== */

function getCallsToday(customer){

    if(!customer.calls){

        customer.calls = {};

    }

    return Number(
        customer.calls[getToday()] || 0
    );

}


function addCall(id){

    const customer =
        customers.find(
            c => c.id === id
        );

    if(!customer){

        return;

    }


    if(!customer.calls){

        customer.calls = {};

    }


    const today =
        getToday();


    customer.calls[today] =
        Number(customer.calls[today] || 0) + 1;


    saveCustomers();

    renderCustomers();

    showMessage(
        "📞 تم تسجيل الرنة رقم " +
        customer.calls[today]
    );

}


/* =====================================================
   PHONE CALL
===================================================== */

function callCustomer(id){

    const customer =
        customers.find(
            c => c.id === id
        );

    if(!customer){

        return;

    }


    addCall(id);


    setTimeout(() => {

        window.location.href =
            "tel:" +
            customer.phone;

    },100);

}


/* =====================================================
   WHATSAPP
===================================================== */

function normalizePhone(phone){

    let number =
        String(phone || "")
        .replace(/\D/g,"");


    if(number.startsWith("01")){

        number =
            "20" +
            number.substring(1);

    }

    else if(
        number.startsWith("1") &&
        number.length === 10
    ){

        number =
            "20" +
            number;

    }


    return number;

}


function whatsapp(id){

    const customer =
        customers.find(
            c => c.id === id
        );

    if(!customer){

        return;

    }


    const number =
        normalizePhone(
            customer.phone
        );


    if(!number){

        alert("رقم الهاتف غير صحيح");

        return;

    }


    const message =
        "أهلاً " +
        customer.name +
        "، معاك أحمد فايد.";


    const url =
        "https://wa.me/" +
        number +
        "?text=" +
        encodeURIComponent(message);


    window.open(url,"_blank");

}


/* =====================================================
   MARK CALLED
===================================================== */

function markCalled(id){

    addCall(id);

}


/* =====================================================
   NO ANSWER
===================================================== */

function markNoAnswer(id){

    const customer =
        customers.find(
            c => c.id === id
        );

    if(!customer){

        return;

    }


    if(!customer.noAnswer){

        customer.noAnswer = {};

    }


    customer.noAnswer[getToday()] = true;


    saveCustomers();

    renderCustomers();

    showMessage(
        "❌ تم تسجيل أن العميل لم يرد"
    );

}


/* =====================================================
   ORDER STATUS
===================================================== */

function setOrder(id,status){

    const customer =
        customers.find(
            c => c.id === id
        );

    if(!customer){

        return;

    }


    customer.orderStatus =
        status;


    saveCustomers();

    renderCustomers();

    showMessage(
        "📦 تم تحديث حالة الطلبية"
    );

}


/* =====================================================
   EDIT
===================================================== */

function editCustomer(id){

    const customer =
        customers.find(
            c => c.id === id
        );

    if(!customer){

        return;

    }


    editId = id;


    document.getElementById("editName").value =
        customer.name || "";

    document.getElementById("editPhone").value =
        customer.phone || "";

    document.getElementById("editAddress").value =
        customer.address || "";

    document.getElementById("editType").value =
        customer.type || "C";

    document.getElementById("editDate").value =
        customer.date || "";

    document.getElementById("editTime").value =
        customer.time || "";

    document.getElementById("editNotes").value =
        customer.notes || "";

    document.getElementById("editOrderStatus").value =
        customer.orderStatus || "none";


    document
        .getElementById("editModal")
        .classList
        .add("show");

}


function saveEdit(){

    const customer =
        customers.find(
            c => c.id === editId
        );

    if(!customer){

        return;

    }


    const name =
        document
        .getElementById("editName")
        .value
        .trim();

    const phone =
        document
        .getElementById("editPhone")
        .value
        .trim();


    if(!name){

        alert("اكتب اسم العميل");

        return;

    }


    if(!phone){

        alert("اكتب رقم الهاتف");

        return;

    }


    customer.name =
        name;

    customer.phone =
        phone;

    customer.address =
        document
        .getElementById("editAddress")
        .value
        .trim();

    customer.type =
        document
        .getElementById("editType")
        .value;

    customer.date =
        document
        .getElementById("editDate")
        .value;

    customer.time =
        document
        .getElementById("editTime")
        .value;

    customer.notes =
        document
        .getElementById("editNotes")
        .value
        .trim();

    customer.orderStatus =
        document
        .getElementById("editOrderStatus")
        .value;


    saveCustomers();

    closeEdit();

    renderCustomers();

    showMessage(
        "✅ تم تعديل بيانات العميل"
    );

}


function closeEdit(){

    editId = null;

    document
        .getElementById("editModal")
        .classList
        .remove("show");

}


/* =====================================================
   DELETE
===================================================== */

function deleteCustomer(id){

    const customer =
        customers.find(
            c => c.id === id
        );

    if(!customer){

        return;

    }


    if(
        !confirm(
            "هل تريد حذف العميل:\n" +
            customer.name +
            " ؟"
        )
    ){

        return;

    }


    customers =
        customers.filter(
            c => c.id !== id
        );


    saveCustomers();

    renderCustomers();

    showMessage(
        "🗑️ تم حذف العميل"
    );

}


/* =====================================================
   ORDER BADGE
===================================================== */

function getOrderBadge(status){

    if(status === "yes"){

        return `
            <span class="badge blue">
                📦 أخذ طلبية
            </span>
        `;

    }


    if(status === "no"){

        return `
            <span class="badge red">
                ❌ لم يأخذ طلبية
            </span>
        `;

    }


    if(status === "later1"){

        return `
            <span class="badge orange">
                ⏰ بعد ساعة
            </span>
        `;

    }


    if(status === "later2"){

        return `
            <span class="badge orange">
                ⏰ بعد ساعتين
            </span>
        `;

    }


    return "";

}


/* =====================================================
   REMINDER
===================================================== */

function reminderText(customer){

    if(
        !customer.date ||
        !customer.time
    ){

        return "غير محدد";

    }


    return (
        customer.date +
        " - " +
        customer.time
    );

}


/* =====================================================
   NOTIFICATION PERMISSION
===================================================== */

async function enableNotifications(){

    if(!("Notification" in window)){

        alert(
            "المتصفح الحالي لا يدعم إشعارات النظام."
        );

        return;

    }


    try{

        const permission =
            await Notification.requestPermission();


        if(permission === "granted"){

            showMessage(
                "🔔 تم تفعيل الإشعارات"
            );

            playSound();

        }

        else{

            alert(
                "يجب السماح بالإشعارات من إعدادات المتصفح."
            );

        }

    }catch(error){

        console.error(error);

    }

}


/* =====================================================
   SOUND
===================================================== */

function playSound(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext){

            return;

        }


        const ctx =
            new AudioContext();

        const osc =
            ctx.createOscillator();

        const gain =
            ctx.createGain();


        osc.type = "sine";

        osc.frequency.value = 850;

        gain.gain.setValueAtTime(
            .0001,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .25,
            ctx.currentTime + .03
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            ctx.currentTime + .65
        );


        osc.connect(gain);

        gain.connect(ctx.destination);

        osc.start();

        osc.stop(
            ctx.currentTime + .7
        );

    }catch(error){

        console.log(error);

    }

}


/* =====================================================
   SEND NOTIFICATION
===================================================== */

function sendCustomerNotification(customer){

    if(
        !("Notification" in window) ||
        Notification.permission !== "granted"
    ){

        return;

    }


    if(
        !customer.date ||
        !customer.time
    ){

        return;

    }


    const key =
        customer.date +
        "_" +
        customer.time;


    if(!customer.reminderSent){

        customer.reminderSent = {};

    }


    if(customer.reminderSent[key]){

        return;

    }


    const now =
        new Date();


    const target =
        new Date(
            customer.date +
            "T" +
            customer.time
        );


    const diff =
        target.getTime() -
        now.getTime();


    /* الإشعار عند الموعد */

    if(
        diff <= 30000 &&
        diff >= -60000
    ){

        customer.reminderSent[key] =
            true;


        saveCustomers();


        const notification =
            new Notification(
                "📞 موعد الاتصال - أحمد فايد",
                {
                    body:
                        "حان موعد الاتصال بالعميل: " +
                        customer.name,

                    tag:
                        "customer-" +
                        customer.id,

                    data:{
                        customerId:
                            customer.id
                    }
                }
            );


        notification.onclick =
            function(){

                window.focus();

                window.location.hash =
                    "customer-" +
                    customer.id;

                setTimeout(
                    () =>
                        openCustomerCard(
                            customer.id
                        ),
                    100
                );

                notification.close();

            };


        playSound();

        showMessage(
            "🔔 حان موعد الاتصال بـ " +
            customer.name
        );

    }

}


/* =====================================================
   CHECK REMINDERS
===================================================== */

function checkReminders(){

    const now =
        new Date();


    customers.forEach(
        customer => {

            sendCustomerNotification(
                customer
            );

        }
    );

}


/* =====================================================
   OPEN CUSTOMER CARD
===================================================== */

function openCustomerCard(id){

    renderCustomers();


    setTimeout(() => {

        const element =
            document.getElementById(
                "customer-" + id
            );


        if(element){

            element.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });


            element.classList.add(
                "highlight"
            );


            setTimeout(() => {

                element.classList.remove(
                    "highlight"
                );

            },4000);

        }

    },100);

}


/* =====================================================
   RENDER
===================================================== */

function renderCustomers(){

    const container =
        document.getElementById("customers");


    const search =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const filter =
        document
        .getElementById("filter")
        .value;


    const today =
        getToday();


    /* STATS */

    document.getElementById("total")
        .textContent =
        customers.length;


    document.getElementById("calledCount")
        .textContent =
        customers.filter(
            c =>
                getCallsToday(c) > 0
        ).length;


    document.getElementById("notCalledCount")
        .textContent =
        customers.filter(
            c =>
                getCallsToday(c) === 0
        ).length;


    document.getElementById("ordersCount")
        .textContent =
        customers.filter(
            c =>
                c.orderStatus === "yes"
        ).length;


    document.getElementById("noAnswerCount")
        .textContent =
        customers.filter(
            c =>
                c.noAnswer &&
                c.noAnswer[today]
        ).length;


    /* FILTER */

    const result =
        customers.filter(
            customer => {

                const text =
                    (
                        customer.name +
                        " " +
                        customer.phone +
                        " " +
                        (customer.address || "") +
                        " " +
                        (customer.notes || "")
                    )
                    .toLowerCase();


                if(
                    search &&
                    !text.includes(search)
                ){

                    return false;

                }


                const calls =
                    getCallsToday(customer);


                if(
                    filter === "notCalled" &&
                    calls > 0
                ){

                    return false;

                }


                if(
                    filter === "called" &&
                    calls === 0
                ){

                    return false;

                }


                if(
                    filter === "noAnswer" &&
                    !(
                        customer.noAnswer &&
                        customer.noAnswer[today]
                    )
                ){

                    return false;

                }


                if(
                    filter === "orders" &&
                    customer.orderStatus !== "yes"
                ){

                    return false;

                }


                if(
                    filter === "noOrders" &&
                    customer.orderStatus !== "no"
                ){

                    return false;

                }


                if(
                    ["A","B","C"]
                    .includes(filter) &&
                    customer.type !== filter
                ){

                    return false;

                }


                return true;

            }
        );


    if(result.length === 0){

        container.innerHTML = `
            <div class="card empty">
                👥
                <br><br>
                لا يوجد عملاء مطابقين للبحث
            </div>
        `;

        return;

    }


    /* RENDER */

    container.innerHTML =
        result.map(
            customer => {

                const calls =
                    getCallsToday(customer);


                const called =
                    calls > 0;


                const noAnswer =
                    customer.noAnswer &&
                    customer.noAnswer[today];


                const type =
                    customer.type || "C";


                return `

<div
    class="customer"
    id="customer-${escapeHTML(customer.id)}"
>

    <div class="customer-title">

        <div class="customer-name">
            👤
            ${escapeHTML(customer.name)}
        </div>

        <div class="type type-${type}">
            ${type}
        </div>

    </div>


    <div class="customer-body">

        <div class="info">

            <span>📞 الهاتف:</span>

            <b>
                ${escapeHTML(customer.phone)}
            </b>

        </div>


        <div class="info">

            <span>📍 العنوان:</span>

            <b>
                ${
                    escapeHTML(
                        customer.address ||
                        "غير محدد"
                    )
                }
            </b>

        </div>


        <div class="info">

            <span>📅 موعد الاتصال:</span>

            <b>

                ${
                    reminderText(customer)
                }

            </b>

        </div>


        <div class="notes">

            ${
                customer.notes
                ?
                escapeHTML(customer.notes)
                :
                "لا توجد ملاحظات"
            }

        </div>


        <div class="badges">

            <span class="badge ${
                called
                ?
                "green"
                :
                "orange"
            }">

                ${
                    called
                    ?
                    "✅ تم الاتصال اليوم"
                    :
                    "⏳ لم أتصل اليوم"
                }

            </span>


            <span class="badge blue">

                📞 عدد الرنات اليوم:
                ${calls}

            </span>


            ${
                noAnswer
                ?
                `
                <span class="badge red">
                    ❌ لم يرد
                </span>
                `
                :
                ""
            }


            ${getOrderBadge(
                customer.orderStatus
            )}

        </div>


        <div class="actions">


            <button
                class="action call"
                onclick="callCustomer('${escapeHTML(customer.id)}')"
            >
                📞 اتصال + رن
            </button>


            <button
                class="action whatsapp"
                onclick="whatsapp('${escapeHTML(customer.id)}')"
            >
                💬 واتساب
            </button>


            <button
                class="action called"
                onclick="markCalled('${escapeHTML(customer.id)}')"
            >
                ✅ تم الاتصال
            </button>


            <button
                class="action noanswer"
                onclick="markNoAnswer('${escapeHTML(customer.id)}')"
            >
                ❌ لم يرد
            </button>


            <button
                class="action order"
                onclick="setOrder('${escapeHTML(customer.id)}','yes')"
            >
                📦 أخذ طلبية
            </button>


            <button
                class="action noorder"
                onclick="setOrder('${escapeHTML(customer.id)}','no')"
            >
                🚫 لم يأخذ
            </button>


            <button
                class="action follow"
                onclick="setOrder('${escapeHTML(customer.id)}','later1')"
            >
                ⏰ بعد ساعة
            </button>


            <button
                class="action follow"
                onclick="setOrder('${escapeHTML(customer.id)}','later2')"
            >
                ⏰ بعد ساعتين
            </button>


            <button
                class="action reminder"
                onclick="enableNotifications()"
            >
                🔔 تفعيل التنبيه
            </button>


            <button
                class="action edit"
                onclick="editCustomer('${escapeHTML(customer.id)}')"
            >
                ✏️ تعديل
            </button>


            <button
                class="action delete"
                onclick="deleteCustomer('${escapeHTML(customer.id)}')"
            >
                🗑️ حذف
            </button>

        </div>

    </div>

</div>

                `;

            }
        ).join("");

}


/* =====================================================
   EXPORT BACKUP
===================================================== */

function exportBackup(){

    const backup = {

        app:
            "Ahmed Fayed Customer Manager",

        version:
            "3.0",

        exportedAt:
            new Date().toISOString(),

        customers:
            customers

    };


    const json =
        JSON.stringify(
            backup,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    const date =
        getToday();


    a.href = url;

    a.download =
        "Ahmed-Fayed-Backup-" +
        date +
        ".json";


    document.body.appendChild(a);

    a.click();

    a.remove();


    URL.revokeObjectURL(url);


    showMessage(
        "📤 تم إنشاء النسخة الاحتياطية"
    );

}


/* =====================================================
   RESTORE BACKUP
===================================================== */

function restoreBackup(event){

    const file =
        event.target.files[0];


    if(!file){

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            try{

                const data =
                    JSON.parse(
                        e.target.result
                    );


                let imported;


                if(
                    Array.isArray(data)
                ){

                    imported = data;

                }

                else if(
                    Array.isArray(
                        data.customers
                    )
                ){

                    imported =
                        data.customers;

                }

                else{

                    throw new Error(
                        "ملف غير صحيح"
                    );

                }


                if(
                    !confirm(
                        "سيتم استبدال العملاء الحاليين بالنسخة الاحتياطية.\nهل تريد المتابعة؟"
                    )
                ){

                    return;

                }


                customers =
                    imported.map(
                        customer => {

                            if(!customer.id){

                                customer.id =
                                    "CUS-" +
                                    Date.now() +
                                    "-" +
                                    Math.random()
                                    .toString(36)
                                    .substring(2,7);

                            }


                            if(!customer.calls){

                                customer.calls = {};

                            }


                            if(!customer.noAnswer){

                                customer.noAnswer = {};

                            }


                            if(!customer.reminderSent){

                                customer.reminderSent = {};

                            }


                            return customer;

                        }
                    );


                if(
                    saveCustomers()
                ){

                    renderCustomers();

                    showMessage(
                        "📥 تم استرداد النسخة الاحتياطية بنجاح"
                    );

                }

            }catch(error){

                console.error(error);

                alert(
                    "❌ الملف غير صالح أو تالف."
                );

            }

            event.target.value = "";

        };


    reader.readAsText(file);

}
