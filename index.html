<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>أحمد فايد - إدارة العملاء</title>

<style>
:root{
    --bg:#0b1120;
    --card:#111827;
    --card2:#1f2937;
    --input:#0f172a;
    --border:#334155;
    --text:#f8fafc;
    --muted:#94a3b8;
    --blue:#2563eb;
    --green:#16a34a;
    --red:#dc2626;
    --orange:#d97706;
    --purple:#7c3aed;
    --cyan:#0891b2;
    --gray:#475569;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:12px;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#1d4ed8,#312e81);
    border-radius:24px;
    padding:22px 15px;
    text-align:center;
    margin-bottom:14px;
    box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.header h1{
    margin:0 0 8px;
    font-size:28px;
}

.header p{
    margin:0;
    color:#dbeafe;
}

/* CARDS */

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:16px;
    margin-bottom:14px;
}

.title{
    margin:0 0 14px;
    font-size:20px;
}

/* FORM */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.field{
    width:100%;
}

.field.full{
    grid-column:1/-1;
}

label{
    display:block;
    color:var(--muted);
    font-size:13px;
    margin:0 0 5px;
}

input,
select,
textarea{
    width:100%;
    border:1px solid var(--border);
    background:var(--input);
    color:var(--text);
    border-radius:13px;
    padding:13px;
    outline:none;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--blue);
}

textarea{
    min-height:90px;
    resize:vertical;
}

.main-btn{
    width:100%;
    border:0;
    border-radius:13px;
    padding:14px;
    background:var(--blue);
    color:#fff;
    font-size:16px;
    font-weight:bold;
    margin-top:12px;
}

/* SEARCH */

.search-grid{
    display:grid;
    grid-template-columns:1fr 200px;
    gap:10px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
    margin-bottom:14px;
}

.stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:17px;
    padding:13px 7px;
    text-align:center;
}

.stat-number{
    display:block;
    font-size:24px;
    font-weight:bold;
    margin-bottom:5px;
}

.stat-label{
    color:var(--muted);
    font-size:12px;
}

/* CUSTOMER */

.customer{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    margin-bottom:13px;
}

.customer-head{
    background:var(--card2);
    padding:15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.customer-name{
    font-size:19px;
    font-weight:bold;
}

.type-badge{
    min-width:34px;
    text-align:center;
    background:#334155;
    padding:5px 9px;
    border-radius:20px;
    font-weight:bold;
}

.customer-body{
    padding:15px;
}

.info{
    margin-bottom:9px;
    line-height:1.7;
}

.info-label{
    color:var(--muted);
}

.info-value{
    color:#fff;
    font-weight:bold;
}

.notes{
    background:#0f172a;
    border:1px solid var(--border);
    padding:10px;
    border-radius:12px;
    margin:10px 0;
    white-space:pre-wrap;
    line-height:1.6;
}

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:10px 0;
}

.badge{
    display:inline-block;
    padding:7px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.badge-green{
    background:#14532d;
    color:#bbf7d0;
}

.badge-red{
    background:#450a0a;
    color:#fecaca;
}

.badge-orange{
    background:#451a03;
    color:#fed7aa;
}

.badge-blue{
    background:#172554;
    color:#bfdbfe;
}

.badge-gray{
    background:#334155;
    color:#e2e8f0;
}

/* BUTTONS */

.actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:7px;
    margin-top:12px;
}

.action{
    border:0;
    border-radius:12px;
    color:white;
    padding:12px 8px;
    font-weight:bold;
    font-size:13px;
}

.call{
    background:var(--green);
}

.whatsapp{
    background:#16a34a;
}

.called{
    background:var(--cyan);
}

.no-answer{
    background:var(--red);
}

.order{
    background:var(--purple);
}

.no-order{
    background:#991b1b;
}

.follow{
    background:var(--orange);
}

.edit{
    background:#0e7490;
}

.delete{
    background:var(--gray);
}

/* EMPTY */

.empty{
    text-align:center;
    color:var(--muted);
    padding:35px 10px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:12px;
}

.modal.open{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:650px;
    max-height:92vh;
    overflow:auto;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    padding:17px;
}

.modal-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:10px;
}

.save-edit{
    background:var(--green);
}

.close-edit{
    background:var(--gray);
}

.notification{
    width:100%;
    border:0;
    border-radius:13px;
    padding:13px;
    background:var(--purple);
    color:white;
    font-weight:bold;
}

/* TOAST */

#toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#020617;
    border:1px solid var(--border);
    color:white;
    padding:13px 18px;
    border-radius:14px;
    display:none;
    z-index:2000;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}

#toast.show{
    display:block;
}

/* MOBILE */

@media(max-width:650px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .search-grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .actions{
        grid-template-columns:1fr;
    }

    .modal-actions{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<header class="header">
    <h1>📞 أحمد فايد</h1>
    <p>إدارة ومتابعة العملاء - تليسلز مخزن الفتح</p>
</header>


<!-- ADD CUSTOMER -->

<section class="card">

    <h2 class="title">➕ إضافة عميل جديد</h2>

    <div class="form-grid">

        <div class="field">
            <label>اسم العميل</label>
            <input id="name" type="text" placeholder="اسم العميل">
        </div>

        <div class="field">
            <label>رقم الهاتف</label>
            <input id="phone" type="tel" placeholder="رقم الهاتف">
        </div>

        <div class="field">
            <label>عنوان العميل</label>
            <input id="address" type="text" placeholder="عنوان العميل">
        </div>

        <div class="field">
            <label>نوع العميل</label>
            <select id="type">
                <option value="A">A - عميل مهم</option>
                <option value="B">B - عميل متوسط</option>
                <option value="C">C - عميل عادي</option>
            </select>
        </div>

        <div class="field">
            <label>تاريخ الاتصال</label>
            <input id="date" type="date">
        </div>

        <div class="field">
            <label>ميعاد الاتصال</label>
            <input id="time" type="time">
        </div>

        <div class="field full">
            <label>ملاحظات</label>
            <textarea id="note" placeholder="اكتب ملاحظات العميل هنا..."></textarea>
        </div>

        <div class="field full">
            <label>حالة الطلبية</label>

            <select id="orderStatus">
                <option value="none">لم يتم تحديد الحالة</option>
                <option value="yes">📦 أخذ طلبية</option>
                <option value="no">❌ لم يأخذ طلبية</option>
                <option value="later1">⏰ كلمني بعد ساعة</option>
                <option value="later2">⏰ كلمني بعد ساعتين</option>
            </select>

        </div>

    </div>

    <button class="main-btn" onclick="addCustomer()">
        💾 حفظ العميل
    </button>

</section>


<!-- NOTIFICATIONS -->

<section class="card">

    <h2 class="title">🔔 إشعارات المواعيد</h2>

    <button class="notification" onclick="enableNotifications()">
        🔔 تفعيل إشعارات مواعيد الاتصال
    </button>

</section>


<!-- SEARCH -->

<section class="card">

    <h2 class="title">🔎 البحث والمتابعة</h2>

    <div class="search-grid">

        <input
            id="search"
            type="search"
            placeholder="ابحث بالاسم أو الرقم أو العنوان..."
            oninput="render()"
        >

        <select id="filter" onchange="render()">
            <option value="all">كل العملاء</option>
            <option value="notCalled">لم أتصل بهم اليوم</option>
            <option value="called">اتصلت بهم اليوم</option>
            <option value="noAnswer">لم يردوا اليوم</option>
            <option value="orders">أخذوا طلبية</option>
            <option value="noOrders">لم يأخذوا طلبية</option>
            <option
