<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>أحمد فايد - إدارة العملاء</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#08111f;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

.container{
    max-width:1050px;
    margin:auto;
    padding:15px;
}

.header{
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    border-radius:22px;
    padding:24px;
    text-align:center;
    margin-bottom:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.header h1{
    margin:0 0 8px;
    font-size:28px;
}

.header p{
    margin:0;
    color:#dbeafe;
}

.card{
    background:#111827;
    border:1px solid #263449;
    border-radius:18px;
    padding:17px;
    margin-bottom:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
}

h2{
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:11px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    color:#cbd5e1;
    margin-bottom:6px;
    font-size:14px;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    border-radius:12px;
    border:1px solid #475569;
    background:#0b1322;
    color:#fff;
    outline:none;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 2px rgba(59,130,246,.15);
}

textarea{
    min-height:95px;
    resize:vertical;
}

.btn{
    width:100%;
    border:0;
    border-radius:13px;
    padding:14px;
    color:white;
    font-weight:bold;
    font-size:16px;
    margin-top:13px;
    cursor:pointer;
}

.add-btn{
    background:#16a34a;
}

.add-btn:hover{
    background:#15803d;
}

.search{
    margin-bottom:10px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-bottom:15px;
}

.stat{
    background:#111827;
    border:1px solid #263449;
    border-radius:15px;
    padding:15px 5px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:23px;
    margin-bottom:5px;
}

.stat span{
    color:#94a3b8;
    font-size:12px;
}

.customer{
    background:#111827;
    border:1px solid #263449;
    border-radius:18px;
    margin-bottom:13px;
    overflow:hidden;
}

.customer-title{
    background:#1e293b;
    padding:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.customer-name{
    font-size:19px;
    font-weight:bold;
}

.type{
    border-radius:20px;
    padding:6px 13px;
    font-weight:bold;
    min-width:40px;
    text-align:center;
}

.type-a{
    background:#991b1b;
}

.type-b{
    background:#92400e;
}

.type-c{
    background:#166534;
}

.customer-body{
    padding:15px;
}

.info{
    margin:8px 0;
    line-height:1.6;
}

.info span{
    color:#94a3b8;
}

.notes{
    background:#0b1322;
    border-radius:12px;
    padding:11px;
    margin-top:10px;
    white-space:pre-wrap;
    line-height:1.6;
}

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin:13px 0;
}

.badge{
    padding:7px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.green{
    background:#14532d;
}

.red{
    background:#7f1d1d;
}

.orange{
    background:#78350f;
}

.blue{
    background:#1e3a8a;
}

.gray{
    background:#334155;
}

.purple{
    background:#581c87;
}

.cyan{
    background:#164e63;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.action{
    border:0;
    border-radius:10px;
    color:#fff;
    padding:11px 7px;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
}

.call{
    background:#16a34a;
}

.whatsapp{
    background:#15803d;
}

.called{
    background:#0891b2;
}

.noanswer{
    background:#dc2626;
}

.order{
    background:#7c3aed;
}

.noorder{
    background:#991b1b;
}

.follow{
    background:#d97706;
}

.edit{
    background:#0369a1;
}

.delete{
    background:#475569;
}

.reset{
    background:#be123c;
}

.empty{
    text-align:center;
    color:#94a3b8;
    padding:40px;
}

.toolbar{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.small-btn{
    border:0;
    border-radius:11px;
    padding:12px;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.export{
    background:#2563eb;
}

.import{
    background:#7c3aed;
}

.clear-all{
    background:#991b1b;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    z-index:999;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:#111827;
    width:100%;
    max-width:700px;
    max-height:92vh;
    overflow:auto;
    border-radius:20px;
    padding:18px;
    border:1px solid #334155;
}

.modal-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
}

.save{
    background:#16a34a;
}

.close{
    background:#475569;
}

#message{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#020617;
    border:1px solid #475569;
    padding:13px 20px;
    border-radius:12px;
    display:none;
    z-index:2000;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    max-width:90%;
    text-align:center;
}

.reminder{
    border:1px solid #d97706;
    background:#451a03;
    border-radius:12px;
    padding:10px;
    margin-bottom:10px;
}

@media(max-width:700px){

    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .stats .stat:last-child{
        grid-column:1/-1;
    }

    .actions{
        grid-template-columns:1fr;
    }

    .toolbar{
        grid-template-columns:1fr;
    }

    .modal-buttons{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📞 أحمد فايد</h1>
        <p>إدارة ومتابعة العملاء</p>
    </div>


    <!-- إضافة عميل -->

    <div class="card">

        <h2>➕ إضافة عميل جديد</h2>

        <div class="grid">

            <div>
                <label>اسم العميل *</label>
                <input id="name" type="text" placeholder="اكتب اسم العميل">
            </div>

            <div>
                <label>رقم الهاتف *</label>
                <input id="phone" type="tel" placeholder="01xxxxxxxxx">
            </div>

            <div>
                <label>عنوان العميل</label>
                <input id="address" type="text" placeholder="عنوان العميل">
            </div>

            <div>
                <label>نوع العميل ABC</label>

                <select id="type">
                    <option value="A">A - مهم</option>
                    <option value="B">B - متوسط</option>
                    <option value="C" selected>C - عادي</option>
                </select>

            </div>

            <div>
                <label>تاريخ الاتصال</label>
                <input id="date" type="date">
            </div>

            <div>
                <label>ميعاد الاتصال</label>
                <input id="time" type="time">
            </div>

            <div class="full">

                <label>ملاحظات</label>

                <textarea
                    id="notes"
                    placeholder="اكتب ملاحظات العميل"
                ></textarea>

            </div>

            <div class="full">

                <label>حالة الطلبية</label>

                <select id="orderStatus">

                    <option value="none">
                        لم يتم تحديدها
                    </option>

                    <option value="yes">
                        📦 أخذ طلبية
                    </option>

                    <option value="no">
                        ❌ لم يأخذ طلبية
                    </option>

                    <option value="later1">
                        ⏰ كلمني بعد ساعة
                    </option>

                    <option value="later2">
                        ⏰ كلمني بعد ساعتين
                    </option>

                </select>

            </div>

        </div>

        <button
            class="btn add-btn"
            onclick="addCustomer()"
        >
            💾 إضافة وحفظ العميل
        </button>

    </div>


    <!-- البحث -->

    <div class="card">

        <h2>🔎 البحث والفلترة</h2>

        <input
            class="search"
            id="search"
            type="search"
            placeholder="ابحث باسم العميل أو الرقم أو العنوان..."
            oninput="renderCustomers()"
        >

        <select
            id="filter"
            onchange="renderCustomers()"
        >

            <option value="all">
                كل العملاء
            </option>

            <option value="notCalled">
                لم أتصل بهم اليوم
            </option>

            <option value="called">
                اتصلت بهم اليوم
            </option>

            <option value="noAnswer">
                لم يردوا اليوم
            </option>

            <option value="orders">
                أخذوا طلبية
            </option>

            <option value="noOrders">
                لم يأخذوا طلبية
            </option>

            <option value="A">
                عملاء A
            </option>

            <option value="B">
                عملاء B
            </option>

            <option value="C">
                عملاء C
            </option>

        </select>

    </div>


    <!-- الإحصائيات -->

    <div class="stats">

        <div class="stat">
            <b id="total">0</b>
            <span>كل العملاء</span>
        </div>

        <div class="stat">
            <b id="calledCount">0</b>
            <span>تم الاتصال</span>
        </div>

        <div class="stat">
            <b id="notCalledCount">0</b>
            <span>لم أتصل</span>
        </div>

        <div class="stat">
            <b id="ordersCount">0</b>
            <span>طلبات</span>
        </div>

        <div class="stat">
            <b id="noAnswerCount">0</b>
            <span>لم يرد</span>
        </div>

    </div>


    <!-- النسخ الاحتياطي -->

    <div class="card">

        <h2>💾 إدارة البيانات</h2>

        <div class="toolbar">

            <button
                class="small-btn export"
                onclick="exportData()"
            >
                📤 تصدير نسخة احتياطية

            <button

                onclick="document.getElementById('importFile').click()"
            >
                📥 استيراد نسخة احتياطية

    <!-- تنبيهات المواعيد -->

    <!-- العملاء -->

    <div id="customers"></div>

</div>


<!-- نافذة التعديل -->

<div
    class="modal"
    id="editModal"
>

    <div class="modal-box">

        <h2>✏️ تعديل بيانات العميل</h2>

        <div class="grid">

            <div>
                <label>اسم العميل</label>

            </div>

                <select id="editType">

                <label>تاريخ الاتصال</label>

            </div>

            </div>

                <select id="editOrderStatus">

                    <option value="none">
                        لم يتم تحديدها
                    </option>

                    <option value="yes">
                        📦 أخذ طلبية
                    </option>

                    <option value="no">
                        ❌ لم يأخذ طلبية
                    </option>

                    <option value="later1">
                        ⏰ بعد ساعة
                    </option>

        <div class="modal-buttons">

                💾 حفظ التعديل

            </button>

</div>


<div id="message"></div>


<script>

/* =====================================================
   قاعدة البيانات
===================================================== */

const DB_NAME =
    "ahmed_fayed_customers_v5";

let customers = [];

let editId = null;


/* =====================================================
   رسالة
===================================================== */

function showMessage(text){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.style.display = "block";

    clearTimeout(window.messageTimer);

    window.messageTimer =
        setTimeout(function(){

            box.style.display = "none";

        },2500);

}


/* =====================================================
   تحميل البيانات
===================================================== */

function loadCustomers(){

    try{

        const data =
            localStorage.getItem(DB_NAME);

        if(!data){

            customers = [];

            return;

        }

        const parsed =
            JSON.parse(data);

        customers =
            Array.isArray(parsed)
            ? parsed
            : [];

    }catch(error){

        console.error(error);

        customers = [];

    }

}


/* =====================================================
   حفظ البيانات
===================================================== */

function saveCustomers(){

    try{

        localStorage.setItem(
            DB_NAME,
            JSON.stringify(customers)
        );

        return true;

    }catch(error){

        console.error(error);

        alert(
            "❌ لم يتم حفظ البيانات. تأكد من أن المتصفح يسمح بالتخزين."
        );

        return false;

    }

}


/* =====================================================
   تاريخ اليوم
===================================================== */

function getToday(){

    const d =
        new Date();

    return (
        d.getFullYear() +
        "-" +
        String(d.getMonth()+1).padStart(2,"0") +
        "-" +
        String(d.getDate()).padStart(2,"0")
    );

}


/* =====================================================
   رقم العميل
===================================================== */

function normalizePhone(phone){

    let number =
        String(phone || "")
        .replace(/\D/g,"");

    if(number.startsWith("01")){

        number =
            "20" +
            number.substring(1);

    }

    if(number.startsWith("0020")){

        number =
            number.substring(2);

    }

    return number;

}


/* =====================================================
   حماية HTML
===================================================== */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   تنظيف نموذج الإضافة
===================================================== */

function clearAddForm(){

    document.getElementById("name").value = "";

    document.getElementById("phone").value = "";

    document.getElementById("address").value = "";

    document.getElementById("date").value = "";

    document.getElementById("time").value = "";

    document.getElementById("notes").value = "";

    document.getElementById("type").value = "C";

    document.getElementById("orderStatus").value = "none";

}


/* =====================================================
   إضافة عميل
===================================================== */

function addCustomer(){

    const name =
        document.getElementById("name")
        .value
        .trim();

    const phone =
        document.getElementById("phone")
        .value
        .trim();

    const address =
        document.getElementById("address")
        .value
        .trim();

    const type =
        document.getElementById("type")
        .value;

    const date =
        document.getElementById("date")
        .value;

    const time =
        document.getElementById("time")
        .value;

    const notes =
        document.getElementById("notes")
        .value
        .trim();

    const orderStatus =
        document.getElementById("orderStatus")
        .value;


    if(name === ""){

        alert(
            "من فضلك اكتب اسم العميل"
        );

        document
            .getElementById("name")
            .focus();

        return;

    }


    if(phone === ""){

        alert(
            "من فضلك اكتب رقم الهاتف"
        );

        document
            .getElementById("phone")
            .focus();

        return;

    }


    const customer = {

        id:
            Date.now().toString() +
            "_" +
            Math.random()
            .toString(36)
            .substring(2,8),

        name:name,

        phone:phone,

        address:address,

        type:type,

        date:date,

        time:time,

        notes:notes,

        orderStatus:orderStatus,

        calls:{},

        noAnswer:{},

        createdAt:
            new Date().toISOString()

    };


    customers.push(customer);


    const saved =
        saveCustomers();


    if(!saved){

        customers.pop();

        return;

    }


    clearAddForm();

    renderCustomers();

    showMessage(
        "✅ تم إضافة العميل وحفظه بنجاح"
    );

}


/* =====================================================
   العثور على عميل
===================================================== */

function findCustomer(id){

    return customers.find(
        item => String(item.id) === String(id)
    );

}


/* =====================================================
   عدد المكالمات اليوم
===================================================== */

function getCallsToday(customer){

    if(!customer.calls){

        customer.calls = {};

    }

    return Number(
        customer.calls[getToday()] || 0
    );

}


/* =====================================================
   تسجيل مكالمة
===================================================== */

function addCall(id){

    const customer =
        findCustomer(id);

    if(!customer){

        return false;

    }


    if(!customer.calls){

        customer.calls = {};

    }


    const today =
        getToday();


    const old =
        Number(
            customer.calls[today] || 0
        );


    customer.calls[today] =
        old + 1;


    if(!saveCustomers()){

        return false;

    }


    renderCustomers();

    showMessage(
        "📞 تم تسجيل الرنة رقم " +
        customer.calls[today]
    );

    return true;

}


/* =====================================================
   الاتصال
===================================================== */

function callCustomer(id){

    const customer =
        findCustomer(id);

    if(!customer){

        return;

    }


    if(!addCall(id)){

        return;

    }


    window.location.href =
        "tel:" +
        customer.phone;

}


/* =====================================================
   واتساب
===================================================== */

function whatsapp(id){

    const customer =
        findCustomer(id);

    if(!customer){

        return;

    }


    const number =
        normalizePhone(customer.phone);


    if(!number){

        alert(
            "رقم الهاتف غير صحيح"
        );

        return;

    }


    const message =
        "السلام عليكم " +
        customer.name +
        "، مع حضرتك أحمد فايد.";


    const url =
        "https://wa.me/" +
        number +
        "?text=" +
        encodeURIComponent(message);


    window.open(
        url,
        "_blank"
    );

}


/* =====================================================
   تم الاتصال - مستقل
===================================================== */

function markCalled(id){

    const customer =
        findCustomer(id);

    if(!customer){

        return;

    }


    if(!customer.called){

        customer.called = {};

    }


    customer.called[getToday()] =
        true;


    if(saveCustomers()){

        renderCustomers();

        showMessage(
            "✅ تم تعليم العميل بأنه تم الاتصال به"
        );

    }

}


/* =====================================================
   لم يرد - مستقل
===================================================== */

function markNoAnswer(id){

    const customer =
        findCustomer(id);

    if(!customer){

        return;

    }


    if(!customer.noAnswer){

        customer.noAnswer = {};

    }


    customer.noAnswer[getToday()] =
        true;


    if(saveCustomers()){

        renderCustomers();

        showMessage(
            "❌ تم تسجيل أن العميل لم يرد"
        );

    }

}


/* =====================================================
   إعادة ضبط حالة اليوم
===================================================== */

function resetToday(id){

    const customer =
        findCustomer(id);

    if(!customer){

        return;

    }


    const today =
        getToday();


    if(customer.calls){

        delete customer.calls[today];

    }


    if(customer.called){

        delete customer.called[today];

    }


    if(customer.noAnswer){

        delete customer.noAnswer[today];

    }


    saveCustomers();

    renderCustomers();

    showMessage(
        "🔄 تم إعادة ضبط حالة اليوم"
    );

}


/* =====================================================
   الطلبية
===================================================== */

function setOrder(id,status){

    const customer =
        findCustomer(id);

    if(!customer){

        return;

    }


    customer.orderStatus =
        status;


    if(saveCustomers()){

        renderCustomers();

        showMessage(
            "📦 تم تحديث حالة الطلبية"
        );

    }

}


/* =====================================================
   نص حالة الطلبية
===================================================== */

function getOrderBadge(status){

    if(status === "yes"){

        return `
            <span class="badge blue">
                📦 أخذ طلبية
            </span>
        `;

    }


    if(status === "no"){

        return `
            <span class="badge red">
                ❌ لم يأخذ طلبية
            </span>
        `;

    }


    if(status === "later1"){

        return `
            <span class="badge orange">
                ⏰ كلمني بعد ساعة
            </span>
        `;

    }


    if(status === "later2"){

        return `
            <span class="badge orange">
                ⏰ كلمني بعد ساعتين
            </span>
        `;

    }


    return "";

}


/* =====================================================
   تعديل
===================================================== */

function editCustomer(id){

    const customer =
        findCustomer(id);

    if(!customer){

        return;

    }


    editId =
        id;


    document.getElementById("editName").value =
        customer.name || "";

    document.getElementById("editPhone").value =
        customer.phone || "";

    document.getElementById("editAddress").value =
        customer.address || "";

    document.getElementById("editType").value =
        customer.type || "C";

    document.getElementById("editDate").value =
        customer.date || "";

    document.getElementById("editTime").value =
        customer.time || "";

    document.getElementById("editNotes").value =
        customer.notes || "";

    document.getElementById("editOrderStatus").value =
        customer.orderStatus || "none";


    document
        .getElementById("editModal")
        .classList
        .add("show");

}


/* =====================================================
   حفظ التعديل
===================================================== */

function saveEdit(){

    const customer =
        findCustomer(editId);

    if(!customer){

        return;

    }


    const name =
        document
        .getElementById("editName")
        .value
        .trim();

    const phone =
        document
        .getElementById("editPhone")
        .value
        .trim();


    if(name === ""){

        alert(
            "اكتب اسم العميل"
        );

        return;

    }


    if(phone === ""){

        alert(
            "اكتب رقم الهاتف"
        );

        return;

    }


    customer.name =
        name;

    customer.phone =
        phone;

    customer.address =
        document
        .getElementById("editAddress")
        .value
        .trim();

    customer.type =
        document
        .getElementById("editType")
        .value;

    customer.date =
        document
        .getElementById("editDate")
        .value;

    customer.time =
        document
        .getElementById("editTime")
        .value;

    customer.notes =
        document
        .getElementById("editNotes")
        .value
        .trim();

    customer.orderStatus =
        document
        .getElementById("editOrderStatus")
        .value;


    if(saveCustomers()){

        closeEdit();

        renderCustomers();

        showMessage(
            "✅ تم تعديل بيانات العميل"
        );

    }

}


/* =====================================================
   غلق التعديل
===================================================== */

function closeEdit(){

    editId =
        null;

    document
        .getElementById("editModal")
        .classList
        .remove("show");

}


/* =====================================================
   حذف عميل
===================================================== */

function deleteCustomer(id){

    const customer =
        findCustomer(id);

    if(!customer){

        return;

    }


    const ok =
        confirm(
            "هل تريد حذف العميل:\n" +
            customer.name +
            " ؟"
        );


    if(!ok){

        return;

    }


    customers =
        customers.filter(
            item =>
                String(item.id) !==
                String(id)
        );


    saveCustomers();

    renderCustomers();

    showMessage(
        "🗑️ تم حذف العميل"
    );

}


/* =====================================================
   حذف كل العملاء
===================================================== */

function deleteAllCustomers(){

    if(customers.length === 0){

        alert(
            "لا يوجد عملاء للحذف"
        );

        return;

    }


    const first =
        confirm(
            "⚠️ هل تريد حذف كل العملاء؟"
        );


    if(!first){

        return;

    }


    const second =
        confirm(
            "⚠️ تأكيد أخير: سيتم حذف كل البيانات نهائياً من هذا الجهاز."
        );


    if(!second){

        return;

    }


    customers = [];

    saveCustomers();

    renderCustomers();

    showMessage(
        "🗑️ تم حذف كل العملاء"
    );

}


/* =====================================================
   تصدير نسخة احتياطية
===================================================== */

function exportData(){

    if(customers.length === 0){

        alert(
            "لا يوجد عملاء لتصديرهم"
        );

        return;

    }


    const data =
        JSON.stringify(
            customers,
            null,
            2
        );


    const blob =
        new Blob(
            [data],
            {
                type:"application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href =
        url;


    a.download =
        "Ahmed_Fayed_Customers_Backup_" +
        getToday() +
        ".json";


    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);


    showMessage(
        "📤 تم تصدير النسخة الاحتياطية"
    );

}


/* =====================================================
   استيراد نسخة
===================================================== */

function importData(event){

    const file =
        event.target.files[0];


    if(!file){

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            try{

                const data =
                    JSON.parse(
                        e.target.result
                    );


                if(!Array.isArray(data)){

                    throw new Error(
                        "Invalid data"
                    );

                }


                const ok =
                    confirm(
                        "سيتم استبدال البيانات الحالية بالنسخة المستوردة. هل تريد المتابعة؟"
                    );


                if(!ok){

                    event.target.value = "";

                    return;

                }


                customers =
                    data;


                if(saveCustomers()){

                    renderCustomers();

                    showMessage(
                        "📥 تم استيراد البيانات بنجاح"
                    );

                }


            }catch(error){

                console.error(error);

                alert(
                    "❌ ملف النسخة الاحتياطية غير صحيح"
                );

            }


            event.target.value = "";

        };


    reader.readAsText(file);

}


/* =====================================================
   التذكيرات
===================================================== */

function renderReminders(){

    const box =
        document.getElementById("reminders");


    const today =
        getToday();


    const now =
        new Date();


    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();


    const reminders =
        customers.filter(
            customer => {

                if(
                    customer.date !== today ||
                    !customer.time
                ){

                    return false;

                }


                const parts =
                    customer.time.split(":");


                const minutes =
                    Number(parts[0]) * 60 +
                    Number(parts[1]);


                const called =
                    customer.called &&
                    customer.called[today];


                return (
                    !called &&
                    minutes <= currentMinutes + 5
                );

            }
        );


    if(reminders.length === 0){

        box.innerHTML = "";

        return;

    }


    box.innerHTML = `

        <div class="card">

            <h2>
                🔔 مواعيد تحتاج متابعة
            </h2>

            ${
                reminders.map(
                    customer => `

                    <div class="reminder">

                        🔔 حان موعد الاتصال بـ
                        <b>
                            ${escapeHTML(customer.name)}
                        </b>

                        الساعة
                        <b>
                            ${escapeHTML(customer.time)}
                        </b>

                    </div>

                    `
                ).join("")
            }

        </div>

    `;

}


/* =====================================================
   عرض العملاء
===================================================== */

function renderCustomers(){

    const container =
        document.getElementById("customers");


    const search =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const filter =
        document
        .getElementById("filter")
        .value;


    const today =
        getToday();


    /* الإحصائيات */

    document.getElementById("total")
        .textContent =
        customers.length;


    document.getElementById("calledCount")
        .textContent =
        customers.filter(
            customer =>
                customer.called &&
                customer.called[today]
        ).length;


    document.getElementById("notCalledCount")
        .textContent =
        customers.filter(
            customer =>
                !(
                    customer.called &&
                    customer.called[today]
                )
        ).length;


    document.getElementById("ordersCount")
        .textContent =
        customers.filter(
            customer =>
                customer.orderStatus === "yes"
        ).length;


    document.getElementById("noAnswerCount")
        .textContent =
        customers.filter(
            customer =>
                customer.noAnswer &&
                customer.noAnswer[today]
        ).length;


    /* الفلترة */

    const result =
        customers.filter(
            customer => {

                const text =
                    (
                        customer.name +
                        " " +
                        customer.phone +
                        " " +
                        (customer.address || "") +
                        " " +
                        (customer.notes || "")
                    )
                    .toLowerCase();


                if(
                    search &&
                    !text.includes(search)
                ){

                    return false;

                }


                const calls =
                    getCallsToday(customer);


                const called =
                    customer.called &&
                    customer.called[today];


                const noAnswer =
                    customer.noAnswer &&
                    customer.noAnswer[today];


                if(
                    filter === "notCalled" &&
                    called
                ){

                    return false;

                }


                if(
                    filter === "called" &&
                    !called
                ){

                    return false;

                }


                if(
                    filter === "noAnswer" &&
                    !noAnswer
                ){

                    return false;

                }


                if(
                    filter === "orders" &&
                    customer.orderStatus !== "yes"
                ){

                    return false;

                }


                if(
                    filter === "noOrders" &&
                    customer.orderStatus !== "no"
                ){

                    return false;

                }


                if(
                    ["A","B","C"].includes(filter) &&
                    customer.type !== filter
                ){

                    return false;

                }


                return true;

            }
        );


    if(result.length === 0){

        container.innerHTML = `

            <div class="card empty">

                👥

                <br><br>

                لا يوجد عملاء مطابقون للبحث

            </div>

        `;

        renderReminders();

        return;

    }


    container.innerHTML =
        result
        .slice()
        .reverse()
        .map(
            customer => {

                const calls =
                    getCallsToday(customer);


                const called =
                    customer.called &&
                    customer.called[today];


                const noAnswer =
                    customer.noAnswer &&
                    customer.noAnswer[today];


                const typeClass =
                    customer.type === "A"
                    ? "type-a"
                    :
                    customer.type === "B"
                    ? "type-b"
                    :
                    "type-c";


                return `

                <div class="customer">

                    <div class="customer-title">

                        <div class="customer-name">

                            👤

                            ${escapeHTML(
                                customer.name
                            )}

                        </div>

                        <div class="type ${typeClass}">

                            ${escapeHTML(
                                customer.type || "C"
                            )}

                        </div>

                    </div>


                    <div class="customer-body">


                        <div class="info">

                            <span>
                                📞 الهاتف:
                            </span>

                            <b>
                                ${escapeHTML(
                                    customer.phone
                                )}
                            </b>

                        </div>


                        <div class="info">

                            <span>
                                📍 العنوان:
                            </span>

                            <b>

                                ${
                                    customer.address
                                    ?
                                    escapeHTML(
                                        customer.address
                                    )
                                    :
                                    "غير محدد"
                                }

                            </b>

                        </div>


                        <div class="info">

                            <span>
                                📅 موعد الاتصال:
                            </span>

                            <b>

                                ${
                                    customer.date
                                    ?
                                    escapeHTML(
                                        customer.date
                                    )
                                    :
                                    "غير محدد"
                                }

                                ${
                                    customer.time
                                    ?
                                    " - " +
                                    escapeHTML(
                                        customer.time
                                    )
                                    :
                                    ""
                                }

                            </b>

                        </div>


                        <div class="notes">

                            ${
                                customer.notes
                                ?
                                escapeHTML(
                                    customer.notes
                                )
                                :
                                "لا توجد ملاحظات"
                            }

                        </div>


                        <div class="badges">


                            <span class="badge ${
                                called
                                ? "green"
                                : "orange"
                            }">

                                ${
                                    called
                                    ?
                                    "✅ تم الاتصال اليوم"
                                    :
                                    "⏳ لم يتم الاتصال"
                                }

                            </span>


                            <span class="badge cyan">

                                📞 عدد الرنات اليوم:
                                ${calls}

                            </span>


                            ${
                                noAnswer
                                ?
                                `
                                <span class="badge red">
                                    ❌ لم يرد
                                </span>
                                `
                                :
                                ""
                            }


                            ${getOrderBadge(
                                customer.orderStatus
                            )}


                        </div>


                        <div class="actions">


                            <button
                                class="action call"
                                onclick="callCustomer('${customer.id}')"
                            >
                                📞 اتصال + تسجيل رنة
                            </button>


                            <button
                                class="action whatsapp"
                                onclick="whatsapp('${customer.id}')"
                            >
                                💬 واتساب
                            </button>


                            <button
                                class="action called"
                                onclick="markCalled('${customer.id}')"
                            >
                                ✅ تم الاتصال
                            </button>


                            <button
                                class="action noanswer"
                                onclick="markNoAnswer('${customer.id}')"
                            >
                                ❌ لم يرد
                            </button>


                            <button
                                class="action order"
                                onclick="setOrder('${customer.id}','yes')"
                            >
                                📦 أخذ طلبية
                            </button>


                            <button
                                class="action noorder"
                                onclick="setOrder('${customer.id}','no')"
                            >
                                🚫 لم يأخذ طلبية
                            </button>


                            <button
                                class="action follow"
                                onclick="setOrder('${customer.id}','later1')"
                            >
                                ⏰ بعد ساعة
                            </button>


                            <button
                                class="action follow"
                                onclick="setOrder('${customer.id}','later2')"
                            >
                                ⏰ بعد ساعتين
                            </button>


                            <button
                                class="action edit"
                                onclick="editCustomer('${customer.id}')"
                            >
                                ✏️ تعديل
                            </button>


                            <button
                                class="action reset"
                                onclick="resetToday('${customer.id}')"
                            >
                                🔄 تصفير اليوم
                            </button>


                            <button
                                class="action delete"
                                onclick="deleteCustomer('${customer.id}')"
                            >
                                🗑️ حذف
                            </button>


                        </div>

                    </div>

                </div>

                `;

            }
        )
        .join("");


    renderReminders();

}
