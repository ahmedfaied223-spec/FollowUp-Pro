
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FollowUp Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#eef3f8;
padding:15px;
}

.header{
background:#2563eb;
color:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

.header h1{
font-size:28px;
}

.card{
background:white;
padding:15px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

input,textarea{

width:100%;

padding:12px;

margin-top:10px;

border:1px solid #ddd;

border-radius:10px;

font-size:17px;

}

button{

width:100%;

padding:14px;

margin-top:10px;

border:none;

border-radius:10px;

background:#2563eb;

color:white;

font-size:18px;

cursor:pointer;

}

.customer{

background:white;

padding:15px;

margin-top:15px;

border-radius:15px;

box-shadow:0 2px 10px rgba(0,0,0,.1);

border-right:6px solid #2563eb;

}

.customer h3{

margin-bottom:8px;

}

.call{

background:#16a34a;

}

</style>

</head>

<body>

<div class="header">

<h1>📞 FollowUp Pro</h1>

<p>برنامج متابعة العملاء</p>

</div>

<div class="card">

<input id="name" placeholder="اسم العميل">

<input id="phone" placeholder="رقم الموبايل">

<textarea id="note" placeholder="ملاحظات"></textarea>

<button onclick="addCustomer()">

➕ إضافة العميل

</button>

</div>

<div id="list"></div>

<script>

let customers=JSON.parse(localStorage.getItem("crm")||"[]");

function save(){

localStorage.setItem("crm",JSON.stringify(customers));

}

function draw(){

let html="";

customers.forEach((c,i)=>{

html+=`

<div class="customer">

<h3>${c.name}</h3>

<p>📞 ${c.phone}</p>

<p>${c.note}</p>

<button class="call"

onclick="location.href='tel:${c.phone}'">

اتصال

</button>

</div>

`;

});

document.getElementById("list").innerHTML=html;

}

function addCustomer(){

let name=document.getElementById("name").value;

let phone=document.getElementById("phone").value;

let note=document.getElementById("note").value;

if(name==""||phone==""){

alert("اكتب اسم العميل ورقمه");

return;

}

customers.push({

name,

phone,

note

});

save();

draw();

document.getElementById("name").value="";

document.getElementById("phone").value="";

document.getElementById("note").value="";

}

draw();

</script>

</body>

</html>
