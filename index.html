<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>أحمد فايد - متابعة العملاء</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#071018;
    color:#fff;
    padding:14px;
}

.container{
    max-width:780px;
    margin:auto;
}

.header{
    background:#1524c8;
    border-radius:30px;
    padding:28px 18px;
    text-align:center;
    margin-bottom:18px;
}

.header h1{
    margin:0 0 10px;
    font-size:34px;
}

.header p{
    margin:0;
    font-size:18px;
}

.box{
    background:#171b20;
    border-radius:25px;
    padding:18px;
    margin-bottom:18px;
}

input,
textarea,
select{

    width:100%;

    padding:15px;

    margin:7px 0;

textarea{

button{

    border:0;

}

.info{

.status{

}

.order-yes{
    background:#087f23;
}

.order-no{
    background:#a00018;
}

.follow{
    background:#895c00;
}

.buttons{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

}

.buttons button{
    width:100%;
}

.call{
    background:#07951d;
}

.whatsapp{
    background:#15a84c;
}

.done{
    background:#1769d1;
}

.no-answer{
    background:#b00020;
}

.order{
    background:#7b3aed;
}

.follow-up{
    background:#b36b00;
}

.edit{
    background:#087f8c;
}

.delete{

    background:#555;

    grid-column:1/-1;
}

.empty{

    text-align:center;

}

.modal{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.75);

    display:none;

    align-items:center;

}

.modal.show{

}

.modal-content{

    background:#171b20;

    overflow:auto;

}

.modal-content h2{

}

.modal-buttons{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

}

.save-edit{
    background:#159447;
}

.cancel-edit{
    background:#555;
}

.note{
    color:#9ca3af;
    font-size:14px;
    line-height:1.6;
}

@media(max-width:520px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .buttons{
        grid-template-columns:1fr;
    }

    .delete{
        grid-column:auto;
    }

    .import-buttons{
        grid-template-columns:1fr;
    }

    .modal-buttons{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- ================= HEADER ================= -->

<div class="header">

id="editAddress"

placeholder="عنوان العميل"
>

<select id="editType">

<option value="A">
A - عميل مهم
</option>

<script>


/* ==================================================
   التخزين
================================================== */

const STORAGE_KEY =
"ahmed_fayed_customers";


let customers =
JSON.parse(
localStorage.getItem(STORAGE_KEY)
) || [];


let editingId = null;



/* ==================================================
   حفظ
================================================== */

function saveCustomers(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(customers)
);

}



/* ==================================================
   اليوم
================================================== */

function today(){

return new Date()
.toISOString()
.slice(0,10);

}



/* ==================================================
   حماية HTML
================================================== */

function escapeHTML(text){

return String(text || "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}



/* ==================================================
   إضافة عميل
================================================== */

function addCustomer(){

const name =
document
.getElementById("name")
.value
.trim();


const phone =
document
.getElementById("phone")
.value
.trim();


const address =
document
.getElementById("address")
.value
.trim();


const type =
document
.getElementById("type")
.value;


const date =
document
.getElementById("date")
.value;


const time =
document
.getElementById("time")
.value;


const note =
document
.getElementById("note")
.value
.trim();


const orderStatus =
document
.getElementById("orderStatus")
.value;


if(!name){

alert("اكتب اسم العميل");

return;

}


if(!phone){

alert("اكتب رقم التلفون");

return;

}


const customer = {

id:Date.now(),

name:name,

phone:phone,

address:address,

type:type,

date:date,

time:time,

note:note,

orderStatus:orderStatus,

calls:{},

missedDate:null,

followUpDate:null,

followUpTime:null

};


customers.unshift(customer);


saveCustomers();


clearAddForm();


renderCustomers();

}



/* ==================================================
   تفريغ نموذج الإضافة
================================================== */

function clearAddForm(){

document
.getElementById("name")
.value="";

document
.getElementById("phone")
.value="";

document
.getElementById("address")
.value="";

document
.getElementById("date")
.value="";

document
.getElementById("time")
.value="";

document
.getElementById("note")
.value="";

document
.getElementById("orderStatus")
.value="none";

}



/* ==================================================
   عدد المكالمات اليوم
================================================== */

function callsToday(customer){

if(!customer.calls){

return 0;

}

return customer.calls[today()] || 0;

}



/* ==================================================
   تسجيل مكالمة
================================================== */

function registerCall(customer){

const date =
today();


if(!customer.calls){

customer.calls={};

}


customer.calls[date] =
(customer.calls[date] || 0) + 1;


customer.lastCall =
date;


customer.missedDate =
null;


saveCustomers();


renderCustomers();

}



/* ==================================================
   اتصال
================================================== */

function callCustomer(id){

const customer =
customers.find(
item => item.id === id
);


if(!customer){

return;

}


registerCall(customer);


window.location.href =
"tel:" + customer.phone;

}



/* ==================================================
   واتساب
================================================== */

function normalizePhone(phone){

let number =
String(phone)
.replace(/\D/g,"");


if(number.startsWith("01")){

number =
"20" +
number.substring(1);

}


return number;

}



function openWhatsApp(id){

const customer =
customers.find(
item => item.id === id
);


if(!customer){

return;

}


const number =
normalizePhone(
customer.phone
);


window.location.href =
"https://wa.me/" +
number;

}



/* ==================================================
   تم الاتصال
================================================== */

function markCalled(id){

const customer =
customers.find(
item => item.id === id
);


if(!customer){

return;

}


registerCall(customer);

}



/* ==================================================
   لم يرد
================================================== */

function markNoAnswer(id){

const customer =
customers.find(
item => item.id === id
);


if(!customer){

return;

}


customer.missedDate =
today();


const date =
today();


if(!customer.calls){

customer.calls={};

}


customer.calls[date] =
(customer.calls[date] || 0) + 1;


saveCustomers();


renderCustomers();

}



/* ==================================================
   حالة الطلبية
================================================== */

function markOrder(
id,
status
){

const customer =
customers.find(
item => item.id === id
);


if(!customer){

return;

}


customer.orderStatus =
status;


saveCustomers();


renderCustomers();

}



/* ==================================================
   متابعة بعد ساعة / ساعتين
================================================== */

function followAfter(
id,
hours
){

const customer =
customers.find(
item => item.id === id
);


if(!customer){

return;

}


const now =
new Date();


now.setHours(
now.getHours() + hours
);


customer.followUpDate =
now.toISOString()
.slice(0,10);


customer.followUpTime =
now.toTimeString()
.slice(0,5);


customer.orderStatus =
"later" + hours;


saveCustomers();


renderCustomers();

}



/* ==================================================
   حذف
================================================== */

function deleteCustomer(id){

if(
!confirm(
"هل تريد حذف العميل؟"
)
){

return;

}


customers =
customers.filter(
item => item.id !== id
);


saveCustomers();


renderCustomers();

}



/* ==================================================
   فتح التعديل
================================================== */

function editCustomer(id){

const customer =
customers.find(
item => item.id === id
);


if(!customer){

return;

}


editingId =
id;


document
.getElementById("editName")
.value =
customer.name || "";


document
.getElementById("editPhone")
.value =
customer.phone || "";


document
.getElementById("editAddress")
.value =
customer.address || "";


document
.getElementById("editType")
.value =
customer.type || "A";


document
.getElementById("editDate")
.value =
customer.date || "";


document
.getElementById("editTime")
.value =
customer.time || "";


document
.getElementById("editNote")
.value =
customer.note || "";


document
.getElementById("editOrderStatus")
.value =
customer.orderStatus || "none";


document
.getElementById("editModal")
.classList.add("show");

}



/* ==================================================
   حفظ التعديل
================================================== */

function saveEdit(){

if(!editingId){

return;

}


const customer =
customers.find(
item => item.id === editingId
);


if(!customer){

return;

}


const name =
document
.getElementById("editName")
.value
.trim();


const phone =
document
.getElementById("editPhone")
.value
.trim();


if(!name){

alert("اكتب اسم العميل");

return;

}


if(!phone){

alert("اكتب رقم التلفون");

return;

}


/*
   نغير المعلومات الأساسية فقط
   ونحافظ على المكالمات
*/

customer.name =
name;


customer.phone =
phone;


customer.address =
document
.getElementById("editAddress")
.value
.trim();


customer.type =
document
.getElementById("editType")
.value;


customer.date =
document
.getElementById("editDate")
.value;


customer.time =
document
.getElementById("editTime")
.value;


customer.note =
document
.getElementById("editNote")
.value
.trim();


customer.orderStatus =
document
.getElementById("editOrderStatus")
.value;


saveCustomers();


closeEdit();


renderCustomers();

}



/* ==================================================
   إغلاق التعديل
================================================== */

function closeEdit(){

editingId =
null;


document
.getElementById("editModal")
.classList.remove("show");

}



/* ==================================================
   استيراد جهات الاتصال
================================================== */

async function pickContacts(){

if(
!"contacts" in navigator
){

alert(
"المتصفح لا يدعم استيراد جهات الاتصال مباشرة. استخدم استيراد VCF."
);

return;

}


try{

const contacts =
await navigator.contacts.select(
["name","tel"],
{
multiple:true
}
);


if(
!contacts ||
contacts.length === 0
){

return;

}


let added = 0;


contacts.forEach(contact => {


const name =
Array.isArray(contact.name)
?
contact.name[0]
:
contact.name;


const phones =
contact.tel || [];


phones.forEach(phone => {


if(!phone){

return;

}


const exists =
customers.some(
customer =>
customer.phone === phone
);


if(exists){

return;

}


customers.unshift({

id:Date.now() +
Math.random(),

name:name ||
"بدون اسم",

phone:phone,

address:"",

type:"C",

date:"",

time:"",

note:"مضاف من جهات الاتصال",

orderStatus:"none",

calls:{},

missedDate:null,

followUpDate:null,

followUpTime:null

});


added++;

});

});


saveCustomers();


renderCustomers();


alert(
"تم استيراد " +
added +
" عميل من جهات الاتصال."
);


}

catch(error){

console.log(error);

alert(
"لم يتم استيراد جهات الاتصال."
);

}

}



/* ==================================================
   استيراد VCF
================================================== */

function importVCF(event){

const file =
event.target.files[0];


if(!file){

return;

}


const reader =
new FileReader();


reader.onload =
function(e){

const text =
e.target.result;


const cards =
text.split(
/BEGIN:VCARD/i
);


let added = 0;


cards.forEach(card => {


if(
!card.trim()
){

return;

}


const nameMatch =
card.match(
/FN(?:;[^:]*)?:(.*)/i
);


const phoneMatch =
card.match(
/TEL(?:;[^:]*)?:(.*)/i
);


const name =
nameMatch
?
nameMatch[1].trim()
:
"بدون اسم";


const phone =
phoneMatch
?
phoneMatch[1].trim()
:
"";


if(!phone){

return;

}


const exists =
customers.some(
customer =>
customer.phone === phone
);


if(exists){

return;

}


customers.unshift({

id:Date.now() +
Math.random(),

name:name,

phone:phone,

address:"",

type:"C",

date:"",

time:"",

note:"مضاف من ملف جهات الاتصال",

orderStatus:"none",

calls:{},

missedDate:null,

followUpDate:null,

followUpTime:null

});


added++;

});


saveCustomers();


renderCustomers();


alert(
"تم استيراد " +
added +
" عميل من ملف VCF."
);


};


reader.readAsText(file);


/*
   يسمح باختيار نفس الملف مرة أخرى
*/

event.target.value="";

}



/* ==================================================
   عرض العملاء
================================================== */

function renderCustomers(){


const search =
document
.getElementById("search")
.value
.trim()
.toLowerCase();


const filter =
document
.getElementById("filter")
.value;


const currentDate =
today();



const filtered =
customers.filter(
customer => {


const searchText =

(
customer.name +
" " +
customer.phone +
" " +
(customer.address || "") +
" " +
(customer.note || "")
)
.toLowerCase();


const matchesSearch =
searchText.includes(search);


const calls =
callsToday(customer);


if(!matchesSearch){

return false;

}


if(
filter === "notCalled"
){

return calls === 0;

}


if(
filter === "called"
){

return calls > 0;

}


if(
filter === "orders"
){

return customer.orderStatus
=== "yes";

}


if(
filter === "noOrders"
){

return customer.orderStatus
=== "no";

}


if(
filter === "later"
){

return (

customer.orderStatus
=== "later1"

||

customer.orderStatus
=== "later2"

);

}


if(
filter === "missed"
){

return customer.missedDate
=== currentDate;

}


return true;

}

);



/* ================= الإحصائيات ================= */

document
.getElementById("total")
.textContent =
customers.length;


document
.getElementById("calledCount")
.textContent =

customers.filter(
customer =>
callsToday(customer) > 0
).length;


document
.getElementById("notCalledCount")
.textContent =

customers.filter(
customer =>
callsToday(customer) === 0
).length;



const list =
document
.getElementById("customersList");



if(
filtered.length === 0
){

list.innerHTML = `

<div class="box empty">

👥 لا يوجد عملاء في البحث الحالي

</div>

`;

return;

}



/* ================= بطاقات العملاء ================= */

list.innerHTML =

filtered.map(
customer => {


const calls =
callsToday(customer);


const called =
calls > 0;


const missed =
customer.missedDate
=== currentDate;



let orderText =
"لم يتم تحديد حالة الطلبية";


let orderClass =
"status";


if(
customer.orderStatus
=== "yes"
){

orderText =
"📦 أخذ طلبية";

orderClass =
"status order-yes";

}


else if(
customer.orderStatus
=== "no"
){

orderText =
"❌ لم يأخذ طلبية";

orderClass =
"status order-no";

}


else if(
customer.orderStatus
=== "later1"
){

orderText =
"⏰ متابعة بعد ساعة";

orderClass =
"status follow";

}


else if(
customer.orderStatus
=== "later2"
){

orderText =
"⏰ متابعة بعد ساعتين";

orderClass =
"status follow";

}



return `

<div class="customer

${called ? "called" : ""}

${missed ? "missed" : ""}

">


<h2>

👤

${escapeHTML(
customer.name
)}

<span class="badge">

${escapeHTML(
customer.type || "C"
)}

</span>

</h2>



<div class="info">

📞 رقم التلفون:

<strong>

${escapeHTML(
customer.phone
)}

</strong>

</div>



<div class="info">

📍 عنوان العميل:

<strong>

${
escapeHTML(
customer.address ||
"غير محدد"
)
}

</strong>

</div>



<div class="info">

📅 ميعاد الاتصال:

${
customer.date
?
escapeHTML(
customer.date
)
:
"غير محدد"
}

${
customer.time
?
" ⏰ " +
escapeHTML(
customer.time
)
:
""
}

</div>



<div class="info">

📝 ملاحظات:

<br>

${
escapeHTML(
customer.note ||
"لا توجد ملاحظات"
)
}

</div>



<div class="info">

📊 عدد مرات الرن اليوم:

<strong>

${calls}

</strong>

</div>



<div class="info">

${
called
?
"✅ تم الاتصال بالعميل اليوم"
:
"⏳ لم يتم الاتصال بالعميل اليوم"
}

</div>



<div class="${orderClass}">

${orderText}

</div>



${
customer.followUpDate
?

`

<div class="info">

⏰ موعد المتابعة:

<strong>

${escapeHTML(
customer.followUpDate
)}

&nbsp;

${escapeHTML(
customer.followUpTime
)}

</strong>

</div>

`

:

""

}



<div class="buttons">



<button
class="call"
onclick="callCustomer(
${customer.id}
)"
>

📞 اتصال + تسجيل

</button>



<button
class="whatsapp"
onclick="openWhatsApp(
${customer.id}
)"
>

💬 واتساب

</button>



<button
class="done"
onclick="markCalled(
${customer.id}
)"
>

✅ تم الاتصال

</button>



<button
class="no-answer"
onclick="markNoAnswer(
${customer.id}
)"
>

❌ لم يرد

</button>



<button
class="order"
onclick="markOrder(
${customer.id},
'yes'
)"
>

📦 أخذ طلبية

</button>



<button
class="no-answer"
onclick="markOrder(
${customer.id},
'no'
)"
>

🚫 لم يأخذ طلبية

</button>



<button
class="follow-up"
onclick="followAfter(
${customer.id},
1
)"
>

⏰ بعد ساعة

</button>



<button
class="follow-up"
onclick="followAfter(
${customer.id},
2
)"
>

⏰ بعد ساعتين

</button>



<!-- زر التعديل -->

<button
class="edit"
onclick="editCustomer(
${customer.id}
)"
>

✏️ تعديل البيانات

</button>



<!-- الحذف -->

<button
class="delete"
onclick="deleteCustomer(
${customer.id}
)"
>

🗑️ حذف العميل

</button>



</div>


</div>

`;

}

).join("");

}



/* ==================================================
   تشغيل البرنامج
================================================== */

renderCustomers();

</script>


</body>

</html>
