<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>أحمد فايد - متابعة العملاء</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#071018;
    color:#fff;
    padding:14px;
}

.wrap{
    max-width:760px;
    margin:auto;
}

header,
.box,
.card{
    background:#171b20;
    border-radius:24px;
    padding:18px;
    margin-bottom:16px;
}

header{
    background:#1524c8;
    text-align:center;
}

header h1{
    margin:0 0 8px;
    font-size:32px;
}

header p{
    margin:0;
    font-size:19px;
}

input,
textarea,
select{
    width:100%;
    padding:15px;
    margin:7px 0;
    background:#222831;
    border:1px solid #3c4652;
    color:#fff;
    border-radius:15px;
    font-size:17px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.add{
    width:100%;
    background:#1455e8;
    border:0;
    border-radius:14px;
    padding:14px;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:16px;
}

.stat{
    text-align:center;
    background:#171b20;
    border-radius:18px;
    padding:14px;
}

.stat b{
    display:block;
    font-size:25px;
    margin-bottom:5px;
}

.card{
    border-right:6px solid #275bff;
}

.card.done{
    border-right-color:#16a34a;
}

.card.missed{
    border-right-color:#d00000;
}

.name{
    font-size:23px;
    font-weight:bold;
    margin-bottom:10px;
}

.row{
    margin:8px 0;
    color:#ddd;
}

.badge{
    background:#394150;
    padding:5px 10px;
    border-radius:20px;
    font-size:14px;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:14px;
}

.actions button{
    border:0;
    border-radius:14px;
    padding:14px;
    color:#fff;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.call{
    background:#0b941f;
}

.wa{
    background:#14a44b;
}

.donebtn{
    background:#1769d1;
}

.miss{
    background:#b00020;
}

.delete{
    background:#555;
    grid-column:1/-1;
}

.empty{
    text-align:center;
    color:#9aa;
    padding:30px;
}

@media(max-width:520px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .actions{
        grid-template-columns:1fr;
    }

    .delete{
        grid-column:auto;
    }

}

</style>
</head>


<body>

<div class="wrap">


<header>

<h1>📞 أحمد فايد</h1>

<p>
متابعة العملاء - تليسلز مخزن الفتح
</p>

</header>


<!-- إضافة عميل -->

<section class="box">

<input
    id="name"
    placeholder="اسم العميل"
>


<input
    id="phone"
    type="tel"
    placeholder="رقم التلفون"
>


<!-- تصنيف العميل -->

<select id="abc">

<option value="ABC">
ABC
</option>

<option value="A">
A
</option>

<option value="B">
B
</option>

<option value="C">
C
</option>

</select>


<!-- تاريخ الاتصال -->

<input
    id="date"
    type="date"
>


<!-- وقت الاتصال -->

<input
    id="time"
    type="time"
>


<!-- ملاحظات -->

<textarea
    id="note"
    placeholder="ملاحظات العميل"
></textarea>


<button
    class="add"
    onclick="addCustomer()"
>

➕ إضافة العميل

</button>

</section>



<!-- البحث والفلاتر -->

<section class="box">

<input
    id="search"
    placeholder="🔎 ابحث بالاسم أو الرقم أو الملاحظات..."
    oninput="render()"
>


<select
    id="filter"
    onchange="render()"
>

<option value="all">
كل العملاء
</option>

<option value="today">
مواعيد اليوم
</option>

<option value="notcalled">
لم أتصل به اليوم
</option>

<option value="called">
اتصلت به اليوم
</option>

<option value="missed">
لم يرد
</option>

</select>

</section>



<!-- الإحصائيات -->

<div class="stats">


<div class="stat">

<b id="total">
0
</b>

كل العملاء

</div>


<div class="stat">

<b id="called">
0
</b>

اتصلت بهم اليوم

</div>


<div class="stat">

<b id="pending">
0
</b>

لم أتصل بهم

</div>


</div>



<!-- العملاء -->

<section id="list"></section>


</div>



<script>


/* =========================================
   حفظ بيانات العملاء
========================================= */

const KEY =
"ahmed_fayed_followup_v2";


let customers =
JSON.parse(
    localStorage.getItem(KEY) || "[]"
);



/* =========================================
   حفظ البيانات
========================================= */

function save(){

    localStorage.setItem(
        KEY,
        JSON.stringify(customers)
    );

}



/* =========================================
   تاريخ اليوم
========================================= */

function today(){

    return new Date()
        .toISOString()
        .slice(0,10);

}



/* =========================================
   حماية النصوص
========================================= */

function esc(text){

    return String(text ?? "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}



/* =========================================
   إضافة عميل
========================================= */

function addCustomer(){

    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const phone =
        document
        .getElementById("phone")
        .value
        .trim();


    if(!name){

        alert(
            "اكتب اسم العميل"
        );

        return;

    }


    if(!phone){

        alert(
            "اكتب رقم التلفون"
        );

        return;

    }


    const customer = {

        id:Date.now(),

        name:name,

        phone:phone,

        abc:
        document
        .getElementById("abc")
        .value,

        date:
        document
        .getElementById("date")
        .value,

        time:
        document
        .getElementById("time")
        .value,

        note:
        document
        .getElementById("note")
        .value
        .trim(),

        calls:{}

    };


    customers.unshift(
        customer
    );


    save();


    document
    .getElementById("name")
    .value="";


    document
    .getElementById("phone")
    .value="";


    document
    .getElementById("date")
    .value="";


    document
    .getElementById("time")
    .value="";


    document
    .getElementById("note")
    .value="";


    render();

}



/* =========================================
   تحويل رقم الهاتف
========================================= */

function normalize(phone){

    let number =
        String(phone)
        .replace(/\D/g,"");


    /*
       رقم مصري:

       010xxxxxxxx

       يصبح:

       2010xxxxxxxx
    */

    if(
        number.startsWith("01")
    ){

        number =
            "20" +
            number.slice(1);

    }


    return number;

}



/* =========================================
   عدد المكالمات اليوم
========================================= */

function callsToday(customer){

    if(
        !customer.calls
    ){

        return 0;

    }


    return (
        customer.calls[today()]
        || 0
    );

}



/* =========================================
   الاتصال بالعميل
========================================= */

function callClient(id){

    const customer =
        customers.find(
            x => x.id === id
        );


    if(!customer){

        return;

    }


    const date =
        today();


    if(!customer.calls){

        customer.calls={};

    }


    customer.calls[date] =
        (
            customer.calls[date]
            || 0
        ) + 1;


    save();


    render();


    /*
       فتح تطبيق الاتصال
    */

    window.location.href =
        "tel:" +
        customer.phone;

}



/* =========================================
   واتساب
========================================= */

function whatsapp(id){

    const customer =
        customers.find(
            x => x.id === id
        );


    if(!customer){

        return;

    }


    const number =
        normalize(
            customer.phone
        );


    window.location.href =
        "https://wa.me/" +
        number;

}



/* =========================================
   تسجيل تم الاتصال
========================================= */

function markCalled(id){

    const customer =
        customers.find(
            x => x.id === id
        );


    if(!customer){

        return;

    }


    const date =
        today();


    if(!customer.calls){

        customer.calls={};

    }


    customer.calls[date] =
        (
            customer.calls[date]
            || 0
        ) + 1;


    save();


    render();

}



/* =========================================
   تسجيل لم يرد
========================================= */

function markMissed(id){

    const customer =
        customers.find(
            x => x.id === id
        );


    if(!customer){

        return;

    }


    customer.missedDate =
        today();


    save();


    render();

}



/* =========================================
   حذف العميل
========================================= */

function deleteCustomer(id){

    if(
        !confirm(
            "هل تريد حذف العميل؟"
        )
    ){

        return;

    }


    customers =
        customers.filter(
            x => x.id !== id
        );


    save();


    render();

}



/* =========================================
   عرض العملاء
========================================= */

function render(){

    const search =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const filter =
        document
        .getElementById("filter")
        .value;


    const date =
        today();


    const filtered =
        customers.filter(
            customer => {

                const text =
                    (
                        customer.name +
                        " " +
                        customer.phone +
                        " " +
                        (
                            customer.note
                            || ""
                        )
                    )
                    .toLowerCase();


                const matchesSearch =
                    text.includes(search);


                const calls =
                    callsToday(
                        customer
                    );


                if(
                    filter === "today"
                ){

                    return (
                        matchesSearch &&
                        customer.date === date
                    );

                }


                if(
                    filter === "notcalled"
                ){

                    return (
                        matchesSearch &&
                        calls === 0
                    );

                }


                if(
                    filter === "called"
                ){

                    return (
                        matchesSearch &&
                        calls > 0
                    );

                }


                if(
                    filter === "missed"
                ){

                    return (
                        matchesSearch &&
                        customer.missedDate === date
                    );

                }


                return matchesSearch;

            }
        );



    /* الإحصائيات */

    document
    .getElementById("total")
    .textContent =
        customers.length;


    document
    .getElementById("called")
    .textContent =
        customers.filter(
            c =>
            callsToday(c) > 0
        ).length;


    document
    .getElementById("pending")
    .textContent =
        customers.filter(
            c =>
            callsToday(c) === 0
        ).length;



    const list =
        document
        .getElementById("list");



    if(
        filtered.length === 0
    ){

        list.innerHTML = `

        <div class="box empty">

            👥 لا توجد نتائج

        </div>

        `;

        return;

    }



    list.innerHTML =

        filtered
        .map(
            customer => {

                const calls =
                    callsToday(
                        customer
                    );


                const done =
                    calls > 0;


                const missed =
                    customer.missedDate
                    === date;


                return `

<article class="card
    ${done ? "done" : ""}
    ${missed ? "missed" : ""}
">


<div class="name">

    ${esc(customer.name)}

    <span class="badge">

        ${esc(
            customer.abc ||
            "ABC"
        )}

    </span>

</div>



<div class="row">

    📞 ${esc(customer.phone)}

</div>



<div class="row">

    📅

    ${
        customer.date
        ?
        esc(customer.date)
        :
        "بدون موعد"
    }

    ${
        customer.time
        ?
        " ⏰ " +
        esc(customer.time)
        :
        ""
    }

</div>



<div class="row">

    📝

    ${
        esc(
            customer.note ||
            "لا توجد ملاحظات"
        )
    }

</div>



<div class="row">

    <b>

        📊 مرات الاتصال اليوم:

        ${calls}

    </b>

</div>



<div class="row">

    ${
        done
        ?
        "✅ تم الاتصال اليوم"
        :
        "⏳ لم يتم الاتصال اليوم"
    }

    ${
        missed
        ?
        " | ❌ لم يرد"
        :
        ""
    }

</div>



<div class="actions">


<button
    class="call"
    onclick="callClient(
        ${customer.id}
    )"
>

📞 اتصال + تسجيل

</button>



<button
    class="wa"
    onclick="whatsapp(
        ${customer.id}
    )"
>

💬 واتساب

</button>



<button
    class="donebtn"
    onclick="markCalled(
        ${customer.id}
    )"
>

✅ تم الاتصال

</button>



<button
    class="miss"
    onclick="markMissed(
        ${customer.id}
    )"
>

❌ لم يرد

</button>



<button
    class="delete"
    onclick="deleteCustomer(
        ${customer.id}
    )"
>

🗑️ حذف

</button>


</div>


</article>

`;

            }
        )
        .join("");

}



/* =========================================
   تشغيل البرنامج
========================================= */

render();

</script>

</body>

</html>
