<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة تخمين كلمة السر</title>
</head>
<body dir="rtl">

    <h2>تجربة Brute Force تعليمية</h2>

    <input id="target" value="abc7" placeholder="كلمة السر التجريبية">
    <button onclick="start()">ابدأ التجربة</button>

    <p id="status">اضغط ابدأ</p>

    <script>
        function start() {
            const target = document.getElementById("target").value;
            const chars = "abcdefghijklmnopqrstuvwxyz0123456789";

            let attempts = 0;
            let found = false;
            const startTime = performance.now();

            document.getElementById("status").textContent =
                "جاري التجربة...";

            for (let length = 1; length <= target.length && !found; length++) {
                const total = Math.pow(chars.length, length);

                for (let number = 0; number < total; number++) {
                    let n = number;
                    let guess = "";

                    for (let i = 0; i < length; i++) {
                        guess = chars[n % chars.length] + guess;
                        n = Math.floor(n / chars.length);
                    }

                    attempts++;

                    if (guess === target) {
                        const time =
                            ((performance.now() - startTime) / 1000).toFixed(4);

                        document.getElementById("status").innerHTML =
                            "تم العثور عليها: <b>" + guess +
                            "</b><br>عدد المحاولات: " + attempts +
                            "<br>الوقت: " + time + " ثانية";

                        found = true;
                        break;
                    }
                }
            }

            if (!found) {
                document.getElementById("status").textContent =
                    "لم يتم العثور على كلمة السر.";
            }
        }
    </script>

</body>
</html>
