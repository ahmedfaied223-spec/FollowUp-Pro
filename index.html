<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>أحمد فايد - متابعة العملاء</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#071018;
    color:#fff;
    padding:14px;
}

.container{
    max-width:760px;
    margin:auto;
}

/* ================= HEADER ================= */

.header{
    background:#1524c8;
    border-radius:30px;
    padding:28px 18px;
    text-align:center;
    margin-bottom:18px;
}

.header h1{
    margin:0 0 10px;
    font-size:34px;
}

.header p{
    margin:0;
    font-size:19px;
}

/* ================= BOX ================= */

.box{
    background:#171b20;
    border-radius:25px;
    padding:18px;
    margin-bottom:18px;
}

/* ================= INPUTS ================= */

input,
textarea,
select{

    width:100%;

    padding:16px;

    margin:7px 0;

    background:#222831;

    border:1px solid #3d4652;

    color:white;

    border-radius:16px;

    font-size:17px;

    outline:none;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input::placeholder,
textarea::placeholder{
    color:#9ca3af;
}

/* ================= BUTTON ================= */

button{

    border:0;

    cursor:pointer;

    color:white;

    font-weight:bold;

    border-radius:15px;

    padding:15px;

    font-size:17px;
}

.add-btn{

    width:100%;

    background:#1455e8;

    margin-top:8px;
}

/* ================= SEARCH ================= */

.search{
    margin-bottom:10px;
}

/* ================= STATS ================= */

.stats{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:8px;

    margin-bottom:18px;
}

.stat{

    background:#171b20;

    border-radius:18px;

    padding:14px;

    text-align:center;
}

.stat b{

    display:block;

    font-size:25px;

    margin-bottom:5px;
}

/* ================= CUSTOMER ================= */

.customer{

    background:#171b20;

    border-right:6px solid #285dff;

    border-radius:25px;

    padding:20px;

    margin-bottom:18px;
}

.customer.called{
    border-right-color:#16a34a;
}

.customer.missed{
    border-right-color:#d00000;
}

.customer h2{

    margin:0 0 12px;

    font-size:24px;
}

/* ================= INFO ================= */

.info{

    color:#ddd;

    margin:9px 0;

    line-height:1.7;
}

.info strong{
    color:#fff;
}

/* ================= ABC ================= */

.badge{

    display:inline-block;

    background:#354052;

    padding:5px 12px;

    border-radius:20px;

    font-size:14px;

    margin-right:5px;
}

/* ================= ORDER STATUS ================= */

.status{

    display:inline-block;

    padding:8px 13px;

    border-radius:20px;

    margin-top:8px;

    font-size:14px;

    background:#333;
}

.order-yes{
    background:#087f23;
}

.order-no{
    background:#a00018;
}

.follow{
    background:#895c00;
}

/* ================= BUTTONS ================= */

.buttons{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-top:15px;
}

.buttons button{
    width:100%;
}

.call{
    background:#07951d;
}

.whatsapp{
    background:#15a84c;
}

.done{
    background:#1769d1;
}

.no-answer{
    background:#b00020;
}

.order{
    background:#7b3aed;
}

.follow-up{
    background:#b36b00;
}

.delete{

    background:#555;

    grid-column:1/-1;
}

/* ================= EMPTY ================= */

.empty{

    text-align:center;

    padding:35px;

    color:#8f99a4;

    font-size:20px;
}

/* ================= MOBILE ================= */

@media(max-width:520px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .buttons{
        grid-template-columns:1fr;
    }

    .delete{
        grid-column:auto;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- ==================================================
     HEADER
================================================== -->

<div class="header">

<h1>
📞 أحمد فايد
</h1>

<p>
متابعة العملاء - تليسلز مخزن الفتح
</p>

</div>



<!-- ==================================================
     إضافة عميل
================================================== -->

<div class="box">


<input
id="name"
type="text"
placeholder="👤 اسم العميل"
>


<input
id="phone"
type="tel"
placeholder="📞 رقم التلفون"
>


<input
id="address"
type="text"
placeholder="📍 عنوان العميل"
>


<!-- ================= ABC ================= -->

<select id="type">

<option value="A">
A - عميل مهم
</option>

<option value="B">
B - عميل متوسط
</option>

<option value="C">
C - عميل عادي
</option>

</select>



<!-- ================= ميعاد الاتصال ================= -->

<input
id="date"
type="date"
>


<input
id="time"
type="time"
>



<!-- ================= ملاحظات ================= -->

<textarea
id="note"
placeholder="📝 ملاحظات العميل"
></textarea>



<!-- ================= حالة الطلبية ================= -->

<select id="orderStatus">

<option value="none">
لم يتم تحديد حالة الطلبية
</option>

<option value="yes">
أخذ طلبية ✅
</option>

<option value="no">
لم يأخذ طلبية ❌
</option>

<option value="later1">
قالي كلمني بعد ساعة ⏰
</option>

<option value="later2">
قالي كلمني بعد ساعتين ⏰
</option>

</select>



<button
class="add-btn"
onclick="addCustomer()"
>

➕ إضافة العميل

</button>


</div>



<!-- ==================================================
     البحث
================================================== -->

<div class="box">


<input
id="search"
class="search"
type="search"
placeholder="🔎 ابحث عن العميل بالاسم أو الرقم أو العنوان..."
oninput="renderCustomers()"
>



<select
id="filter"
onchange="renderCustomers()"
>

<option value="all">
كل العملاء
</option>

<option value="notCalled">
العملاء اللي لسه ما اتصلتش بيهم
</option>

<option value="called">
العملاء اللي اتصلت بيهم
</option>

<option value="orders">
العملاء اللي أخذوا طلبيات
</option>

<option value="noOrders">
العملاء اللي ما أخذوش طلبيات
</option>

<option value="later">
متابعة بعدين
</option>

<option value="missed">
العملاء اللي ما ردوش
</option>

</select>


</div>



<!-- ==================================================
     الإحصائيات
================================================== -->

<div class="stats">


<div class="stat">

<b id="total">
0
</b>

كل العملاء

</div>



<div class="stat">

<b id="calledCount">
0
</b>

اتصلت بهم اليوم

</div>



<div class="stat">

<b id="notCalledCount">
0
</b>

لم أتصل بهم

</div>


</div>



<!-- ==================================================
     العملاء
================================================== -->

<div id="customersList"></div>


</div>



<script>


/* ==================================================
   التخزين
================================================== */

const STORAGE_KEY =
"ahmed_fayed_customers";


let customers =
JSON.parse(
localStorage.getItem(STORAGE_KEY)
) || [];



/* ==================================================
   حفظ العملاء
================================================== */

function saveCustomers(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(customers)
    );

}



/* ==================================================
   تاريخ اليوم
================================================== */

function today(){

    return new Date()
    .toISOString()
    .slice(0,10);

}



/* ==================================================
   حماية النصوص
================================================== */

function escapeHTML(text){

    return String(text || "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}



/* ==================================================
   إضافة عميل
================================================== */

function addCustomer(){


    const name =
    document
    .getElementById("name")
    .value
    .trim();



    const phone =
    document
    .getElementById("phone")
    .value
    .trim();



    const address =
    document
    .getElementById("address")
    .value
    .trim();



    const type =
    document
    .getElementById("type")
    .value;



    const date =
    document
    .getElementById("date")
    .value;



    const time =
    document
    .getElementById("time")
    .value;



    const note =
    document
    .getElementById("note")
    .value
    .trim();



    const orderStatus =
    document
    .getElementById("orderStatus")
    .value;



    if(!name){

        alert("اكتب اسم العميل");

        return;

    }



    if(!phone){

        alert("اكتب رقم التلفون");

        return;

    }



    const customer = {

        id:Date.now(),

        name:name,

        phone:phone,

        address:address,

        type:type,

        date:date,

        time:time,

        note:note,

        orderStatus:orderStatus,

        calls:{},

        missedDate:null,

        followUpDate:null,

        followUpTime:null

    };



    customers.unshift(
        customer
    );



    saveCustomers();



    /* تفريغ الخانات */

    document
    .getElementById("name")
    .value="";



    document
    .getElementById("phone")
    .value="";



    document
    .getElementById("address")
    .value="";



    document
    .getElementById("date")
    .value="";



    document
    .getElementById("time")
    .value="";



    document
    .getElementById("note")
    .value="";



    document
    .getElementById("orderStatus")
    .value="none";



    renderCustomers();

}



/* ==================================================
   عدد مرات الاتصال اليوم
================================================== */

function callsToday(customer){

    if(!customer.calls){

        return 0;

    }


    return customer.calls[today()] || 0;

}



/* ==================================================
   تسجيل مكالمة
================================================== */

function registerCall(customer){

    const date =
    today();



    if(!customer.calls){

        customer.calls={};

    }



    customer.calls[date] =
    (customer.calls[date] || 0) + 1;



    customer.lastCall =
    date;



    customer.missedDate =
    null;



    saveCustomers();



    renderCustomers();

}



/* ==================================================
   اتصال
================================================== */

function callCustomer(id){

    const customer =
    customers.find(
        item => item.id === id
    );



    if(!customer){

        return;

    }



    /*
       تسجيل المكالمة
    */

    registerCall(customer);



    /*
       فتح الاتصال
    */

    window.location.href =
    "tel:" + customer.phone;

}



/* ==================================================
   تحويل رقم الهاتف لواتساب
================================================== */

function normalizePhone(phone){

    let number =
    String(phone)
    .replace(/\D/g,"");



    /*
       الرقم المصري:

       010xxxxxxxx

       يتحول:

       2010xxxxxxxx
    */

    if(
        number.startsWith("01")
    ){

        number =
        "20" +
        number.substring(1);

    }



    return number;

}



/* ==================================================
   واتساب
================================================== */

function openWhatsApp(id){

    const customer =
    customers.find(
        item => item.id === id
    );



    if(!customer){

        return;

    }



    const number =
    normalizePhone(
        customer.phone
    );



    window.location.href =
    "https://wa.me/" +
    number;

}



/* ==================================================
   تم الاتصال
================================================== */

function markCalled(id){

    const customer =
    customers.find(
        item => item.id === id
    );



    if(!customer){

        return;

    }



    registerCall(customer);

}



/* ==================================================
   لم يرد
================================================== */

function markNoAnswer(id){

    const customer =
    customers.find(
        item => item.id === id
    );



    if(!customer){

        return;

    }



    customer.missedDate =
    today();



    const date =
    today();



    if(!customer.calls){

        customer.calls={};

    }



    customer.calls[date] =
    (customer.calls[date] || 0) + 1;



    saveCustomers();



    renderCustomers();

}



/* ==================================================
   حالة الطلبية
================================================== */

function markOrder(
    id,
    status
){

    const customer =
    customers.find(
        item => item.id === id
    );



    if(!customer){

        return;

    }



    customer.orderStatus =
    status;



    saveCustomers();



    renderCustomers();

}



/* ==================================================
   متابعة بعد ساعة أو ساعتين
================================================== */

function followAfter(
    id,
    hours
){

    const customer =
    customers.find(
        item => item.id === id
    );



    if(!customer){

        return;

    }



    const now =
    new Date();



    now.setHours(
        now.getHours() + hours
    );



    customer.followUpDate =
    now.toISOString()
    .slice(0,10);



    customer.followUpTime =
    now.toTimeString()
    .slice(0,5);



    customer.orderStatus =
    "later" + hours;



    saveCustomers();



    renderCustomers();

}



/* ==================================================
   حذف العميل
================================================== */

function deleteCustomer(id){

    if(
        !confirm(
            "هل تريد حذف العميل؟"
        )
    ){

        return;

    }



    customers =
    customers.filter(
        item => item.id !== id
    );



    saveCustomers();



    renderCustomers();

}



/* ==================================================
   عرض العملاء
================================================== */

function renderCustomers(){


    const search =
    document
    .getElementById("search")
    .value
    .trim()
    .toLowerCase();



    const filter =
    document
    .getElementById("filter")
    .value;



    const currentDate =
    today();



    const filtered =
    customers.filter(
        customer => {


            /*
               البحث بالاسم
               والرقم
               والعنوان
               والملاحظات
            */

            const searchText =

            (
                customer.name +
                " " +
                customer.phone +
                " " +
                (customer.address || "") +
                " " +
                (customer.note || "")
            )
            .toLowerCase();



            const matchesSearch =
            searchText.includes(
                search
            );



            const calls =
            callsToday(customer);



            if(!matchesSearch){

                return false;

            }



            if(
                filter === "notCalled"
            ){

                return calls === 0;

            }



            if(
                filter === "called"
            ){

                return calls > 0;

            }



            if(
                filter === "orders"
            ){

                return (
                    customer.orderStatus
                    === "yes"
                );

            }



            if(
                filter === "noOrders"
            ){

                return (
                    customer.orderStatus
                    === "no"
                );

            }



            if(
                filter === "later"
            ){

                return (

                    customer.orderStatus
                    === "later1"

                    ||

                    customer.orderStatus
                    === "later2"

                );

            }



            if(
                filter === "missed"
            ){

                return (
                    customer.missedDate
                    === currentDate
                );

            }



            return true;

        }
    );



    /* ==================================================
       الإحصائيات
    ================================================== */

    document
    .getElementById("total")
    .textContent =
    customers.length;



    document
    .getElementById("calledCount")
    .textContent =

    customers.filter(
        customer =>
        callsToday(customer) > 0
    ).length;



    document
    .getElementById("notCalledCount")
    .textContent =

    customers.filter(
        customer =>
        callsToday(customer) === 0
    ).length;



    const list =
    document
    .getElementById("customersList");



    if(
        filtered.length === 0
    ){

        list.innerHTML = `

        <div class="box empty">

        👥 لا يوجد عملاء في البحث الحالي

        </div>

        `;

        return;

    }



    /* ==================================================
       بطاقات العملاء
    ================================================== */

    list.innerHTML =

    filtered.map(
        customer => {


            const calls =
            callsToday(customer);



            const called =
            calls > 0;



            const missed =
            customer.missedDate
            === currentDate;



            let orderText =
            "لم يتم تحديد حالة الطلبية";



            let orderClass =
            "status";



            if(
                customer.orderStatus
                === "yes"
            ){

                orderText =
                "📦 أخذ طلبية";

                orderClass =
                "status order-yes";

            }



            else if(
                customer.orderStatus
                === "no"
            ){

                orderText =
                "❌ لم يأخذ طلبية";

                orderClass =
                "status order-no";

            }



            else if(
                customer.orderStatus
                === "later1"
            ){

                orderText =
                "⏰ متابعة بعد ساعة";

                orderClass =
                "status follow";

            }



            else if(
                customer.orderStatus
                === "later2"
            ){

                orderText =
                "⏰ متابعة بعد ساعتين";

                orderClass =
                "status follow";

            }



            return `

            <div class="customer

            ${called ? "called" : ""}

            ${missed ? "missed" : ""}

            ">



            <!-- اسم العميل و ABC -->

            <h2>

            👤

            ${escapeHTML(
                customer.name
            )}

            <span class="badge">

            ${escapeHTML(
                customer.type
            )}

            </span>

            </h2>



            <!-- التلفون -->

            <div class="info">

            📞 رقم التلفون:

            <strong>

            ${escapeHTML(
                customer.phone
            )}

            </strong>

            </div>



            <!-- العنوان -->

            <div class="info">

            📍 عنوان العميل:

            <strong>

            ${
                escapeHTML(
                    customer.address ||
                    "غير محدد"
                )
            }

            </strong>

            </div>



            <!-- ميعاد الاتصال -->

            <div class="info">

            📅 ميعاد الاتصال:

            ${
                customer.date
                ?
                escapeHTML(
                    customer.date
                )
                :
                "غير محدد"
            }



            ${
                customer.time
                ?
                " ⏰ " +
                escapeHTML(
                    customer.time
                )
                :
                ""
            }

            </div>



            <!-- الملاحظات -->

            <div class="info">

            📝 ملاحظات:

            <br>

            ${
                escapeHTML(
                    customer.note ||
                    "لا توجد ملاحظات"
                )
            }

            </div>



            <!-- عدد المكالمات -->

            <div class="info">

            📊 عدد مرات الرن اليوم:

            <strong>

            ${calls}

            </strong>

            </div>



            <!-- حالة الاتصال -->

            <div class="info">

            ${
                called
                ?
                "✅ تم الاتصال بالعميل اليوم"
                :
                "⏳ لم يتم الاتصال بالعميل اليوم"
            }

            </div>



            <!-- حالة الطلبية -->

            <div class="${orderClass}">

            ${orderText}

            </div>



            ${
                customer.followUpDate
                ?

                `

                <div class="info">

                ⏰ موعد المتابعة:

                <strong>

                ${escapeHTML(
                    customer.followUpDate
                )}

                &nbsp;

                ${escapeHTML(
                    customer.followUpTime
                )}

                </strong>

                </div>

                `

                :

                ""

            }



            <!-- ================= أزرار ================= -->

            <div class="buttons">



            <!-- اتصال -->

            <button
            class="call"
            onclick="callCustomer(
                ${customer.id}
            )"
            >

            📞 اتصال + تسجيل

            </button>



            <!-- واتساب -->

            <button
            class="whatsapp"
            onclick="openWhatsApp(
                ${customer.id}
            )"
            >

            💬 واتساب

            </button>



            <!-- تم الاتصال -->

            <button
            class="done"
            onclick="markCalled(
                ${customer.id}
            )"
            >

            ✅ تم الاتصال

            </button>



            <!-- لم يرد -->

            <button
            class="no-answer"
            onclick="markNoAnswer(
                ${customer.id}
            )"
            >

            ❌ لم يرد

            </button>



            <!-- أخذ طلبية -->

            <button
            class="order"
            onclick="markOrder(
                ${customer.id},
                'yes'
            )"
            >

            📦 أخذ طلبية

            </button>



            <!-- لم يأخذ طلبية -->

            <button
            class="no-answer"
            onclick="markOrder(
                ${customer.id},
                'no'
            )"
            >

            🚫 لم يأخذ طلبية

            </button>



            <!-- بعد ساعة -->

            <button
            class="follow-up"
            onclick="followAfter(
                ${customer.id},
                1
            )"
            >

            ⏰ بعد ساعة

            </button>



            <!-- بعد ساعتين -->

            <button
            class="follow-up"
            onclick="followAfter(
                ${customer.id},
                2
            )"
            >

            ⏰ بعد ساعتين

            </button>



            <!-- حذف -->

            <button
            class="delete"
            onclick="deleteCustomer(
                ${customer.id}
            )"
            >

            🗑️ حذف العميل

            </button>



            </div>


            </div>

            `;

        }
    )
    .join("");

}



/* ==================================================
   تشغيل البرنامج
================================================== */

renderCustomers();

</script>


</body>

</html>
