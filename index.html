<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>FollowUp Pro</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#080d12;
    color:white;
    min-height:100vh;
    padding-bottom:30px;
}

/* Header */

.header{
    width:94%;
    margin:20px auto;
    padding:30px 20px;
    background:#0715b8;
    border-radius:30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.header h1{
    font-size:42px;
    margin-bottom:10px;
}

.header p{
    font-size:24px;
}

/* Form */

.form-box{
    width:94%;
    max-width:700px;
    margin:25px auto;
    padding:28px 20px;
    background:#171717;
    border-radius:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

input,
textarea{
    width:100%;
    background:#202020;
    border:1px solid #444;
    color:white;
    padding:18px;
    border-radius:20px;
    margin-bottom:15px;
    font-size:20px;
    outline:none;
}

input:focus,
textarea:focus{
    border-color:#0b45ff;
}

textarea{
    height:130px;
    resize:none;
}

.add-btn{
    width:100%;
    padding:20px;
    border:none;
    border-radius:20px;
    background:#063fe0;
    color:white;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}

.add-btn:active{
    transform:scale(.98);
}

/* Search */

.search-box{
    width:94%;
    max-width:700px;
    margin:20px auto;
}

.search-box input{
    background:#151515;
}

/* Customers */

#customers{
    width:94%;
    max-width:700px;
    margin:auto;
}

.empty{
    background:#111;
    padding:35px 20px;
    border-radius:25px;
    text-align:center;
    font-size:22px;
    color:#aaa;
}

/* Card */

.customer{
    background:#1a1a1a;
    border-radius:25px;
    margin-bottom:20px;
    padding:22px;
    border-right:7px solid #0646ff;
    box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.customer h2{
    font-size:27px;
    margin-bottom:12px;
}

.phone{
    font-size:21px;
    color:#ddd;
    margin-bottom:10px;
}

.note{
    font-size:19px;
    color:#bbb;
    margin-bottom:20px;
    white-space:pre-wrap;
}

/* Buttons */

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.buttons button{
    flex:1;
    min-width:130px;
    padding:15px 10px;
    border:none;
    border-radius:15px;
    color:white;
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
}

.call{
    background:#008f18;
}

.whatsapp{
    background:#16a34a;
}

.delete{
    background:#b00020;
}

.buttons button:active{
    transform:scale(.97);
}

/* Counter */

.counter{
    width:94%;
    max-width:700px;
    margin:20px auto;
    text-align:center;
    background:#111;
    padding:18px;
    border-radius:20px;
    color:#ddd;
    font-size:21px;
}

/* Responsive */

@media(max-width:500px){

    .header h1{
        font-size:34px;
    }

    .header p{
        font-size:20px;
    }

    .customer h2{
        font-size:24px;
    }

    .buttons button{
        min-width:100%;
    }

}

</style>
</head>


<body>

<!-- Header -->

<div class="header">

    <h1>📞 FollowUp Pro</h1>

    <p>برنامج متابعة العملاء</p>

</div>


<!-- Add Customer -->

<div class="form-box">

    <input
        id="name"
        type="text"
        placeholder="اسم العميل"
    >

    <input
        id="phone"
        type="tel"
        placeholder="رقم الموبايل"
    >

    <textarea
        id="note"
        placeholder="ملاحظات"
    ></textarea>

    <button
        class="add-btn"
        onclick="addCustomer()"
    >
        ➕ إضافة العميل
    </button>

</div>


<!-- Search -->

<div class="search-box">

    <input
        id="search"
        type="text"
        placeholder="🔎 ابحث عن عميل..."
        oninput="showCustomers()"
    >

</div>


<!-- Counter -->

<div
    class="counter"
    id="counter"
>
    عدد العملاء: 0
</div>


<!-- Customers -->

<div id="customers"></div>


<script>

/* =========================================
   بيانات العملاء
========================================= */

let customers =
    JSON.parse(localStorage.getItem("followup_customers")) || [];


/* =========================================
   حفظ البيانات
========================================= */

function saveCustomers(){

    localStorage.setItem(
        "followup_customers",
        JSON.stringify(customers)
    );

}


/* =========================================
   تنظيف رقم الهاتف
========================================= */

function cleanPhone(phone){

    phone = phone
        .replace(/\s/g,"")
        .replace(/-/g,"")
        .replace(/[()]/g,"");

    /*
       لو الرقم مصري:
       010xxxxxxxx
       يتحول إلى:
       2010xxxxxxxx
    */

    if(phone.startsWith("01")){

        phone = "20" + phone.substring(1);

    }

    /*
       لو مكتوب +20
    */

    if(phone.startsWith("+20")){

        phone = phone.substring(1);

    }

    return phone;

}


/* =========================================
   إضافة عميل
========================================= */

function addCustomer(){

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const note =
        document.getElementById("note").value.trim();


    if(name === ""){

        alert("من فضلك اكتب اسم العميل");

        return;

    }


    if(phone === ""){

        alert("من فضلك اكتب رقم الموبايل");

        return;

    }


    const customer = {

        id: Date.now(),

        name: name,

        phone: phone,

        note: note,

        createdAt: new Date().toLocaleDateString("ar-EG")

    };


    customers.push(customer);

    saveCustomers();

    document.getElementById("name").value = "";

    document.getElementById("phone").value = "";

    document.getElementById("note").value = "";


    showCustomers();

}


/* =========================================
   عرض العملاء
========================================= */

function showCustomers(){

    const container =
        document.getElementById("customers");

    const search =
        document.getElementById("search")
        .value
        .trim()
        .toLowerCase();


    let filtered = customers.filter(customer => {

        return (
            customer.name.toLowerCase().includes(search) ||
            customer.phone.includes(search)
        );

    });


    document.getElementById("counter").innerText =
        "عدد العملاء: " + customers.length;


    if(filtered.length === 0){

        container.innerHTML = `

            <div class="empty">

                👥 لا يوجد عملاء

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    filtered
        .slice()
        .reverse()
        .forEach(customer => {

            const card =
                document.createElement("div");

            card.className = "customer";


            card.innerHTML = `

                <h2>
                    ${escapeHTML(customer.name)}
                </h2>

                <div class="phone">
                    📞 ${escapeHTML(customer.phone)}
                </div>

                <div class="note">
                    ${escapeHTML(customer.note || "لا توجد ملاحظات")}
                </div>

                <div class="buttons">

                    <button
                        class="call"
                        onclick="callCustomer('${customer.phone}')"
                    >
                        📞 اتصال
                    </button>


                    <button
                        class="whatsapp"
                        onclick="whatsappCustomer('${customer.phone}')"
                    >
                        💬 واتساب
                    </button>


                    <button
                        class="delete"
                        onclick="deleteCustomer(${customer.id})"
                    >
                        🗑 حذف
                    </button>

                </div>

            `;


            container.appendChild(card);

        });

}


/* =========================================
   الاتصال
========================================= */

function callCustomer(phone){

    const clean =
        cleanPhone(phone);

    window.location.href =
        "tel:" + clean;

}


/* =========================================
   واتساب
========================================= */

function whatsappCustomer(phone){

    const clean =
        cleanPhone(phone);

    const message =
        encodeURIComponent(
            "السلام عليكم، مع حضرتك من FollowUp Pro."
        );


    const url =
        "https://wa.me/" +
        clean +
        "?text=" +
        message;


    window.location.href = url;

}


/* =========================================
   حذف العميل
========================================= */

function deleteCustomer(id){

    const confirmDelete =
        confirm("هل تريد حذف هذا العميل؟");


    if(!confirmDelete){

        return;

    }


    customers =
        customers.filter(
            customer => customer.id !== id
        );


    saveCustomers();

    showCustomers();

}


/* =========================================
   حماية النصوص
========================================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   تشغيل البرنامج
========================================= */

showCustomers();

</script>

</body>

</html>
