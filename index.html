function showMessage(text){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.style.display = "block";

    setTimeout(function(){

        box.style.display = "none";

    },2200);

}


/* =====================================================
   إنشاء عميل جاهز
===================================================== */

function createCustomer(data){

    return {

        id:
            Date.now().toString() +
            Math.random()
                .toString(36)
                .substring(2,8),

        name:
            data.name || "",

        phone:
            data.phone || "",

        address:"",

        type:"C",

        date:"",

        time:"",

        notes:"",

        orderStatus:"none",

        calls:{},

        noAnswer:{},

        createdAt:
            new Date().toISOString()

    };

}


/* =====================================================
   تحميل العملاء
===================================================== */

function loadCustomers(){

    const data =
        localStorage.getItem(DB_NAME);


    if(!data){

        customers =
            DEFAULT_CUSTOMERS.map(
                createCustomer
            );

        saveCustomers();

        return;

    }


    try{

        const parsed =
            JSON.parse(data);


        if(Array.isArray(parsed)){

            customers = parsed;

        }else{

            customers = [];

        }

    }catch(error){

        console.error(error);

        customers = [];

    }


    /* تأمين البيانات القديمة */

    customers.forEach(function(customer){

        if(!customer.calls){
            customer.calls = {};
        }

        if(!customer.noAnswer){
            customer.noAnswer = {};
        }

        if(!customer.type){
            customer.type = "C";
        }

        if(!customer.orderStatus){
            customer.orderStatus = "none";
        }

        if(!customer.address){
            customer.address = "";
        }

        if(!customer.notes){
            customer.notes = "";
        }

    });

}


/* =====================================================
   حفظ
===================================================== */

function saveCustomers(){

    try{

        localStorage.setItem(
            DB_NAME,
            JSON.stringify(customers)
        );

        return true;

    }catch(error){

        console.error(error);

        alert(
            "حصل خطأ أثناء حفظ البيانات."
        );

        return false;

    }

}

function getToday(){

    const d =
        new Date();


    return (

        d.getFullYear() +

        "-" +

        String(
            d.getMonth()+1
        ).padStart(2,"0") +

        "-" +

        String(
            d.getDate()
        ).padStart(2,"0")

    );

}


/* =====================================================

===================================================== */

function escapeHTML(value){

    return String(value || "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}

            Date.now().toString(),

        name:name,

        phone:phone,

        address:address,

        type:type,

        date:date,

        time:time,

        notes:notes,

        orderStatus:orderStatus,

        calls:{},

        noAnswer:{},

        createdAt:
            new Date().toISOString()

    };


    customers.push(customer);


    if(!saveCustomers()){

        customers.pop();

        return;

    }


    clearAddForm();

    renderCustomers();


    showMessage(
        "✅ تم إضافة العميل بنجاح"
    );

}


/* =====================================================
   تنظيف نموذج الإضافة
===================================================== */

function clearAddForm(){

    document.getElementById("name").value = "";

    document.getElementById("phone").value = "";

    document.getElementById("address").value = "";

    document.getElementById("date").value = "";

    document.getElementById("time").value = "";

    document.getElementById("notes").value = "";

    document.getElementById("orderStatus").value =
        "none";

    document.getElementById("type").value =
        "C";

}


/* =====================================================
   مكالمات اليوم
===================================================== */

function getCallsToday(customer){

    if(!customer.calls){

        customer.calls = {};

    }


    return Number(
        customer.calls[getToday()] || 0
    );

}


/* =====================================================
   تسجيل مكالمة
===================================================== */

function addCall(id){

    const customer =
        customers.find(
            item => item.id === id
        );


    if(!customer){

        return;

    }


    if(!customer.calls){

        customer.calls = {};

    }


    const today =
        getToday();


    customer.calls[today] =
        Number(
            customer.calls[today] || 0
        ) + 1;


    /*
       لو سجلنا مكالمة
       يبقى لم يرد القديمة لليوم
       يتم إزالتها
    */

    if(customer.noAnswer){

        delete customer.noAnswer[today];

    }


    saveCustomers();

    renderCustomers();

}


/* =====================================================
   اتصال
===================================================== */

function callCustomer(id){

    const customer =
        customers.find(
            item => item.id === id
        );


    if(!customer){

        return;

    }


    if(!customer.phone){

        alert(
            "هذا العميل لا يوجد له رقم هاتف"
        );

        return;

    }


    addCall(id);


    window.location.href =
        "tel:" +
        customer.phone;

}


/* =====================================================
   واتساب
===================================================== */

function whatsapp(id){

    const customer =
        customers.find(
            item => item.id === id
        );


    if(!customer){

        return;

    }


    if(!customer.phone){

        alert(
            "هذا العميل لا يوجد له رقم هاتف"
        );

        return;

    }


    let number =
        customer.phone
            .replace(/\D/g,"");


    if(number.startsWith("01")){

        number =
            "20" +
            number.substring(1);

    }


    window.open(
        "https://wa.me/" +
        number,
        "_blank"
    );

}


/* =====================================================
   تم الاتصال
===================================================== */

function markCalled(id){

    addCall(id);

    showMessage(
        "✅ تم تسجيل الاتصال"
    );

}


/* =====================================================
   لم يرد
===================================================== */

function markNoAnswer(id){

    const customer =
        customers.find(
            item => item.id === id
        );


    if(!customer){

        return;

    }


    if(!customer.noAnswer){

        customer.noAnswer = {};

    }


    customer.noAnswer[getToday()] =
        true;


    saveCustomers();

    renderCustomers();


    showMessage(
        "❌ تم تسجيل لم يرد"
    );

}


/* =====================================================
   الطلبية
===================================================== */

function setOrder(id,status){

    const customer =
        customers.find(
            item => item.id === id
        );


    if(!customer){

        return;

    }


    customer.orderStatus =
        status;


    saveCustomers();

    renderCustomers();


    showMessage(
        "📦 تم تحديث حالة الطلبية"
    );

}


/* =====================================================
   تعديل
===================================================== */

function editCustomer(id){

    const customer =
        customers.find(
            item => item.id === id
        );


    if(!customer){

        return;

    }


    editId = id;


    document
        .getElementById("editName")
        .value =
        customer.name || "";


    document
        .getElementById("editPhone")
        .value =
        customer.phone || "";


    document
        .getElementById("editAddress")
        .value =
        customer.address || "";


    document
        .getElementById("editType")
        .value =
        customer.type || "C";


    document
        .getElementById("editDate")
        .value =
        customer.date || "";


    document
        .getElementById("editTime")
        .value =
        customer.time || "";


    document
        .getElementById("editNotes")
        .value =
        customer.notes || "";


    document
        .getElementById("editOrderStatus")
        .value =
        customer.orderStatus || "none";


    document
        .getElementById("editModal")
        .classList
        .add("show");

}


/* =====================================================
   حفظ التعديل
===================================================== */

function saveEdit(){

    const customer =
        customers.find(
            item => item.id === editId
        );


    if(!customer){

        return;

    }


    const name =
        document
            .getElementById("editName")
            .value
            .trim();


    const phone =
        document
            .getElementById("editPhone")
            .value
            .trim();


    if(name === ""){

        alert(
            "اكتب اسم العميل"
        );

        return;

    }


    if(phone === ""){

        alert(
            "اكتب رقم الهاتف"
        );

        return;

    }


    customer.name =
        name;


    customer.phone =
        phone;


    customer.address =
        document
            .getElementById("editAddress")
            .value
            .trim();


    customer.type =
        document
            .getElementById("editType")
            .value;


    customer.date =
        document
            .getElementById("editDate")
            .value;


    customer.time =
        document
            .getElementById("editTime")
            .value;


    customer.notes =
        document
            .getElementById("editNotes")
            .value
            .trim();


    customer.orderStatus =
        document
            .getElementById("editOrderStatus")
            .value;


    saveCustomers();

    closeEdit();

    renderCustomers();


    showMessage(
        "✅ تم تعديل بيانات العميل"
    );

}


/* =====================================================
   إغلاق التعديل
===================================================== */

function closeEdit(){

    editId = null;


    document
        .getElementById("editModal")
        .classList
        .remove("show");

}


/* =====================================================
   حذف
===================================================== */

function deleteCustomer(id){

    const customer =
        customers.find(
            item => item.id === id
        );


    if(!customer){

        return;

    }


    const ok =
        confirm(
            "هل تريد حذف العميل:\n\n" +
            customer.name +
            " ؟"
        );


    if(!ok){

        return;

    }


    customers =
        customers.filter(
            item => item.id !== id
        );


    saveCustomers();

    renderCustomers();


    showMessage(
        "🗑️ تم حذف العميل"
    );

}


/* =====================================================
   حالة الطلبية
===================================================== */

function getOrderBadge(status){

    if(status === "yes"){

        return `
            <span class="badge blue">
                📦 أخذ طلبية
            </span>
        `;

    }


    if(status === "no"){

        return `
            <span class="badge red">
                ❌ لم يأخذ طلبية
            </span>
        `;

    }


    if(status === "later1"){

        return `
            <span class="badge orange">
                ⏰ كلمني بعد ساعة
            </span>
        `;

    }


    if(status === "later2"){

        return `
            <span class="badge orange">
                ⏰ كلمني بعد ساعتين
            </span>
        `;

    }


    return "";

}


/* =====================================================
   عرض العملاء
===================================================== */

function renderCustomers(){

    const container =
        document
            .getElementById("customers");


    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();


    const filter =
        document
            .getElementById("filter")
            .value;


    const today =
        getToday();


    /* ================= الإحصائيات ================= */

    document
        .getElementById("total")
        .textContent =
        customers.length;


    document
        .getElementById("calledCount")
        .textContent =
        customers.filter(
            customer =>
                getCallsToday(customer) > 0
        ).length;


    document
        .getElementById("notCalledCount")
        .textContent =
        customers.filter(
            customer =>
                getCallsToday(customer) === 0
        ).length;


    document
        .getElementById("ordersCount")
        .textContent =
        customers.filter(
            customer =>
                customer.orderStatus === "yes"
        ).length;


    /* ================= الفلترة ================= */

    const result =
        customers.filter(
            customer => {


                const text =
                    (
                        customer.name +
                        " " +
                        customer.phone +
                        " " +
                        (customer.address || "") +
                        " " +
                        (customer.notes || "")
                    )
                    .toLowerCase();


                if(
                    search &&
                    !text.includes(search)
                ){

                    return false;

                }


                const calls =
                    getCallsToday(customer);


                if(
                    filter === "notCalled" &&
                    calls > 0
                ){

                    return false;

                }


                if(
                    filter === "called" &&
                    calls === 0
                ){

                    return false;

                }


                if(
                    filter === "noAnswer" &&
                    !(
                        customer.noAnswer &&
                        customer.noAnswer[today]
                    )
                ){

                    return false;

                }


                if(
                    filter === "orders" &&
                    customer.orderStatus !== "yes"
                ){

                    return false;

                }


                if(
                    filter === "noOrders" &&
                    customer.orderStatus !== "no"
                ){

                    return false;

                }


                return true;

            }
        );


    /* ================= لا يوجد نتائج ================= */

    if(result.length === 0){

        container.innerHTML = `

            <div class="card empty">

                👥

                <br><br>

                لا يوجد عملاء مطابقين للبحث

            </div>

        `;

        return;

    }


    /* ================= عرض العملاء ================= */

    container.innerHTML =

        result.map(
            customer => {


                const calls =
                    getCallsToday(customer);


                const called =
                    calls > 0;


                const noAnswer =
                    customer.noAnswer &&
                    customer.noAnswer[today];


                const type =
                    customer.type || "C";


                return `

                <div
                    class="customer"
                    id="customer-${customer.id}"
                >


                    <div class="customer-title">


                        <div class="customer-name">

                            👤

                            ${escapeHTML(
                                customer.name
                            )}

                        </div>


                        <div
                            class="type type-${escapeHTML(type)}"
                        >

                            ${escapeHTML(type)}

                        </div>


                    </div>


                    <div class="customer-body">


                        <div class="info">

                            <span>
                                📞 الهاتف:
                            </span>

                            <b>
                                ${escapeHTML(
                                    customer.phone ||
                                    "لا يوجد رقم"
                                )}
                            </b>

                        </div>


                        <div class="info">

                            <span>
                                📍 العنوان:
                            </span>

                            <b>

                                ${
                                    escapeHTML(
                                        customer.address ||
                                        "غير محدد"
                                    )
                                }

                            </b>

                        </div>


                        <div class="info">

                            <span>
                                📅 موعد الاتصال:
                            </span>

                            <b>

                                ${
                                    customer.date
                                    ?
                                    escapeHTML(
                                        customer.date
                                    )
                                    :
                                    "غير محدد"
                                }

                                ${
                                    customer.time
                                    ?
                                    " - " +
                                    escapeHTML(
                                        customer.time
                                    )
                                    :
                                    ""
                                }

                            </b>

                        </div>


                        <div class="notes">

                            ${
                                customer.notes
                                ?
                                escapeHTML(
                                    customer.notes
                                )
                                :
                                "لا توجد ملاحظات"
                            }

                        </div>


                        <div class="badges">


                            <span
                                class="badge ${
                                    called
                                    ?
                                    "green"
                                    :
                                    "orange"
                                }"
                            >

                                ${
                                    called
                                    ?
                                    "✅ تم الاتصال اليوم"
                                    :
                                    "⏳ لم أتصل اليوم"
                                }

                            </span>


                            <span class="badge blue">

                                📞 رنات اليوم:

                                ${calls}

                            </span>


                            ${
                                noAnswer
                                ?
                                `
                                <span class="badge red">
                                    ❌ لم يرد
                                </span>
                                `
                                :
                                ""
                            }


                            ${getOrderBadge(
                                customer.orderStatus
                            )}


                        </div>


                        <div class="actions">


                            <button
                                class="action call"
                                onclick="callCustomer('${customer.id}')"
                            >

                                📞 اتصال + رن

                            </button>


                            <button
                                class="action whatsapp"
                                onclick="whatsapp('${customer.id}')"
                            >

                                💬 واتساب

                            </button>


                            <button
                                class="action called"
                                onclick="markCalled('${customer.id}')"
                            >

                                ✅ تم الاتصال

                            </button>


                            <button
                                class="action noanswer"
                                onclick="markNoAnswer('${customer.id}')"
                            >

                                ❌ لم يرد

                            </button>


                            <button
                                class="action order"
                                onclick="setOrder('${customer.id}','yes')"
                            >

                                📦 أخذ طلبية

                            </button>


                            <button
                                class="action noorder"
                                onclick="setOrder('${customer.id}','no')"
                            >

                                🚫 لم يأخذ

                            </button>


                            <button
                                class="action follow"
                                onclick="setOrder('${customer.id}','later1')"
                            >

                                ⏰ بعد ساعة

                            </button>


                            <button
                                class="action follow"
                                onclick="setOrder('${customer.id}','later2')"
                            >

                                ⏰ بعد ساعتين

                            </button>


                            <button
                                class="action edit"
                                onclick="editCustomer('${customer.id}')"
                            >

                                ✏️ تعديل

                            </button>


                            <button
                                class="action delete"
                                onclick="deleteCustomer('${customer.id}')"
                            >

                                🗑️ حذف

                            </button>


                        </div>


                    </div>

                </div>

                `;

            }

        ).join("");

}


/* =====================================================
   تشغيل البرنامج
===================================================== */

loadCustomers();

renderCustomers();


/* =====================================================
   إغلاق نافذة التعديل بالضغط خارجها
===================================================== */

document
    .getElementById("editModal")
    .addEventListener(
        "click",
        function(event){

            if(event.target === this){

                closeEdit();

            }

        }
    );


/* =====================================================
   Enter لإضافة العميل
===================================================== */

document
    .getElementById("phone")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                addCustomer();

            }

        }
    );

</script>
