<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>أحمد فايد - متابعة العملاء</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#071018;
    color:#fff;
    padding:12px;
}

.container{
    max-width:850px;
    margin:auto;
}

.header{
    background:#1524c8;
    border-radius:25px;
    padding:22px 16px;
    text-align:center;
    margin-bottom:14px;
}

.header h1{
    margin:0 0 8px;
    font-size:30px;
}

.header p{
    margin:0;
    opacity:.9;
}

.section{
    background:#171b20;
    border-radius:22px;
    padding:16px;
    margin-bottom:14px;
}

.section-title{
    margin:0 0 12px;
    font-size:21px;
}

input,
textarea,
select{
    width:100%;
    padding:14px;
    margin:5px 0;
    background:#222831;
    border:1px solid #3d4652;
    color:#fff;
    border-radius:14px;
    font-size:16px;
    outline:none;
}

textarea{
    min-height:90px;
    resize:vertical;
}

button{
    border:0;
    cursor:pointer;
    color:#fff;
    font-weight:bold;
    border-radius:13px;
    padding:13px;
    font-size:15px;
}

.primary{
    width:100%;
    background:#1455e8;
    margin-top:8px;
}

.notification-btn{
    width:100%;
    background:#8b5cf6;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:14px;
}

.stat{
    background:#171b20;
    border-radius:15px;
    padding:12px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:23px;
    margin-bottom:5px;
}

.customer{
    background:#171b20;
    border-right:5px solid #285dff;
    border-radius:22px;
    padding:17px;
    margin-bottom:14px;
}

.customer.called{
    border-right-color:#16a34a;
}

.customer h2{
    margin:0 0 12px;
    font-size:21px;
}

.info{
    color:#cbd5e1;
    margin:7px 0;
    line-height:1.6;
}

.info strong{
    color:#fff;
}

.badge{
    display:inline-block;
    background:#354052;
    padding:4px 10px;
    border-radius:18px;
    font-size:13px;
}

.status{
    display:inline-block;
    padding:7px 11px;
    border-radius:18px;
    margin-top:5px;
    background:#333;
    font-size:13px;
}

.order-yes{
    background:#087f23;
}

.order-no{
    background:#a00018;
}

.follow{
    background:#895c00;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:7px;
    margin-top:13px;
}

.call{
    background:#07951d;
}

.whatsapp{
    background:#15a84c;
}

.done{
    background:#1769d1;
}

.no-answer{
    background:#b00020;
}

.order{
    background:#7b3aed;
}

.follow-up{
    background:#b36b00;
}

.edit{
    background:#087f8c;
}

.delete{
    background:#555;
}

.empty{
    text-align:center;
    padding:30px;
    color:#8f99a4;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:none;
    align-items:center;
    justify-content:center;
    padding:14px;
    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-content{
    background:#171b20;
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow:auto;
    border-radius:22px;
    padding:18px;
}

.modal-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:8px;
}

.save{
    background:#159447;
}

.cancel{
    background:#555;
}

.small{
    color:#9ca3af;
    font-size:13px;
    line-height:1.6;
}

@media(max-width:520px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .buttons{
        grid-template-columns:1fr;
    }

    .modal-buttons{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>📞 أحمد فايد</h1>
    <p>متابعة العملاء - تليسلز مخزن الفتح</p>
</div>


<!-- إضافة عميل -->

<div class="section">

<h3 class="section-title">➕ إضافة عميل</h3>

<input id="name" placeholder="👤 اسم العميل">

<input id="phone" type="tel" placeholder="📞 رقم التلفون">

<input id="address" placeholder="📍 عنوان العميل">

<select id="type">
    <option value="A">A - عميل مهم</option>
    <option value="B">B - عميل متوسط</option>
    <option value="C">C - عميل عادي</option>
</select>

<input id="date" type="date">

<input id="time" type="time">

<textarea id="note" placeholder="📝 ملاحظات العميل"></textarea>

<select id="orderStatus">

    <option value="none">
        لم يتم تحديد حالة الطلبية
    </option>

    <option value="yes">
        📦 أخذ طلبية
    </option>

    <option value="no">
        ❌ لم يأخذ طلبية
    </option>

    <option value="later1">
        ⏰ كلمني بعد ساعة
    </option>

    <option value="later2">
        ⏰ كلمني بعد ساعتين
    </option>

</select>

<button class="primary" onclick="addCustomer()">
    ➕ إضافة العميل
</button>

</div>


<!-- الإشعارات -->

<div class="section">

<h3 class="section-title">
    🔔 إشعارات المواعيد
</h3>

<p class="small">
اضغط على الزر للسماح للبرنامج بإظهار إشعارات مواعيد الاتصال.
</p>

<button
class="notification-btn"
onclick="requestNotifications()"
>
🔔 تفعيل الإشعارات
</button>

</div>


<!-- البحث -->

<div class="section">

<h3 class="section-title">
    🔎 البحث والمتابعة
</h3>

<input
id="search"
placeholder="ابحث بالاسم أو الرقم أو العنوان أو الملاحظات..."
oninput="renderCustomers()"
>

<select id="filter" onchange="renderCustomers()">

<option value="all">
كل العملاء
</option>

<option value="notCalled">
