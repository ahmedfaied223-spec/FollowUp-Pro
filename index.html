<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>أحمد فايد - إدارة العملاء</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#0b1220;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:15px;
}

.header{
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    border-radius:20px;
    padding:22px;
    text-align:center;
    margin-bottom:15px;
    box-shadow:0 8px 25px #0005;
}

.header h1{margin:0 0 8px}

.card,.customer,.stat{
    background:#111827;
    border:1px solid #334155;
}

.card{
    border-radius:18px;
    padding:16px;
    margin-bottom:15px;
}

h2{margin-top:0}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.full{grid-column:1/-1}

label{
    display:block;
    color:#cbd5e1;
    margin-bottom:5px;
    font-size:14px;
}

input,select,textarea{
    width:100%;
    padding:13px;
    border-radius:12px;
    border:1px solid #475569;
    background:#0f172a;
    color:white;
    outline:none;
    font-size:15px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2563eb;
}

.btn{
    border:0;
    border-radius:12px;
    padding:13px 16px;
    color:#fff;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

.btn-main{
    background:#2563eb;
    width:100%;
    margin-top:12px;
}

.top-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.backup{background:#7c3aed}
.restore{background:#0891b2}

.search{
    margin-bottom:10px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:15px;
}

.stat{
    border-radius:15px;
    padding:15px 5px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:23px;
    margin-bottom:5px;
}

.stat span{
    color:#94a3b8;
    font-size:12px;
}

.customer{
    border-radius:18px;
    margin-bottom:13px;
    overflow:hidden;
}

.customer-title{
    background:#1e293b;
    padding:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.customer-name{
    font-size:19px;
    font-weight:bold;
}

.type{
    border-radius:20px;
    padding:5px 13px;
    font-weight:bold;
}

.type-A{background:#dc2626}
.type-B{background:#d97706}
.type-C{background:#2563eb}

.customer-body{
    padding:15px;
}

.info{
    margin:8px 0;
    line-height:1.6;
}

.info span{
    color:#94a3b8;
}

.notes{
    background:#0f172a;
    border-radius:12px;
    padding:10px;
    margin-top:10px;
    white-space:pre-wrap;
}

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin:12px 0;
}

.badge{
    padding:7px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.green{background:#14532d}
.red{background:#7f1d1d}
.orange{background:#78350f}
.blue{background:#1e3a8a}
.gray{background:#334155}
.purple{background:#581c87}

.actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:7px;
}

.action{
    border:0;
    border-radius:10px;
    color:#fff;
    padding:11px 7px;
    font-weight:bold;
    cursor:pointer;
}

.call{background:#16a34a}
.whatsapp{background:#15803d}
.called{background:#0891b2}
.noanswer{background:#dc2626}
.order{background:#7c3aed}
.noorder{background:#991b1b}
.follow{background:#d97706}
.edit{background:#0369a1}
.delete{background:#475569}

.empty{
    text-align:center;
    color:#94a3b8;
    padding:35px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#000c;
    z-index:999;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:#111827;
    width:100%;
    max-width:650px;
    max-height:90vh;
    overflow:auto;
    border-radius:20px;
    padding:17px;
    border:1px solid #334155;
}

.modal-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
}

.save{background:#16a34a}
.close{background:#475569}

#message{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#020617;
    border:1px solid #475569;
    padding:13px 20px;
    border-radius:12px;
    display:none;
    z-index:2000;
    box-shadow:0 5px 20px #0008;
}

@media(max-width:650px){

    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .actions{
        grid-template-columns:1fr;
    }

    .top-buttons{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>📞 أحمد فايد</h1>
    <div>إدارة ومتابعة العملاء</div>
</div>


<!-- إدارة البيانات -->

<div class="card">

<h2>💾 إدارة البيانات</h2>

<div class="top-buttons">

<button class="btn backup" onclick="backupData()">
💾 حفظ نسخة احتياطية
</button>

📥 استرجاع نسخة احتياطية

<p style="color:#94a3b8;font-size:13px">
البيانات محفوظة على نفس الجهاز والمتصفح.

<!-- إضافة عميل -->

<div class="card">

<div class="grid">

<div>
<label>اسم العميل *</label>

</div>

<div>

<input id="date" type="date">
</div>

<div>
<label>ميعاد المتابعة</label>

</div>

<div class="full">

<label>حالة الطلبية</label>

<select id="orderStatus">

لم يتم تحديدها
</option>

</div>

💾 إضافة وحفظ العميل

</div>


<!-- البحث -->

<div class="card">

<h2>🔎 البحث والفلترة</h2>

<input
class="search"
id="search"
type="search"
placeholder="ابحث باسم العميل أو الرقم أو العنوان أو الملاحظات"

>

<select id="filter" onchange="renderCustomers()">

</option>

</option>

</option>

<option value="noOrders">
لم يأخذوا طلبية
</option>

<option value="A">
عملاء A
</option>

<option value="B">
عملاء B
</option>

<option value="C">
عملاء C
</option>

</select>

</div>


<!-- الإحصائيات -->

<div class="stats">

<div class="stat">
<b id="total">0</b>
<span>كل العملاء</span>
</div>

<div class="stat">

</div>

<div class="stat">
<b id="notCalledCount">0</b>
<span>لم أتصل اليوم</span>
</div>

<b id="ordersCount">0</b>
<span>طلبات</span>
</div>

</div>


<div id="customers"></div>

</div>


<!-- نافذة تعديل العميل -->

<div class="modal" id="editModal">

<div class="modal-box">

<h2>✏️ تعديل بيانات العميل</h2>

<div class="grid">

<div>
<label>اسم العميل</label>
<input id="editName">
</div>

<div>
<label>رقم الهاتف</label>
<input id="editPhone">
</div>

<div>
<label>العنوان</label>
<input id="editAddress">
</div>

<div>
<label>نوع العميل ABC</label>

<select id="editType">
<option value="A">A - مهم</option>
<option value="B">B - متوسط</option>
<option value="C">C - عادي</option>
</select>

</div>

<div>
<label>تاريخ المتابعة</label>
<input id="editDate" type="date">
</div>

<div>
<label>ميعاد المتابعة</label>
<input id="editTime" type="time">
</div>

<div class="full">
<label>الملاحظات</label>
<textarea id="editNotes"></textarea>
</div>

<div class="full">

<label>حالة الطلبية</label>

<select id="editOrderStatus">

<option value="none">
لم يتم تحديدها
</option>

<option value="yes">
📦 أخذ طلبية
</option>

<option value="no">
❌ لم يأخذ طلبية
</option>

<option value="later1">
⏰ بعد ساعة
</option>

⏰ بعد ساعتين

<div class="modal-buttons">

💾 حفظ التعديل
</button>

</button>

<div id="message"></div>


<script>

const DB_NAME="ahmed_fayed_customers_v3";

let customers=[];

let editId=null;


/* =========================
   الرسائل
========================= */

function showMessage(text){

    const box=document.getElementById("message");

    box.textContent=text;

    box.style.display="block";

    setTimeout(function(){

        box.style.display="none";

    },2500);

}


/* =========================
   تحميل البيانات
========================= */

function loadCustomers(){

    try{

        const data=
            localStorage.getItem(DB_NAME);

        if(data){

            customers=JSON.parse(data);

        }else{

            customers=[];

        }

        if(!Array.isArray(customers)){

            customers=[];

        }

    }catch(error){

        console.error(error);

        customers=[];

    }

}


/* =========================
   حفظ البيانات
========================= */

function saveCustomers(){

    try{

        localStorage.setItem(
            DB_NAME,
            JSON.stringify(customers)
        );

        return true;

    }catch(error){

        alert(
            "حدث خطأ أثناء حفظ البيانات."
        );

        return false;

    }

}


/* =========================
   تاريخ اليوم
========================= */

function getToday(){

    const d=new Date();

    return d.getFullYear()+
    "-"+
    String(d.getMonth()+1).padStart(2,"0")+
    "-"+
    String(d.getDate()).padStart(2,"0");

}


/* =========================
   تنظيف النص
========================= */

function escapeHTML(value){

    return String(value||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   إضافة العميل
========================= */

function addCustomer(){

    const name=
        document.getElementById("name")
        .value.trim();

    const phone=
        document.getElementById("phone")
        .value.trim();

    if(name===""){

        alert("اكتب اسم العميل");

        document.getElementById("name").focus();

        return;

    }

    if(phone===""){

        alert("اكتب رقم الهاتف");

        document.getElementById("phone").focus();

        return;

    }


    const customer={

        id:
            Date.now().toString(),

        name:name,

        phone:phone,

        address:
            document
            .getElementById("address")
            .value.trim(),

        type:
            document
            .getElementById("type")
            .value,

        date:
            document
            .getElementById("date")
            .value,

        time:
            document
            .getElementById("time")
            .value,

        notes:
            document
            .getElementById("notes")
            .value.trim(),

        orderStatus:
            document
            .getElementById("orderStatus")
            .value,

        calls:{},

        noAnswer:{},

        createdAt:
            new Date().toISOString()

    };


    customers.push(customer);


    if(!saveCustomers()){

        customers.pop();

        return;

    }


    document.getElementById("name").value="";

    document.getElementById("phone").value="";

    document.getElementById("address").value="";

    document.getElementById("date").value="";

    document.getElementById("time").value="";

    document.getElementById("notes").value="";

    document.getElementById("orderStatus").value="none";

    document.getElementById("type").value="C";


    renderCustomers();


    showMessage(
        "✅ تم إضافة العميل وحفظه بنجاح"
    );

}


/* =========================
   عدد الرنات اليوم
========================= */

function getCallsToday(customer){

    if(!customer.calls){

        customer.calls={};

    }

    return Number(
        customer.calls[getToday()]||0
    );

}


/* =========================
   تسجيل رنة
========================= */

function addCall(id){

    const customer=
        customers.find(
            c=>c.id===id
        );

    if(!customer){

        return;

    }


    if(!customer.calls){

        customer.calls={};

    }


    const today=getToday();


    customer.calls[today]=
        Number(customer.calls[today]||0)+1;


    saveCustomers();

    renderCustomers();

}


/* =========================
   اتصال
========================= */

function callCustomer(id){

    const customer=
        customers.find(
            c=>c.id===id
        );

    if(!customer){

        return;

    }


    addCall(id);


    window.location.href=
        "tel:"+customer.phone;

}


/* =========================
   واتساب
========================= */

function whatsapp(id){

    const customer=
        customers.find(
            c=>c.id===id
        );

    if(!customer){

        return;

    }


    let number=
        String(customer.phone)
        .replace(/\D/g,"");


    if(number.startsWith("01")){

        number=
            "20"+
            number.substring(1);

    }


    window.open(
        "https://wa.me/"+number,
        "_blank"
    );

}


/* =========================
   تم الاتصال
========================= */

function markCalled(id){

    addCall(id);

    showMessage(
        "✅ تم تسجيل الاتصال"
    );

}


/* =========================
   لم يرد
========================= */

function markNoAnswer(id){

    const customer=
        customers.find(
            c=>c.id===id
        );

    if(!customer){

        return;

    }


    if(!customer.noAnswer){

        customer.noAnswer={};

    }


    customer.noAnswer[getToday()]=true;


    saveCustomers();

    renderCustomers();


    showMessage(
        "❌ تم تسجيل لم يرد"
    );

}


/* =========================
   حالة الطلبية
========================= */

function setOrder(id,status){

    const customer=
        customers.find(
            c=>c.id===id
        );

    if(!customer){

        return;

    }


    customer.orderStatus=status;


    saveCustomers();

    renderCustomers();


    showMessage(
        "📦 تم تحديث حالة الطلبية"
    );

}


/* =========================
   تعديل العميل
========================= */

function editCustomer(id){

    const customer=
        customers.find(
            c=>c.id===id
        );

    if(!customer){

        return;

    }


    editId=id;


    document.getElementById("editName").value=
        customer.name||"";

    document.getElementById("editPhone").value=
        customer.phone||"";

    document.getElementById("editAddress").value=
        customer.address||"";

    document.getElementById("editType").value=
        customer.type||"C";

    document.getElementById("editDate").value=
        customer.date||"";

    document.getElementById("editTime").value=
        customer.time||"";

    document.getElementById("editNotes").value=
        customer.notes||"";

    document.getElementById("editOrderStatus").value=
        customer.orderStatus||"none";


    document
        .getElementById("editModal")
        .classList
        .add("show");

}


/* =========================
   حفظ التعديل
========================= */

function saveEdit(){

    const customer=
        customers.find(
            c=>c.id===editId
        );

    if(!customer){

        return;

    }


    const name=
        document
        .getElementById("editName")
        .value.trim();


    const phone=
        document
        .getElementById("editPhone")
        .value.trim();


    if(name===""){

        alert("اكتب اسم العميل");

        return;

    }


    if(phone===""){

        alert("اكتب رقم الهاتف");

        return;

    }


    customer.name=name;

    customer.phone=phone;

    customer.address=
        document
        .getElementById("editAddress")
        .value.trim();

    customer.type=
        document
        .getElementById("editType")
        .value;

    customer.date=
        document
        .getElementById("editDate")
        .value;

    customer.time=
        document
        .getElementById("editTime")
        .value;

    customer.notes=
        document
        .getElementById("editNotes")
        .value.trim();

    customer.orderStatus=
        document
        .getElementById("editOrderStatus")
        .value;


    saveCustomers();

    closeEdit();

    renderCustomers();


    showMessage(
        "✅ تم تعديل بيانات العميل"
    );

}


/* =========================
   إغلاق التعديل
========================= */

function closeEdit(){

    editId=null;

    document
        .getElementById("editModal")
        .classList
        .remove("show");

}


/* =========================
   حذف العميل
========================= */

function deleteCustomer(id){

    const customer=
        customers.find(
            c=>c.id===id
        );

    if(!customer){

        return;

    }


    const ok=
        confirm(
            "هل تريد حذف العميل:\n"+
            customer.name+
            " ؟"
        );


    if(!ok){

        return;

    }


    customers=
        customers.filter(
            c=>c.id!==id
        );


    saveCustomers();

    renderCustomers();


    showMessage(
        "🗑️ تم حذف العميل"
    );

}


/* =========================
   حالة الطلبية
========================= */

function getOrderBadge(status){

    if(status==="yes"){

        return `
        <span class="badge blue">
        📦 أخذ طلبية
        </span>
        `;

    }


    if(status==="no"){

        return `
        <span class="badge red">
        ❌ لم يأخذ طلبية
        </span>
        `;

    }


    if(status==="later1"){

        return `
        <span class="badge orange">
        ⏰ كلمني بعد ساعة
        </span>
        `;

    }


    if(status==="later2"){

        return `
        <span class="badge orange">
        ⏰ كلمني بعد ساعتين
        </span>
        `;

    }


    return "";

}


/* =========================
   عرض العملاء
========================= */

function renderCustomers(){

    const container=
        document.getElementById("customers");


    const search=
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const filter=
        document
        .getElementById("filter")
        .value;


    const today=getToday();


    document.getElementById("total")
        .textContent=
        customers.length;


    document.getElementById("calledCount")
        .textContent=
        customers.filter(
            c=>getCallsToday(c)>0
        ).length;


    document.getElementById("notCalledCount")
        .textContent=
        customers.filter(
            c=>getCallsToday(c)===0
        ).length;


    document.getElementById("ordersCount")
        .textContent=
        customers.filter(
            c=>c.orderStatus==="yes"
        ).length;


    const result=
        customers.filter(customer=>{

            const text=
                (
                    customer.name+
                    " "+
                    customer.phone+
                    " "+
                    (customer.address||"")+
                    " "+
                    (customer.notes||"")
                )
                .toLowerCase();


            if(
                search &&
                !text.includes(search)
            ){

                return false;

            }


            const calls=
                getCallsToday(customer);


            if(
                filter==="notCalled" &&
                calls>0
            ){

                return false;

            }


            if(
                filter==="called" &&
                calls===0
            ){

                return false;

            }


            if(
                filter==="noAnswer" &&
                !(
                    customer.noAnswer &&
                    customer.noAnswer[today]
                )
            ){

                return false;

            }


            if(
                filter==="orders" &&
                customer.orderStatus!=="yes"
            ){
