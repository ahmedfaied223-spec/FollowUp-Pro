<script>


/* =====================================================
   قاعدة البيانات المحلية
===================================================== */

const DB_NAME =
    "AHMED_FAYED_CUSTOMERS_V3";


let customers = [];

let editId = null;


/* =====================================================
   الرسائل
===================================================== */

function showMessage(text){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent = text;

    box.style.display = "block";


    setTimeout(
        () => {

            box.style.display =
                "none";

        },
        2500
    );

}


/* =====================================================
   الصوت
===================================================== */

function playAlertSound(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext){

            return;

        }

        const ctx =
            new AudioContext();


        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();


        oscillator.type =
            "sine";

        oscillator.frequency.value =
            880;


        gain.gain.setValueAtTime(
            .001,
            ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .4,
            ctx.currentTime + .05
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            ctx.currentTime + .8
        );


        oscillator.connect(gain);

        gain.connect(
            ctx.destination
        );


        oscillator.start();

        oscillator.stop(
            ctx.currentTime + .8
        );

    }catch(error){

        console.log(error);

    }

}


/* =====================================================
   تحميل البيانات
===================================================== */

function loadCustomers(){

    try{

        const data =
            localStorage.getItem(
                DB_NAME
            );


        if(!data){

            customers = [];

            return;

        }


        const parsed =
            JSON.parse(data);


        customers =
            Array.isArray(parsed)
            ? parsed
            : [];


        /*
            إصلاح أي بيانات قديمة
        */

        customers.forEach(
            customer => {

                if(!customer.calls){

                    customer.calls = {};

                }

                if(!customer.noAnswer){

                    customer.noAnswer = {};

                }

            }
        );


    }catch(error){

        console.error(error);

        customers = [];

    }

}


/* =====================================================
   حفظ البيانات
===================================================== */

function saveCustomers(){

    try{

        localStorage.setItem(
            DB_NAME,
            JSON.stringify(
                customers
            )
        );


        return true;

    }catch(error){

        console.error(error);

        alert(
            "تعذر حفظ البيانات على الجهاز."
        );


        return false;

    }

}


/* =====================================================
   التاريخ
===================================================== */

function getToday(){

    const d =
        new Date();


    return (

        d.getFullYear()
        +
        "-"
        +
        String(
            d.getMonth()+1
        ).padStart(2,"0")
        +
        "-"
        +
        String(
            d.getDate()
        ).padStart(2,"0")

    );

}


/* =====================================================
   ID
===================================================== */

function createId(){

    return (
        Date.now()
        +
        "-"
        +
        Math.random()
            .toString(36)
            .substring(2)
    );

}


/* =====================================================
   حماية HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   إضافة العميل
===================================================== */

function addCustomer(){

    const name =
        document.getElementById(
            "name"
        ).value.trim();


    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    if(!name){

        alert(
            "اكتب اسم العميل"
        );

        document
            .getElementById("name")
            .focus();

        return;

    }


    if(!phone){

        alert(
            "اكتب رقم الهاتف"
        );

        document
            .getElementById("phone")
            .focus();

        return;

    }


    const customer = {

        id:createId(),

        name:name,

        phone:phone,

        address:
            document
            .getElementById("address")
            .value
            .trim(),

        type:
            document
            .getElementById("type")
            .value,

        date:
            document
            .getElementById("date")
            .value,

        time:
            document
            .getElementById("time")
            .value,

        notes:
            document
            .getElementById("notes")
            .value
            .trim(),

        orderStatus:
            document
            .getElementById(
                "orderStatus"
            )
            .value,

        calls:{},

        noAnswer:{},

        notified:{},

        createdAt:
            new Date().toISOString()

    };


    customers.push(
        customer
    );


    if(
        !saveCustomers()
    ){

        customers.pop();

        return;

    }


    clearAddForm();

    renderCustomers();

    showMessage(
        "✅ تم إضافة العميل وحفظه"
    );


    /*
        لو فيه موعد قريب
        نعيد فحص التنبيهات
    */

    checkAppointments();

}


/* =====================================================
   تنظيف نموذج الإضافة
===================================================== */

function clearAddForm(){

    document.getElementById(
        "name"
    ).value = "";

    document.getElementById(
        "phone"
    ).value = "";

    document.getElementById(
        "address"
    ).value = "";

    document.getElementById(
        "type"
    ).value = "C";

    document.getElementById(
        "date"
    ).value = "";

    document.getElementById(
        "time"
    ).value = "";

    document.getElementById(
        "notes"
    ).value = "";

    document.getElementById(
        "orderStatus"
    ).value = "none";

}


/* =====================================================
   عدد المكالمات اليوم
===================================================== */

function getCallsToday(customer){

    if(!customer.calls){

        customer.calls = {};

    }


    return Number(
        customer
            .calls[
                getToday()
            ] || 0
    );

}


/* =====================================================
   تسجيل رنة
===================================================== */

function addCall(id){

    const customer =
        customers.find(
            c => c.id === id
        );


    if(!customer){

        return;

    }


    if(!customer.calls){

        customer.calls = {};

    }


    const today =
        getToday();


    customer.calls[today] =
        getCallsToday(customer) + 1;


    saveCustomers();

    renderCustomers();


    showMessage(
        "📞 تم تسجيل الرنة رقم " +
        customer.calls[today]
    );

}


/* =====================================================
   الاتصال
===================================================== */

function callCustomer(id){

    const customer =
        customers.find(
            c => c.id === id
        );


    if(!customer){

        return;

    }


    /*
        الرنة تسجل مرة واحدة
    */

    addCall(id);


    /*
        فتح برنامج الاتصال
    */

    window.location.href =
        "tel:" +
        customer.phone;

}


/* =====================================================
   واتساب
===================================================== */

function whatsapp(id){

    const customer =
        customers.find(
            c => c.id === id
        );


    if(!customer){

        return;

    }


    let number =
        String(
            customer.phone
        )
        .replace(
            /\D/g,
            ""
        );


    if(
        number.startsWith("01")
    ){

        number =
            "20" +
            number.substring(1);

    }


    /*
        واتساب يحتاج إنترنت
    */

    window.open(
        "https://wa.me/" +
        number,
        "_blank"
    );

}


/* =====================================================
   تم الاتصال
===================================================== */

function markCalled(id){

    addCall(id);

}


/* =====================================================
   لم يرد
===================================================== */

function markNoAnswer(id){

    const customer =
        customers.find(
            c => c.id === id
        );


    if(!customer){

        return;

    }


    if(!customer.noAnswer){

        customer.noAnswer = {};

    }


    customer.noAnswer[
        getToday()
    ] = true;


    saveCustomers();

    renderCustomers();


    showMessage(
        "❌ تم تسجيل لم يرد"
    );

}


/* =====================================================
   الطلبية
===================================================== */

function setOrder(
    id,
    status
){

    const customer =
        customers.find(
            c => c.id === id
        );


    if(!customer){

        return;

    }


    customer.orderStatus =
        status;


    saveCustomers();

    renderCustomers();


    showMessage(
        "📦 تم تحديث حالة الطلبية"
    );

}


/* =====================================================
   تعديل
===================================================== */

function editCustomer(id){

    const customer =
        customers.find(
            c => c.id === id
        );


    if(!customer){

        return;

    }


    editId = id;


    document.getElementById(
        "editName"
    ).value =
        customer.name || "";


    document.getElementById(
        "editPhone"
    ).value =
        customer.phone || "";


    document.getElementById(
        "editAddress"
    ).value =
        customer.address || "";


    document.getElementById(
        "editType"
    ).value =
        customer.type || "C";


    document.getElementById(
        "editDate"
    ).value =
        customer.date || "";


    document.getElementById(
        "editTime"
    ).value =
        customer.time || "";


    document.getElementById(
        "editNotes"
    ).value =
        customer.notes || "";


    document.getElementById(
        "editOrderStatus"
    ).value =
        customer.orderStatus ||
        "none";


    document.getElementById(
        "editModal"
    )
    .classList
    .add("show");

}


/* =====================================================
   حفظ التعديل
===================================================== */

function saveEdit(){

    const customer =
        customers.find(
            c => c.id === editId
        );


    if(!customer){

        return;

    }


    const name =
        document.getElementById(
            "editName"
        ).value.trim();


    const phone =
        document.getElementById(
            "editPhone"
        ).value.trim();


    if(!name){

        alert(
            "اكتب اسم العميل"
        );

        return;

    }


    if(!phone){

        alert(
            "اكتب رقم الهاتف"
        );

        return;

    }


    customer.name =
        name;


    customer.phone =
        phone;


    customer.address =
        document.getElementById(
            "editAddress"
        ).value.trim();


    customer.type =
        document.getElementById(
            "editType"
        ).value;


    customer.date =
        document.getElementById(
            "editDate"
        ).value;


    customer.time =
        document.getElementById(
            "editTime"
        ).value;


    customer.notes =
        document.getElementById(
            "editNotes"
        ).value.trim();


    customer.orderStatus =
        document.getElementById(
            "editOrderStatus"
        ).value;


    saveCustomers();

    closeEdit();

    renderCustomers();


    showMessage(
        "✅ تم تعديل بيانات العميل"
    );

}


/* =====================================================
   غلق التعديل
===================================================== */

function closeEdit(){

    editId = null;


    document.getElementById(
        "editModal"
    )
    .classList
    .remove("show");

}


/* =====================================================
   حذف
===================================================== */

function deleteCustomer(id){

    const customer =
        customers.find(
            c => c.id === id
        );


    if(!customer){

        return;

    }


    if(
        !confirm(
            "هل تريد حذف العميل:\n" +
            customer.name
        )
    ){

        return;

    }


    customers =
        customers.filter(
            c => c.id !== id
        );


    saveCustomers();

    renderCustomers();


    showMessage(
        "🗑️ تم حذف العميل"
    );

}


/* =====================================================
   Badge الطلبية
===================================================== */

function getOrderBadge(
    status
){

    if(status === "yes"){

        return `
            <span class="badge blue">
                📦 أخذ طلبية
            </span>
        `;

    }


    if(status === "no"){

        return `
            <span class="badge red">
                🚫 لم يأخذ طلبية
            </span>
        `;

    }


    if(status === "later1"){

        return `
            <span class="badge orange">
                ⏰ بعد ساعة
            </span>
        `;

    }


    if(status === "later2"){

        return `
            <span class="badge orange">
                ⏰ بعد ساعتين
            </span>
        `;

    }


    return "";

}


/* =====================================================
   عرض العملاء
===================================================== */

function renderCustomers(){

    const container =
        document.getElementById(
            "customers"
        );


    const search =
        document.getElementById(
            "search"
        )
        .value
        .trim()
        .toLowerCase();


    const filter =
        document.getElementById(
            "filter"
        )
        .value;


    const today =
        getToday();


    /*
        الإحصائيات
    */

    document.getElementById(
        "total"
    ).textContent =
        customers.length;


    document.getElementById(
        "calledCount"
    ).textContent =
        customers.filter(
            c =>
                getCallsToday(c) > 0
        ).length;


    document.getElementById(
        "notCalledCount"
    ).textContent =
        customers.filter(
            c =>
                getCallsToday(c) === 0
        ).length;


    document.getElementById(
        "ordersCount"
    ).textContent =
        customers.filter(
            c =>
                c.orderStatus === "yes"
        ).length;


    document.getElementById(
        "noAnswerCount"
    ).textContent =
        customers.filter(
            c =>
                c.noAnswer &&
                c.noAnswer[today]
        ).length;


    /*
        البحث والفلترة
    */

    const result =
        customers.filter(
            customer => {

                const text =
                    (
                        customer.name +
                        " " +
                        customer.phone +
                        " " +
                        (customer.address || "") +
                        " " +
                        (customer.notes || "")
                    )
                    .toLowerCase();


                if(
                    search &&
                    !text.includes(search)
                ){

                    return false;

                }


                const calls =
                    getCallsToday(
                        customer
                    );


                if(
                    filter ===
                    "notCalled" &&
                    calls > 0
                ){

                    return false;

                }


                if(
                    filter ===
                    "called" &&
                    calls === 0
                ){

                    return false;

                }


                if(
                    filter ===
                    "noAnswer" &&
                    !(
                        customer.noAnswer &&
                        customer.noAnswer[
                            today
                        ]
                    )
                ){

                    return false;

                }


                if(
                    filter ===
                    "orders" &&
                    customer.orderStatus !==
                    "yes"
                ){

                    return false;

                }


                if(
                    filter ===
                    "noOrders" &&
                    customer.orderStatus !==
                    "no"
                ){

                    return false;

                }


                return true;

            }
        );


    if(result.length === 0){

        container.innerHTML = `

            <div class="card empty">

                👥

                <br><br>

                لا يوجد عملاء

            </div>

        `;

        return;

    }


    /*
        عرض العملاء
    */

    container.innerHTML =
        result
        .map(
            customer => {

                const calls =
                    getCallsToday(
                        customer
                    );


                const called =
                    calls > 0;


                const noAnswer =
                    customer.noAnswer &&
                    customer.noAnswer[
                        today
                    ];


                return `

<div
    class="customer"
    id="customer-${customer.id}"
>


<div class="customer-header">

<div class="customer-name">

👤

${escapeHTML(
    customer.name
)}

</div>


<div class="type">

${escapeHTML(
    customer.type || "C"
)}

</div>

</div>


<div class="customer-body">


<div class="info">

<span>
📞 الهاتف:
</span>

<b>
${escapeHTML(
    customer.phone
)}
</b>

</div>


<div class="info">

<span>
📍 العنوان:
</span>

<b>

${
    escapeHTML(
        customer.address ||
        "غير محدد"
    )
}

</b>

</div>


<div class="info">

<span>
📅 موعد الاتصال:
</span>

<b>

${
    customer.date
    ?
    escapeHTML(
        customer.date
    )
    :
    "غير محدد"
}

${
    customer.time
    ?
    " - " +
    escapeHTML(
        customer.time
    )
    :
    ""
}

</b>

</div>


<div class="notes">

${
    customer.notes
    ?
    escapeHTML(
        customer.notes
    )
    :
    "لا توجد ملاحظات"
}

</div>


<div class="badges">


<span class="badge ${
    called
    ? "green"
    : "orange"
}">

${
    called
    ?
    "✅ تم الاتصال اليوم"
    :
    "⏳ لم أتصل اليوم"
}

</span>


<span class="badge blue">

📞 رنات اليوم:

${calls}

</span>


${
    noAnswer
    ?
    `
    <span class="badge red">
        ❌ لم يرد
    </span>
    `
    :
    ""
}


${getOrderBadge(
    customer.orderStatus
)}


</div>


<div class="actions">


<button
    class="action call"
    onclick="callCustomer('${customer.id}')"
>
📞 اتصال + رن
</button>


<button
    class="action whatsapp"
    onclick="whatsapp('${customer.id}')"
>
💬 واتساب
</button>


<button
    class="action called"
    onclick="markCalled('${customer.id}')"
>
✅ تم الاتصال
</button>


<button
    class="action noanswer"
    onclick="markNoAnswer('${customer.id}')"
>
❌ لم يرد
</button>


<button
    class="action order"
    onclick="setOrder(
        '${customer.id}',
        'yes'
    )"
>
📦 أخذ طلبية
</button>


<button
    class="action noorder"
    onclick="setOrder(
        '${customer.id}',
        'no'
    )"
>
🚫 لم يأخذ
</button>


<button
    class="action follow"
    onclick="setOrder(
        '${customer.id}',
        'later1'
    )"
>
⏰ بعد ساعة
</button>


<button
    class="action follow"
    onclick="setOrder(
        '${customer.id}',
        'later2'
    )"
>
⏰ بعد ساعتين
</button>


<button
    class="action edit"
    onclick="editCustomer(
        '${customer.id}'
    )"
>
✏️ تعديل
</button>


<button
    class="action delete"
    onclick="deleteCustomer(
        '${customer.id}'
    )"
>
🗑️ حذف
</button>


</div>


</div>

</div>

`;

            }
        )
        .join("");

}


/* =====================================================
   فتح كارت العميل
===================================================== */

function openCustomerCard(id){

    renderCustomers();


    const search =
        document.getElementById(
            "search"
        );


    search.value = "";


    document.getElementById(
        "filter"
    ).value = "all";


    renderCustomers();


    setTimeout(
        () => {

            const card =
                document.getElementById(
                    "customer-" + id
                );


            if(card){

                card.scrollIntoView({
                    behavior:"smooth",
                    block:"center"
                });


                card.style.outline =
                    "3px solid #22c55e";


                setTimeout(
                    () => {

                        card.style.outline =
                            "";

                    },
                    5000
                );

            }

        },
        100
    );

}

/* =====================================================

===================================================== */

function sendAppointmentNotification(
    customer
){

    playAlertSound();


    if(
        window.electronAPI
    ){

        window.electronAPI
            .showNotification({

                title:
                    "📞 موعد اتصال",

                body:
                    "حان موعد الاتصال بالعميل: " +
                    customer.name,

                customerId:
                    customer.id

            });

    }


    showMessage(
        "🔔 موعد العميل: " +
        customer.name
    );

}


/* =====================================================
   فحص المواعيد
===================================================== */

function checkAppointments(){

    const now =
        new Date();


    const today =
        getToday();


    const currentHour =
        now.getHours();


    const currentMinute =
        now.getMinutes();


    customers.forEach(
        customer => {

            if(
                !customer.date ||
                !customer.time
            ){

                return;

            }


            if(
                customer.date !== today
            ){

                return;

            }


            const parts =
                customer.time
                    .split(":");


            const hour =
                Number(parts[0]);


            const minute =
                Number(parts[1]);


            if(
                hour !== currentHour ||
                minute !== currentMinute
            ){

                return;

            }


            if(
                !customer.notified
            ){

                customer.notified = {};

            }


            const key =
                today +
                "_" +
                customer.time;


            if(
                customer.notified[key]
            ){

                return;

            }


            customer.notified[key] =
                true;


            saveCustomers();


            sendAppointmentNotification(
                customer
            );

        }
    );

}


/* =====================================================
   استقبال الضغط على الإشعار
===================================================== */

if(
    window.electronAPI
){

    window.electronAPI
        .onOpenCustomer(
            id => {

                openCustomerCard(id);

            }
        );

}

   تشغيل البرنامج

*/

*/

    )
